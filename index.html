<script>
  /* Aplica el tema guardado ANTES de pintar la página, para que no haya
     parpadeo (flash) del tema oscuro por defecto al cargar en modo claro. */
  (function(){
    try {
      var auto = localStorage.getItem('opotest-theme-auto') === '1';
      var theme;
      if (auto) {
        var h = new Date().getHours();
        // Oscuro de 21:00 a 07:59, claro el resto del día.
        theme = (h >= 21 || h < 8) ? 'dark' : 'light';
      } else {
        theme = localStorage.getItem('opotest-theme') === 'light' ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', theme);
    } catch(e){}
  })();
</script>

(function initTheme(){
  const btn = document.getElementById('themeToggleBtn');       // 🌙/☀️ manual
  const autoBtn = document.getElementById('themeAutoBtn');     // botón "Auto" independiente
  const metaTheme = document.querySelector('meta[name="theme-color"]');
  const THEME_COLORS = { dark: '#14211c', light: '#f4efe3' };

  // De 21:00 a 07:59 oscuro, el resto del día claro.
  function computeAutoTheme(){
    const h = new Date().getHours();
    return (h >= 21 || h < 8) ? 'dark' : 'light';
  }
  function getManualTheme(){
    return localStorage.getItem('opotest-theme') === 'light' ? 'light' : 'dark';
  }
  function isAutoOn(){
    return localStorage.getItem('opotest-theme-auto') === '1';
  }

  function render(){
    const auto = isAutoOn();
    const effective = auto ? computeAutoTheme() : getManualTheme();
    document.documentElement.setAttribute('data-theme', effective);
    if (metaTheme) metaTheme.setAttribute('content', THEME_COLORS[effective] || THEME_COLORS.dark);

    if (btn) {
      btn.textContent = effective === 'light' ? '☀️' : '🌙';
      btn.disabled = auto;
      btn.title = auto
        ? 'El tema lo decide el modo automático por hora (desactívalo para cambiarlo a mano)'
        : (effective === 'light' ? 'Cambiar a tema oscuro' : 'Cambiar a tema claro');
    }
    if (autoBtn) {
      autoBtn.classList.toggle('active', auto);
      autoBtn.setAttribute('aria-pressed', auto ? 'true' : 'false');
      autoBtn.title = auto
        ? 'Cambio automático por hora: ACTIVADO (oscuro de 21:00 a 08:00, claro el resto del día). Pulsa para desactivarlo.'
        : 'Cambio automático por hora: desactivado. Pulsa para activarlo (oscuro de 21:00 a 08:00, claro el resto del día).';
    }
  }

  render();

  if (btn) {
    btn.addEventListener('click', () => {
      if (isAutoOn()) return; // mientras el modo automático está activo, el botón manual está bloqueado
      const next = getManualTheme() === 'light' ? 'dark' : 'light';
      try { localStorage.setItem('opotest-theme', next); } catch(e){}
      render();
    });
  }

  if (autoBtn) {
    autoBtn.addEventListener('click', () => {
      const next = !isAutoOn();
      try { localStorage.setItem('opotest-theme-auto', next ? '1' : '0'); } catch(e){}
      render();
    });
  }

  // Con el modo automático activo, revisa la hora cada minuto y al volver a la pestaña,
  // para que el cambio día/noche se note sin tener que recargar la página.
  setInterval(() => { if (isAutoOn()) render(); }, 60 * 1000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && isAutoOn()) render();
  });
})();

/* ===== Texto enriquecido en las explicaciones =====
   La explicación sigue guardándose como un string normal (compatible con todo lo que ya
   tienes guardado). Las marcas son:
     **negrita**   __subrayado__   ==resaltado==   {rojo:texto} {verde:texto} {azul:texto}
   Se convierten a elementos del DOM con createElement/textContent (nunca innerHTML), así que
   no hay riesgo de inyectar HTML. Una marca sin pareja se muestra tal cual, como texto. */
function richTokens(text){
  const s = String(text==null?'':text);
  const toks = [];
  let buf = '', i = 0;
  const flush = ()=>{ if(buf){ toks.push({t:'text', raw:buf}); buf=''; } };
  while(i < s.length){
    const two = s.substr(i,2);
    if(two==='**' || two==='__' || two==='=='){ flush(); toks.push({t:'m', k:two, raw:two}); i+=2; continue; }
    if(s[i]==='{'){
      const m = /^\{(rojo|verde|azul):/.exec(s.slice(i, i+8));
      if(m){ flush(); toks.push({t:'open', k:m[1], raw:m[0]}); i+=m[0].length; continue; }
    }
    if(s[i]==='}'){ flush(); toks.push({t:'close', raw:'}'}); i++; continue; }
    buf += s[i]; i++;
  }
  flush();
  const stack = [];
  toks.forEach((tk, idx)=>{
    const top = stack.length ? stack[stack.length-1] : -1;
    if(tk.t==='m'){
      if(top>=0 && toks[top].t==='m' && toks[top].k===tk.k){
        // Pareja vacía pegada (p. ej. "____" de un hueco a rellenar): se deja como texto literal.
        if(top===idx-1){ stack.pop(); return; }
        toks[top].pair = idx; tk.pair = top; tk.closing = true; stack.pop();
      } else stack.push(idx);
    } else if(tk.t==='open'){
      stack.push(idx);
    } else if(tk.t==='close'){
      if(top>=0 && toks[top].t==='open'){
        // "{rojo:}" vacío: se deja como texto literal
        if(top===idx-1){ stack.pop(); return; }
        toks[top].pair = idx; tk.pair = top; tk.closing = true; stack.pop();
      }
    }
  });
  return toks;
}
function hasRich(text){ return richTokens(text).some(t=>t.pair!==undefined); }
function renderRich(text, host){
  const stack = [host];
  richTokens(text).forEach(tk=>{
    const cur = stack[stack.length-1];
    if(tk.t==='text' || tk.pair===undefined){ cur.appendChild(document.createTextNode(tk.raw)); return; }
    if(tk.closing){ stack.pop(); return; }
    let el;
    if(tk.t==='m'){
      el = document.createElement(tk.k==='**' ? 'strong' : (tk.k==='==' ? 'mark' : 'span'));
      if(tk.k==='__') el.className = 'rt-u';
      if(tk.k==='==') el.className = 'rt-h';
    } else { el = document.createElement('span'); el.className = 'rt-c-'+tk.k; }
    cur.appendChild(el); stack.push(el);
  });
  return host;
}
// Texto plano (sin marcas): para encuestas de Telegram y vistas previas de texto.
function stripRich(text){
  return richTokens(text).map(tk => (tk.t!=='text' && tk.pair!==undefined) ? '' : tk.raw).join('');
}
// Para mensajes de Telegram (parse_mode HTML): admite negrita y subrayado; el resaltado y
// los colores no existen en Telegram, así que se quitan y queda el texto normal.
function richToTelegramHTML(text){
  return richTokens(text).map(tk=>{
    if(tk.t==='text' || tk.pair===undefined) return escapeTelegramHTML(tk.raw);
    if(tk.t==='m' && tk.k==='**') return tk.closing ? '</b>' : '<b>';
    if(tk.t==='m' && tk.k==='__') return tk.closing ? '</u>' : '<u>';
    return '';
  }).join('');
}
function richToggleWrap(ta, open, close){
  const v = ta.value, s = ta.selectionStart, e = ta.selectionEnd, sel = v.slice(s,e);
  let nv, ns, ne;
  if(s>=open.length && v.slice(s-open.length, s)===open && v.slice(e, e+close.length)===close){
    nv = v.slice(0, s-open.length) + sel + v.slice(e+close.length); ns = s-open.length; ne = ns+sel.length;
  } else if(sel.length>=open.length+close.length && sel.startsWith(open) && sel.endsWith(close)){
    const inner = sel.slice(open.length, sel.length-close.length);
    nv = v.slice(0,s) + inner + v.slice(e); ns = s; ne = s+inner.length;
  } else {
    nv = v.slice(0,s) + open + sel + close + v.slice(e); ns = s+open.length; ne = ns+sel.length;
  }
  ta.value = nv; ta.setSelectionRange(ns, ne);
}
function richApplyColor(ta, color){
  const v = ta.value, s = ta.selectionStart, e = ta.selectionEnd, sel = v.slice(s,e);
  const before = v.slice(0,s), after = v.slice(e);
  const m = /\{(rojo|verde|azul):$/.exec(before);
  let nv, ns;
  if(m && after.startsWith('}')){
    const base = before.slice(0, before.length-m[0].length);
    if(m[1]===color){ nv = base + sel + after.slice(1); ns = base.length; }          // mismo color: lo quita
    else { nv = base + '{'+color+':' + sel + after; ns = base.length + color.length + 2; } // cambia de color
  } else {
    nv = before + '{'+color+':' + sel + '}' + after; ns = s + color.length + 2;
  }
  ta.value = nv; ta.setSelectionRange(ns, ns+sel.length);
}
// Campo de explicación con barra de formato (negrita, subrayado, resaltado, 3 colores) y
// vista previa. opts: { label, placeholder, get(), set(valor) }.
function buildRichExplField(opts){
  const field = document.createElement('div'); field.className = 'test-field';
  const lab = document.createElement('label'); lab.textContent = opts.label || 'Explicación (opcional)';
  field.appendChild(lab);

  const ta = document.createElement('textarea');
  ta.value = opts.get() || '';
  if(opts.placeholder) ta.placeholder = opts.placeholder;

  const prev = document.createElement('div'); prev.className = 'rt-preview';
  const paintPrev = ()=>{
    prev.textContent = '';
    if(!hasRich(ta.value)){ prev.style.display = 'none'; return; }
    prev.style.display = '';
    const cap = document.createElement('span'); cap.className = 'rt-cap'; cap.textContent = 'Así se verá';
    const body = document.createElement('div');
    renderRich(ta.value, body);
    prev.appendChild(cap); prev.appendChild(body);
  };
  const changed = ()=>{ opts.set(ta.value); paintPrev(); };
  ta.addEventListener('input', changed);
  const run = (fn)=>{ fn(); changed(); ta.focus(); };

  const bar = document.createElement('div'); bar.className = 'rt-bar';
  const addBtn = (inner, title, onClick)=>{
    const b = document.createElement('button'); b.type = 'button'; b.className = 'rt-btn';
    b.title = title; b.setAttribute('aria-label', title);
    if(typeof inner === 'string') b.textContent = inner; else b.appendChild(inner);
    b.addEventListener('mousedown', ev=>ev.preventDefault()); // no quitar la selección del textarea
    b.addEventListener('click', ()=>run(onClick));
    bar.appendChild(b);
    return b;
  };
  const bB = document.createElement('strong'); bB.textContent = 'B';
  addBtn(bB, 'Negrita (Ctrl+B)', ()=>richToggleWrap(ta,'**','**'));
  const bU = document.createElement('span'); bU.className = 'rt-u'; bU.textContent = 'U';
  addBtn(bU, 'Subrayado (Ctrl+U)', ()=>richToggleWrap(ta,'__','__'));
  const bH = document.createElement('span'); bH.className = 'rt-h'; bH.textContent = 'ab';
  addBtn(bH, 'Resaltar', ()=>richToggleWrap(ta,'==','=='));
  [['rojo','Texto en rojo'],['verde','Texto en verde'],['azul','Texto en azul']].forEach(([c,t])=>{
    const dot = document.createElement('span'); dot.className = 'rt-dot '+c;
    addBtn(dot, t, ()=>richApplyColor(ta, c));
  });
  const hint = document.createElement('span'); hint.className = 'rt-hint'; hint.textContent = 'Selecciona texto y pulsa un botón';
  bar.appendChild(hint);

  ta.addEventListener('keydown', ev=>{
    if((ev.ctrlKey || ev.metaKey) && !ev.shiftKey && !ev.altKey){
      const k = ev.key.toLowerCase();
      if(k==='b'){ ev.preventDefault(); run(()=>richToggleWrap(ta,'**','**')); }
      else if(k==='u'){ ev.preventDefault(); run(()=>richToggleWrap(ta,'__','__')); }
    }
  });

  field.appendChild(bar);
  field.appendChild(ta);
  field.appendChild(prev);
  paintPrev();
  return field;
}

/* ===================== BANCO DE TESTS (Firestore: users/{uid}/testQuestions) ===================== */
// Cada pregunta es su propio documento (igual que en Operación Baeza), así el banco puede
// crecer a miles de preguntas sin tocar el límite de 1 MB por documento de Firestore.
//
// SINCRONIZACIÓN INCREMENTAL: en vez de descargar el banco entero cada vez que se abre la
// app (lo que dispara una lectura de Firestore por cada pregunta guardada), guardamos en este
// dispositivo la última vez que sincronizamos ("lastSync") y, en cada apertura, solo pedimos a
// Firestore las preguntas cuyo campo `actualizado` sea posterior a esa marca. El resto del
// banco sale de la copia local (localStorage), que se combina con lo nuevo/modificado.
// Los borrados se hacen "blandos" (campo `borrado:true`) para que también viajen como una
// actualización normal y el dispositivo los recoja en la siguiente sincronización; no hace
// falta guardar una lista aparte de "preguntas borradas".
function testBankCacheKey(){ return 'opotest_cache_'+currentUid; }
function testBankPendingKey(){ return 'opotest_pending_'+currentUid; }
function testBankLastSyncKey(){ return 'opotest_lastsync_'+currentUid; }
function getTestBankPending(){ try{ return JSON.parse(localStorage.getItem(testBankPendingKey())||'[]'); }catch(e){ return []; } }
function setTestBankPending(arr){ try{ localStorage.setItem(testBankPendingKey(), JSON.stringify(arr)); }catch(e){} }
function queueTestBankPending(op){
  const arr = getTestBankPending().filter(o=>o.id!==op.id);
  arr.push(op);
  setTestBankPending(arr);
}
// localStorage suele tener un límite de 5-10 MB por dominio, y el banco completo (incluidas las
// imágenes de Psicotécnicos en base64) se guarda entero ahí para poder abrir la app sin conexión.
// Si algún día se llena, `setItem` no falla en silencio "más o menos": lanza una excepción
// (típicamente QuotaExceededError) que antes se tragaba un `catch(e){}` vacío. Centralizamos
// aquí el guardado para detectar ese fallo y avisar, en vez de descubrirlo el día que se necesite
// abrir la app sin conexión y falte la mitad del banco.
let localCacheWriteFailed = false;
function safeLocalStorageSet(key, value){
  try{ localStorage.setItem(key, value); return true; }
  catch(e){ console.error('No se pudo guardar en localStorage (¿lleno?)', e); return false; }
}
function refreshLocalCacheWarnBadge(){
  const el = document.getElementById('localCacheWarnIndicator');
  if(el) el.style.display = localCacheWriteFailed ? 'inline-flex' : 'none';
}
function cacheTestBankLocally(){
  const ok = safeLocalStorageSet(testBankCacheKey(), JSON.stringify(state.testBank.questions));
  if(!ok && !localCacheWriteFailed){
    localCacheWriteFailed = true;
    showToast('⚠ El banco ya no cabe en el almacenamiento local del dispositivo: descarga una copia de seguridad (JSON) cuanto antes, en Ajustes.');
  } else if(ok && localCacheWriteFailed){
    localCacheWriteFailed = false; // p.ej. tras liberar espacio o cambiar de dispositivo
  }
  refreshLocalCacheWarnBadge();
  if(typeof programarRefrescoTamano === 'function') programarRefrescoTamano();
  return ok;
}
function getTestBankLastSync(){ try{ const v = localStorage.getItem(testBankLastSyncKey()); return v ? Number(v) : 0; }catch(e){ return 0; } }
function setTestBankLastSync(ms){ try{ localStorage.setItem(testBankLastSyncKey(), String(ms)); }catch(e){} }
function loadTestBankFromCache(){
  try{
    const cached = localStorage.getItem(testBankCacheKey());
    if(cached){ state.testBank.questions = JSON.parse(cached); return true; }
  }catch(e){}
  return false;
}

async function loadTestBank(){
  if(!firebaseOk || !currentUid) return;
  const hasCache = loadTestBankFromCache();
  const lastSync = getTestBankLastSync();
  // Margen de seguridad para no perder ninguna pregunta por pequeños desfases de reloj entre
  // dispositivos: en vez de fijar la nueva marca justo en el instante de la consulta, la
  // retrasamos unos segundos. En el peor caso se vuelve a pedir alguna pregunta ya conocida
  // (no pasa nada, se sobrescribe con el mismo dato), pero nunca nos dejamos ninguna sin traer.
  const SAFETY_MARGIN_MS = 5000;
  const syncStart = Date.now();
  try{
    let snap;
    if(hasCache && lastSync>0){
      // Sincronización incremental: solo lo nuevo/modificado/borrado desde la última vez.
      snap = await db.collection('users').doc(bankOwnerUid()).collection('testQuestions')
        .where('actualizado', '>', lastSync).get();
    } else {
      // Primera vez en este dispositivo (o venimos de una versión sin sincronización
      // incremental): traemos el banco completo una única vez para tener una base fiable.
      snap = await db.collection('users').doc(bankOwnerUid()).collection('testQuestions').get();
    }
    if(!hasCache || lastSync===0 || !snap.empty){
      const map = new Map((state.testBank.questions||[]).map(q=>[q.id, q]));
      snap.forEach(doc=>{
        const data = doc.data();
        if(data.borrado){ map.delete(data.id || doc.id); }
        else { map.set(data.id || doc.id, data); }
      });
      state.testBank.questions = Array.from(map.values());
      cacheTestBankLocally();
    }
    setTestBankLastSync(syncStart - SAFETY_MARGIN_MS);
  }catch(e){
    console.error(e);
    if(!hasCache){
      try{
        const cached = localStorage.getItem(testBankCacheKey());
        if(cached) state.testBank.questions = JSON.parse(cached);
      }catch(e2){}
    }
  }
}
async function saveTestQuestionRemote(q){
  if(!isAdmin) return; // los usuarios no-admin no pueden modificar el banco, solo practicar
  q.actualizado = Date.now();
  if(typeof q.borrado === 'undefined') q.borrado = false;
  cacheTestBankLocally();
  if(!firebaseOk || !currentUid) return;
  setSaveStatus('saving');
  try{
    await db.collection('users').doc(bankOwnerUid()).collection('testQuestions').doc(q.id).set(q);
    setSaveStatus('saved');
    setTimeout(()=>{
      const el = document.getElementById('saveIndicator');
      if(el && el.classList.contains('state-saved')) setSaveStatus('idle');
    }, 2000);
  }catch(e){
    console.error(e);
    queueTestBankPending({type:'set', id:q.id, data:q});
    setSaveStatus('error', 'Sin conexión · se guardará al reconectar');
    showToast('Sin conexión: la pregunta se guardó en este dispositivo y se sincronizará después.');
  }
}
async function deleteTestQuestionRemote(id){
  if(!isAdmin) return; // los usuarios no-admin no pueden modificar el banco, solo practicar
  cacheTestBankLocally();
  const patch = {borrado:true, actualizado:Date.now()};
  if(!firebaseOk || !currentUid) return;
  try{
    await db.collection('users').doc(bankOwnerUid()).collection('testQuestions').doc(id).set(patch, {merge:true});
  }catch(e){
    console.error(e);
    queueTestBankPending({type:'delete', id, data:patch});
    showToast('Sin conexión: se borró en este dispositivo y se sincronizará después.');
  }
}
// ---- Papelera de preguntas borradas ----------------------------------------------------
// loadTestBank() ya purga del estado local (y del cache) cualquier pregunta que llegue marcada
// como borrado:true (ver el `map.delete` de más arriba), así que el soft-delete de Firestore no
// sirve por sí solo para poder recuperarla desde este dispositivo. Mantenemos aquí, en un
// localStorage aparte, una copia de las últimas preguntas eliminadas a mano desde el Banco
// (con fecha de borrado) para poder listarlas y restaurarlas sin tocar Firestore para nada.
const TESTBANK_TRASH_DIAS = 30;
function testBankTrashKey(){ return 'opotest_trash_'+currentUid; }
function getTestBankTrashRaw(){ try{ return JSON.parse(localStorage.getItem(testBankTrashKey())||'[]'); }catch(e){ return []; } }
function setTestBankTrash(arr){ try{ localStorage.setItem(testBankTrashKey(), JSON.stringify(arr)); }catch(e){} }
// Devuelve la papelera ya filtrada a los últimos TESTBANK_TRASH_DIAS días (y aprovecha para
// limpiar del almacenamiento local lo que ya haya caducado), ordenada de más a menos reciente.
function getTestBankTrash(){
  const cutoff = Date.now() - TESTBANK_TRASH_DIAS*24*60*60*1000;
  const raw = getTestBankTrashRaw();
  const kept = raw.filter(t=>t.deletedAt >= cutoff);
  if(kept.length !== raw.length) setTestBankTrash(kept);
  return kept.sort((a,b)=>b.deletedAt-a.deletedAt);
}
function addToTestBankTrash(q){
  try{
    const clone = JSON.parse(JSON.stringify(q));
    clone.borrado = false;
    const arr = getTestBankTrashRaw().filter(t=>!t.q || t.q.id!==q.id);
    arr.unshift({q:clone, deletedAt: Date.now()});
    setTestBankTrash(arr);
  }catch(e){ console.error(e); }
}
async function restoreTestBankTrashItem(id){
  const arr = getTestBankTrashRaw();
  const idx = arr.findIndex(t=>t.q && t.q.id===id);
  if(idx<0) return;
  const entry = arr[idx];
  arr.splice(idx,1);
  setTestBankTrash(arr);
  const q = entry.q;
  q.borrado = false;
  if(!state.testBank.questions.some(x=>x.id===q.id)) state.testBank.questions.push(q);
  cacheTestBankLocally();
  await saveTestQuestionRemote(q);
  showToast('Pregunta restaurada ✓');
  renderTests();
}
async function trySyncTestBankPending(){
  if(!isAdmin || !firebaseOk || !currentUid || !navigator.onLine) return;
  const arr = getTestBankPending();
  if(!arr.length) return;
  const remaining = [];
  for(const op of arr){
    try{
      const ref = db.collection('users').doc(bankOwnerUid()).collection('testQuestions').doc(op.id);
      if(op.type==='delete') await ref.set(op.data || {borrado:true, actualizado:Date.now()}, {merge:true});
      else await ref.set(op.data);
    }catch(e){ remaining.push(op); }
  }
  setTestBankPending(remaining);
  if(!remaining.length) setSaveStatus('saved');
}

// número fijo, así que si se añade o quita un tema el resto de la app se entera automáticamente.

/* ===================== TEMARIO: persistencia (Firestore: users/{ADMIN_UID}/config/temario) ===================== */
// Un único documento con el temario completo de todas las categorías. Solo la cuenta admin
// puede escribirlo (mismo criterio que el banco de preguntas); el resto de cuentas lo leen
// para poder practicar por tema/subtema. Se guarda también en localStorage para abrir sin red.
function temarioCacheKey(){ return 'opotest_temario_'+currentUid; }
function loadTemarioFromCache(){
  try{
    const cached = localStorage.getItem(temarioCacheKey());
    if(cached){ state.temario = JSON.parse(cached); return true; }
  }catch(e){}
  return false;
}
function cacheTemarioLocally(){ try{ localStorage.setItem(temarioCacheKey(), JSON.stringify(state.temario)); }catch(e){} }
async function loadTemario(){
  const hasCache = loadTemarioFromCache();
  if(!hasCache) state.temario = cloneTemario(DEFAULT_TEMARIO);
  if(!firebaseOk || !currentUid) return;
  try{
    const snap = await db.collection('users').doc(bankOwnerUid()).collection('config').doc('temario').get();
    if(snap.exists && snap.data() && snap.data().categorias){
      state.temario = snap.data().categorias;
      // Si el código de la app ha añadido una categoría nueva desde la última vez que se guardó
      // el temario en Firestore (p.ej. "Inglés con Pilar"), se rellena aquí con el temario por
      // defecto de esa categoría, para no depender de que alguien la teclee entera a mano.
      let faltaAlguna = false;
      Object.keys(DEFAULT_TEMARIO).forEach(cat=>{
        if(!Array.isArray(state.temario[cat]) || !state.temario[cat].length){
          state.temario[cat] = cloneTemario(DEFAULT_TEMARIO)[cat];
          faltaAlguna = true;
        }
      });
      cacheTemarioLocally();
      if(faltaAlguna && isAdmin) await saveTemarioRemote();
    } else if(isAdmin){
      // Primera vez que se usa esta cuenta: sembramos el temario por defecto en Firestore
      // para que también lo vean el resto de cuentas que practican con este banco.
      await saveTemarioRemote();
    }
  }catch(e){ console.error('No se pudo cargar el temario remoto', e); }
}
async function saveTemarioRemote(){
  if(!isAdmin) return;
  cacheTemarioLocally();
  if(!firebaseOk || !currentUid) return;
  try{
    await db.collection('users').doc(bankOwnerUid()).collection('config').doc('temario')
      .set({ categorias: state.temario, actualizado: Date.now() });
  }catch(e){
    console.error(e);
    showToast('Sin conexión: los cambios del temario se guardaron en este dispositivo y se sincronizarán después.');
  }
}

// Ortografía: la pregunta es una frase; dentro de ella se marcan (con clic) 4 palabras,
// que quedan subrayadas y numeradas 1-4 en el propio texto. Cada palabra marcada guarda
// también su posición (idx = nº de palabra dentro de la frase, empezando en 0), para poder
// volver a subrayarla en el mismo sitio al mostrar la pregunta.
function emptyOrtoPalabras(){ return [0,1,2,3].map(()=>({texto:'', incorrecta:false})); } // formato antiguo (compatibilidad)
// Divide una frase en fragmentos alternos [separador, palabra, separador, palabra, ..., separador].
// Las palabras quedan siempre en las posiciones impares (parts[1], parts[3], ...), así que la
// "palabra nº k" (k=0,1,2...) está siempre en parts[1+2k]. Soporta tildes, ñ, apóstrofos y guiones.
function fraseParts(str){
  return String(str||'').split(/([A-Za-zÀ-ÖØ-öø-ÿ0-9]+(?:['’-][A-Za-zÀ-ÖØ-öø-ÿ0-9]+)*)/);
}
// Comprueba que las 4 "palabras" de una pregunta de ortografía apuntan (por idx) a palabras
// reales de la frase actual y con el mismo texto: es el formato nuevo (clic dentro de la frase).
// Si no, es una pregunta antigua (4 palabras sueltas sin frase) y se sigue mostrando como antes.
function ortoEsFormatoNuevo(enunciado, palabras){
  if(!enunciado || !palabras || palabras.length!==4) return false;
  const parts = fraseParts(enunciado);
  return palabras.every(p=> typeof p.idx==='number' && parts[1+2*p.idx]===p.texto);
}
// Pinta una frase (solo lectura) con sus 4 palabras subrayadas y numeradas.
// opts.mostrarVerdad=true colorea en verde/rojo según p.incorrecta (para preview y corrección).
function pintarFraseConPalabras(container, enunciado, palabras, opts){
  opts = opts || {};
  container.innerHTML = '';
  container.classList.add('tq-orto-frase');
  container.classList.toggle('verdad', !!opts.mostrarVerdad);
  const parts = fraseParts(enunciado);
  const porIdx = new Map();
  palabras.forEach((p,i)=>{ if(typeof p.idx==='number') porIdx.set(p.idx, {num:i+1, p}); });
  for(let i=0;i<parts.length;i++){
    if(i%2===1){
      const wordIdx = (i-1)/2;
      const info = porIdx.get(wordIdx);
      if(info){
        const span = document.createElement('span'); span.className = 'tq-orto-word'+(opts.mostrarVerdad ? (info.p.incorrecta?' mal':' bien') : '');
        span.textContent = parts[i];
        const sup = document.createElement('sup'); sup.className='tq-orto-num'; sup.textContent = info.num;
        container.appendChild(span); container.appendChild(sup);
      } else if(parts[i]) container.appendChild(document.createTextNode(parts[i]));
    } else if(parts[i]) container.appendChild(document.createTextNode(parts[i]));
  }
}
// Constructor interactivo: escribe la frase y haz clic en hasta 4 palabras para marcarlas
// (quedan subrayadas y numeradas por orden de clic); luego se indica cuáles están mal escritas.
// st = {enunciado:string, seleccion:[{idx,texto,incorrecta}, ...]} (mutado en el sitio).
function renderOrtoBuilder(host, st, onChange){
  host.innerHTML = '';
  const enunField = document.createElement('div'); enunField.className='test-field';
  enunField.innerHTML = '<label>Frase (escribe la frase completa; luego haz clic en las 4 palabras a valorar)</label>';
  const enunTa = document.createElement('textarea'); enunTa.value = st.enunciado; enunTa.placeholder='Escribe aquí la frase completa…';
  enunField.appendChild(enunTa);
  host.appendChild(enunField);

  const sentWrap = document.createElement('div'); sentWrap.className='tq-orto-builder-sentence';
  host.appendChild(sentWrap);
  const hint = document.createElement('div'); hint.className='tq-orto-hint';
  host.appendChild(hint);
  const malosWrap = document.createElement('div');
  host.appendChild(malosWrap);

  function paintSentence(){
    sentWrap.innerHTML = '';
    if(!st.enunciado.trim()){
      sentWrap.innerHTML = '<span style="color:var(--cream-dim);font-family:var(--font-mono);font-size:12px;">Escribe la frase arriba…</span>';
      hint.textContent = '';
      return;
    }
    const parts = fraseParts(st.enunciado);
    const porIdx = new Map(st.seleccion.map((s,i)=>[s.idx, i]));
    for(let i=0;i<parts.length;i++){
      if(i%2===1){
        const wordIdx = (i-1)/2;
        const text = parts[i];
        const span = document.createElement('span'); span.className='tq-orto-clickword';
        const selIdx = porIdx.get(wordIdx);
        if(selIdx!==undefined){
          span.classList.add('marcada');
          span.appendChild(document.createTextNode(text));
          const sup = document.createElement('sup'); sup.textContent = selIdx+1; span.appendChild(sup);
        } else {
          span.textContent = text;
        }
        span.onclick = ()=>{
          const already = st.seleccion.findIndex(s=>s.idx===wordIdx);
          if(already>=0){ st.seleccion.splice(already,1); }
          else {
            if(st.seleccion.length>=4){ showToast('Ya has marcado 4 palabras. Quita alguna (haz clic en ella) para elegir otra.'); return; }
            st.seleccion.push({idx:wordIdx, texto:text, incorrecta:false});
          }
          paintSentence(); paintMalos();
          if(onChange) onChange();
        };
        sentWrap.appendChild(span);
      } else if(parts[i]) sentWrap.appendChild(document.createTextNode(parts[i]));
    }
    const n = st.seleccion.length;
    hint.textContent = n<4 ? `Haz clic en ${4-n} palabra(s) más de la frase (llevas ${n}/4 marcadas).` : 'Palabras marcadas: 4/4. Si te has equivocado, haz clic en una para quitarla.';
  }
  function paintMalos(){
    malosWrap.innerHTML = '';
    if(st.seleccion.length!==4) return;
    const label = document.createElement('div'); label.className='test-field';
    label.innerHTML = '<label>¿Cuáles de las 4 están MAL escritas? (pueden ser ninguna, alguna, o las 4)</label>';
    malosWrap.appendChild(label);
    const row = document.createElement('div'); row.className='tq-orto-answer-row';
    st.seleccion.forEach((s,i)=>{
      const chip = document.createElement('button'); chip.type='button'; chip.className='tq-orto-chip'+(s.incorrecta?' mal':'');
      chip.textContent = (i+1)+'. '+s.texto+(s.incorrecta?' ✕ mal':' ✓ bien');
      chip.onclick = ()=>{ s.incorrecta = !s.incorrecta; paintMalos(); if(onChange) onChange(); };
      row.appendChild(chip);
    });
    malosWrap.appendChild(row);
  }
  enunTa.oninput = ()=>{
    st.enunciado = enunTa.value;
    st.seleccion = []; // si cambia la frase, hay que volver a marcar las palabras
    paintSentence(); paintMalos();
    if(onChange) onChange();
  };
  paintSentence();
  paintMalos();
}

// Crea (o reutiliza) una sección <details> plegable dentro de container, cuyo estado abierto/cerrado
// se recuerda en stateObj[key] entre renders (si no, cada renderTests() la volvería a colapsar).
// Devuelve el <div> interno donde meter el contenido de la sección.
// Campo de opción de respuesta que crece verticalmente en vez de hacer scroll horizontal: así
// nunca se pierde el final de una opción larga (antes eran <input type="text"> de una sola línea).
function createOptionTextarea(value, placeholder, onInput){
  const ta = document.createElement('textarea');
  ta.className = 'test-opt-textarea';
  ta.value = value; if(placeholder) ta.placeholder = placeholder;
  ta.rows = 1;
  const autoGrow = ()=>{ ta.style.height='auto'; ta.style.height = ta.scrollHeight+'px'; };
  ta.oninput = ()=>{ onInput(ta.value); autoGrow(); };
  // El auto-crecido inicial se hace tras insertarla en el DOM (con textarea desconectada
  // scrollHeight no es fiable), así que se dispara en el siguiente frame.
  requestAnimationFrame(autoGrow);
  return ta;
}
function createCollapsible(container, titleHtml, stateObj, key, defaultOpen){
  if(stateObj[key]===undefined) stateObj[key] = !!defaultOpen;
  const det = document.createElement('details'); det.className='test-collapsible';
  det.open = !!stateObj[key];
  det.ontoggle = ()=>{ stateObj[key] = det.open; };
  const sum = document.createElement('summary'); sum.innerHTML = titleHtml;
  det.appendChild(sum);
  const bodyDiv = document.createElement('div'); bodyDiv.className='test-collapsible-body';
  det.appendChild(bodyDiv);
  container.appendChild(det);
  return bodyDiv;
}

   guardar en el banco si se cierra la pestaña o falla algo. Se guarda solo en este dispositivo,

function genDraftKey(){ return 'opotest_gendraft_'+currentUid; }
function persistGenDraft(){
  try{
    if(testsGenState.candidatos.length) localStorage.setItem(genDraftKey(), JSON.stringify(testsGenState.candidatos));
    else localStorage.removeItem(genDraftKey());
  }catch(e){}
}
function tryRestoreGenDraft(){
  if(testsGenState.draftChecked) return;
  testsGenState.draftChecked = true;
  if(testsGenState.candidatos.length) return; // ya hay algo en memoria, no pisarlo
  try{
    const raw = localStorage.getItem(genDraftKey());
    if(raw){
      const arr = JSON.parse(raw);
      if(Array.isArray(arr) && arr.length){
        testsGenState.candidatos = arr;
        showToast('Se recuperó un borrador con '+arr.length+' pregunta(s) generada(s) sin guardar ✓');
      }
    }
  }catch(e){}
}

const OBJETIVO_DEFECTO = 10;

// Umbral de aciertos para dar por "superado" un subtema, por categoría. Se usa en el bloque
// "Inglés con Pilar" (32 lecciones × 4 test de 20 preguntas cada uno): con 18 aciertos o más
// en un intento, ese test se marca en verde en el selector de temas. Categorías sin entrada
// aquí no muestran ninguna marca (comportamiento igual que antes de añadir esto).
const UMBRAL_SUPERADO = { ingles_pilar: 18 };
function claveSuperado(categoria, tema, subtema){ return categoria+'|'+tema+'|'+subtema; }
function mejorAciertosSubtema(categoria, tema, subtema){ const e = progreso.superados[claveSuperado(categoria,tema,subtema)]; return e ? e.ac : 0; }
function subtemaSuperado(categoria, tema, subtema){
  const umbral = UMBRAL_SUPERADO[categoria];
  if(!umbral) return false;
  return mejorAciertosSubtema(categoria, tema, subtema) >= umbral;
}
function fmtFechaKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function progresoVacio(){ return { dias:[], porDia:{}, objetivo:OBJETIVO_DEFECTO, objetivoTs:0, historial:[], examenFecha:'', examenTs:0, notas:{}, marcadas:{}, simulacros:[], superados:{}, actualizado:0 }; }
let progreso = progresoVacio();
let progresoTimer = null, progresoSinPermiso = false;
function progresoKey(){ return 'opotest_progreso_'+(currentUid||'anon'); }
// Nombre de ESTE dispositivo (para la comparativa entre dispositivos). Se guarda solo en
// este navegador (no se sincroniza): cada aparato puede tener su propio nombre. Si nunca
// se ha puesto uno, se propone un nombre por defecto según el tamaño de pantalla.
function dispositivoKey(){ return 'opotest-device-name'; }
function nombreDispositivoPorDefecto(){
  try{ return (window.matchMedia && window.matchMedia('(pointer:coarse)').matches) ? 'Móvil' : 'Ordenador'; }
  catch(e){ return 'Este dispositivo'; }
}
function nombreDispositivo(){
  try{
    const v = localStorage.getItem(dispositivoKey());
    if(v && v.trim()) return v.trim().slice(0,30);
  }catch(e){}
  return nombreDispositivoPorDefecto();
}
function cambiarNombreDispositivo(v){
  try{ localStorage.setItem(dispositivoKey(), String(v||'').trim().slice(0,30) || nombreDispositivoPorDefecto()); }catch(e){}
}
function normalizaProgreso(p){
  const o = progresoVacio();
  if(!p || typeof p!=='object') return o;
  if(Array.isArray(p.dias)) o.dias = p.dias.filter(x=>typeof x==='string');
  if(p.porDia && typeof p.porDia==='object') Object.keys(p.porDia).forEach(k=>{ const v = Number(p.porDia[k]); if(isFinite(v) && v>0) o.porDia[k] = v; });
  const ob = Number(p.objetivo); if(isFinite(ob) && ob>=1) o.objetivo = Math.min(500, Math.round(ob));
  o.objetivoTs = Number(p.objetivoTs)||0;
  if(Array.isArray(p.historial)) o.historial = p.historial.filter(h=>h && h.id && isFinite(Number(h.t))).map(h=>({id:String(h.id), t:Number(h.t), n:Number(h.n)||0, ac:Number(h.ac)||0, dv:(typeof h.dv==='string' ? h.dv.slice(0,30) : '')}));
  if(typeof p.examenFecha==='string' && /^\d{4}-\d{2}-\d{2}$/.test(p.examenFecha)) o.examenFecha = p.examenFecha;
  o.examenTs = Number(p.examenTs)||0;
  // Notas personales y preguntas marcadas ⭐: por pregunta, con marca de tiempo para poder fusionar dispositivos.
  if(p.notas && typeof p.notas==='object') Object.keys(p.notas).forEach(k=>{ const v = p.notas[k]; if(v && typeof v==='object') o.notas[k] = { x:String(v.x||'').slice(0,1500), t:Number(v.t)||0 }; });
  if(p.marcadas && typeof p.marcadas==='object') Object.keys(p.marcadas).forEach(k=>{ const v = p.marcadas[k]; if(v && typeof v==='object') o.marcadas[k] = { m:!!v.m, t:Number(v.t)||0 }; });
  // Mejor intento por subtema (p.ej. "ingles_pilar|3|2" = Lección 3, Test 2): para marcar en verde
  // en el selector de temas los test ya superados (ver UMBRAL_SUPERADO).
  if(p.superados && typeof p.superados==='object') Object.keys(p.superados).forEach(k=>{ const v = p.superados[k]; if(v && typeof v==='object'){ const ac=Number(v.ac), n=Number(v.n); if(isFinite(ac) && ac>=0) o.superados[k] = { ac, n:(isFinite(n)?n:0), t:Number(v.t)||0 }; } });
  if(Array.isArray(p.simulacros)) o.simulacros = p.simulacros.filter(x=>x && x.id && isFinite(Number(x.t))).map(x=>({ id:String(x.id), t:Number(x.t), tipo:(x.tipo==='psico'?'psico':'con'), nota:Number(x.nota)||0, max:Number(x.max)||0, apto:(x.apto===true?true:(x.apto===false?false:null)), dv:(typeof x.dv==='string' ? x.dv.slice(0,30) : '') }));
  o.actualizado = Number(p.actualizado)||0;
  return o;
}
function mergeMapaConTs(ma, mb){
  const o = {};
  new Set(Object.keys(ma).concat(Object.keys(mb))).forEach(k=>{ const x = ma[k], y = mb[k]; o[k] = (!y || (x && x.t>=y.t)) ? x : y; });
  const keys = Object.keys(o);
  if(keys.length>1000){ keys.sort((k1,k2)=>o[k2].t-o[k1].t).slice(1000).forEach(k=>{ delete o[k]; }); }
  return o;
}
// A diferencia de mergeMapaConTs (que se queda con lo más reciente), aquí interesa quedarse
// siempre con el MEJOR intento (más aciertos) de cada subtema, venga del dispositivo que venga.
function mergeSuperados(ma, mb){
  const o = {};
  new Set(Object.keys(ma).concat(Object.keys(mb))).forEach(k=>{
    const x = ma[k], y = mb[k];
    o[k] = (!y || (x && x.ac>=y.ac)) ? x : y;
  });
  return o;
}
// Une dos versiones del progreso sin perder nada de ninguna (móvil + ordenador).
function mergeProgreso(a, b){
  a = normalizaProgreso(a); b = normalizaProgreso(b);
  const dias = Array.from(new Set(a.dias.concat(b.dias))).sort().slice(-400);
  const porDia = {};
  Array.from(new Set(Object.keys(a.porDia).concat(Object.keys(b.porDia)))).forEach(k=>{ porDia[k] = Math.max(a.porDia[k]||0, b.porDia[k]||0); });
  const keys = Object.keys(porDia).sort();
  keys.slice(0, Math.max(0, keys.length-45)).forEach(k=>{ delete porDia[k]; });
  const porId = new Map();
  a.historial.concat(b.historial).forEach(h=>porId.set(h.id, h));
  const historial = Array.from(porId.values()).sort((x,y)=>x.t-y.t).slice(-40);
  const simId = new Map();
  a.simulacros.concat(b.simulacros).forEach(h=>simId.set(h.id, h));
  const simulacros = Array.from(simId.values()).sort((x,y)=>x.t-y.t).slice(-30);
  const ganador = (b.objetivoTs > a.objetivoTs) ? b : a; // el objetivo cambiado más recientemente
  const ex = (b.examenTs > a.examenTs) ? b : a;           // igual con la fecha del examen
  return { dias, porDia, objetivo:ganador.objetivo, objetivoTs:ganador.objetivoTs, historial,
           examenFecha:ex.examenFecha, examenTs:ex.examenTs, notas:mergeMapaConTs(a.notas, b.notas), marcadas:mergeMapaConTs(a.marcadas, b.marcadas), simulacros,
           superados:mergeSuperados(a.superados, b.superados),
           actualizado:Math.max(a.actualizado, b.actualizado) };
}
function cargarProgresoLocal(){
  let p = progresoVacio();
  try{ const raw = localStorage.getItem(progresoKey()); if(raw) p = normalizaProgreso(JSON.parse(raw)); }catch(e){}
  // Migración: la racha antigua se guardaba solo en este dispositivo bajo otra clave.
  try{
    const old = JSON.parse(localStorage.getItem('opotest-streak-dates')||'[]');
    if(Array.isArray(old) && old.length) p = mergeProgreso(p, Object.assign(progresoVacio(), {dias:old}));
  }catch(e){}
  return p;
}
function guardarProgresoLocal(){
  try{ localStorage.setItem(progresoKey(), JSON.stringify(progreso)); }catch(e){}
  if(typeof programarRefrescoTamano === 'function') programarRefrescoTamano();
}
function progresoDifiere(fusionado, remoto){
  if(!remoto) return true;
  return fusionado.dias.length!==remoto.dias.length || fusionado.historial.length!==remoto.historial.length
    || fusionado.objetivo!==remoto.objetivo || Object.keys(fusionado.porDia).length!==Object.keys(remoto.porDia).length
    || fusionado.examenFecha!==remoto.examenFecha || Object.keys(fusionado.notas).length!==Object.keys(remoto.notas).length
    || Object.keys(fusionado.marcadas).length!==Object.keys(remoto.marcadas).length || fusionado.simulacros.length!==remoto.simulacros.length
    || Object.keys(fusionado.superados).length!==Object.keys(remoto.superados).length;
}
async function cargarProgreso(){
  progresoSinPermiso = false;
  progreso = cargarProgresoLocal();
  if(!firebaseOk || !currentUid) return;
  try{
    const snap = await db.collection('users').doc(currentUid).collection('progreso').doc('resumen').get();
    const remoto = snap.exists ? normalizaProgreso(snap.data()) : null;
    progreso = mergeProgreso(progreso, remoto);
    guardarProgresoLocal();
    if(progresoDifiere(progreso, remoto)) programarGuardadoProgreso(false); // sube lo que solo estaba en local
  }catch(e){
    if(e && e.code==='permission-denied'){ progresoSinPermiso = true; console.warn('Progreso: Firestore no deja guardarlo todavía (publica las reglas nuevas de firestore.rules).'); }
    else console.error('No se pudo cargar el progreso remoto', e);
  }
}
function programarGuardadoProgreso(inmediato){
  guardarProgresoLocal();
  if(progresoTimer) clearTimeout(progresoTimer);
  progresoTimer = setTimeout(guardarProgresoRemoto, inmediato ? 0 : 4000);
}
async function guardarProgresoRemoto(){
  progresoTimer = null;
  if(!firebaseOk || !currentUid || progresoSinPermiso) return;
  try{
    const ref = db.collection('users').doc(currentUid).collection('progreso').doc('resumen');
    const snap = await ref.get(); // fusiona con lo que haya subido otro dispositivo entretanto
    if(snap.exists) progreso = mergeProgreso(progreso, snap.data());
    progreso.actualizado = Date.now();
    guardarProgresoLocal();
    await ref.set(progreso);
  }catch(e){
    if(e && e.code==='permission-denied'){ progresoSinPermiso = true; console.warn('Progreso: Firestore no deja guardarlo todavía (publica las reglas nuevas de firestore.rules).'); }
    else console.error('No se pudo sincronizar el progreso', e);
  }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden' && progresoTimer){ clearTimeout(progresoTimer); guardarProgresoRemoto(); }
});
function getStreakDates(){ return progreso.dias; }
function objetivoDiario(){ return progreso.objetivo || OBJETIVO_DEFECTO; }
function practicadasHoy(){ return progreso.porDia[fmtFechaKey(new Date())] || 0; }
function marcaDiaSiCumplido(){
  const hoy = fmtFechaKey(new Date());
  if((progreso.porDia[hoy]||0) >= objetivoDiario() && !progreso.dias.includes(hoy)){
    progreso.dias.push(hoy); progreso.dias.sort(); progreso.dias = progreso.dias.slice(-400);
  }
}
// Suma k preguntas respondidas hoy (para el objetivo diario y la racha).
function sumarPracticaHoy(k){
  const hoy = fmtFechaKey(new Date());
  progreso.porDia[hoy] = (progreso.porDia[hoy]||0) + k;
  marcaDiaSiCumplido();
  programarGuardadoProgreso(false);
}
function cambiarObjetivo(v){
  progreso.objetivo = Math.max(5, Math.min(200, Math.round(v)));
  progreso.objetivoTs = Date.now();
  marcaDiaSiCumplido(); // si con el nuevo objetivo ya has llegado hoy, cuenta; nunca se quita un día ya ganado
  programarGuardadoProgreso(false);
}
// Genérica: calcula la racha de días seguidos a partir de cualquier lista de fechas
// (claves 'YYYY-M-D'). La usan tanto el progreso propio como el panel de administración
// para calcular la racha de otras cuentas.
function calcularRachaDeDias(dias){
  const dates = new Set(dias || []);
  const d = new Date();
  // Si hoy todavía no se ha cumplido el objetivo, se empieza a contar desde ayer para no
  // "romper" la racha visualmente antes de que acabe el día (aún puedes cumplirlo hoy).
  if(!dates.has(fmtFechaKey(d))) d.setDate(d.getDate()-1);
  let racha = 0;
  while(dates.has(fmtFechaKey(d))){ racha++; d.setDate(d.getDate()-1); }
  return racha;
}
function calcularRachaActual(){ return calcularRachaDeDias(getStreakDates()); }

/* ===== Estado de cada pregunta según tus resultados (para "mis fallos", "nuevas" y el test rápido) ===== */
function esNueva(q){ return !(q.stats && q.stats.veces>0); }
// "Fallada" = el último intento fue un fallo. En preguntas antiguas, sin "último resultado"
// guardado, se considera fallada si alguna vez se falló (aciertos < veces).
function esFallada(q){
  const st = q.stats;
  if(!st || !(st.veces>0)) return false;
  if(st.ultimo===0) return true;
  if(st.ultimo===1) return false;
  return (st.aciertos||0) < st.veces;
}
function esFloja(q){ const st = q.stats; return !!st && st.veces>=2 && (st.aciertos||0)/st.veces < 0.6; }
/* Repaso espaciado ligero: tras cada intento se fija cuándo toca volver a ver la pregunta.
   nivel = aciertos seguidos (0 = acabas de fallar). Fallar la devuelve a mañana; cada acierto
   seguido la aleja más: 1 → 3 → 7 → 14 → 30 → 60 días. Se guardan en stats.nivel y stats.prox. */
const REPASO_DIAS = [1, 3, 7, 14, 30, 60];
function calcularProxRepaso(nivel, ahora){
  const d = new Date(ahora); d.setHours(0,0,0,0);
  d.setDate(d.getDate() + REPASO_DIAS[Math.min(Math.max(nivel,0), REPASO_DIAS.length-1)]);
  return d.getTime();
}
// ¿Toca repasarla hoy? Preguntas antiguas sin fecha de repaso: solo si están falladas.
function tocaRepasar(q, ahora){
  const st = q.stats;
  if(!st || !(st.veces>0)) return false;
  if(typeof st.prox==='number') return st.prox <= (ahora||Date.now());
  return esFallada(q);
}
// Cuántas preguntas tocan hoy (incluye las atrasadas) y cuántas mañana.
function contarRepasos(questions){
  const ahora = Date.now();
  const m = new Date(ahora); m.setHours(0,0,0,0); m.setDate(m.getDate()+1);
  const pasado = new Date(m.getTime()); pasado.setDate(pasado.getDate()+1);
  let hoy = 0, manana = 0;
  questions.forEach(q=>{
    if(tocaRepasar(q, ahora)) hoy++;
    else if(q.stats && typeof q.stats.prox==='number' && q.stats.prox>=m.getTime() && q.stats.prox<pasado.getTime()) manana++;
  });
  return { hoy, manana };
}
// Test rápido: mezcla fallos (~40 %), repasos que tocan (~30 %), flojas (~20 %), nuevas y, si falta, las repasadas hace más tiempo.
function armarTestRapido(questions, n){
  const usados = new Set(), out = [];
  const tomar = (arr, max)=>{ let c = 0; for(const q of arr){ if(out.length>=n || c>=max) break; if(usados.has(q.id)) continue; usados.add(q.id); out.push(q); c++; } };
  const fallos = shuffleArr(questions.filter(esFallada));
  const vencidas = shuffleArr(questions.filter(q=>tocaRepasar(q) && !esFallada(q)))
    .sort((x,y)=>((x.stats&&x.stats.prox)||0)-((y.stats&&y.stats.prox)||0));
  const flojas = shuffleArr(questions.filter(q=>esFloja(q) && !esFallada(q)));
  const nuevas = shuffleArr(questions.filter(esNueva));
  const resto = shuffleArr(questions.filter(q=>!esNueva(q) && !esFallada(q) && !esFloja(q)))
    .sort((x,y)=>((x.stats&&x.stats.fecha)||0)-((y.stats&&y.stats.fecha)||0));
  tomar(fallos, Math.ceil(n*0.4));
  tomar(vencidas, Math.ceil(n*0.3));
  tomar(flojas, Math.ceil(n*0.2));
  tomar(nuevas, n-out.length);
  tomar(resto, n-out.length);
  tomar(fallos, n); tomar(vencidas, n); tomar(flojas, n);
  return shuffleArr(out);
}

/* ===================== TIPOS DE PREGUNTA ===================== */
// El tipo de pregunta viene determinado por la categoría: ortografía y gramática usan un
// formato de juicio bien/mal en vez de opción múltiple. qTipo() es tolerante con preguntas
// antiguas guardadas antes de que existiera el campo "tipo".
function testTipoForCategoria(cat){
  if(cat==='ortografia') return 'ortografia';
  if(cat==='gramatica') return 'gramatica';
  return 'multiple';
}
function qTipo(q){ return q.tipo || testTipoForCategoria(q.categoria); }

/* ===================== IMÁGENES DE ENUNCIADO (comprimidas a JPEG antes de guardarlas) ===================== */
// Se usan sobre todo en Psicotécnicos, donde el enunciado es en sí mismo una imagen. Se
// redimensionan/comprimen en el propio dispositivo para no disparar el tamaño de los
// documentos de Firestore (límite de 1 MB por documento).
function fileToCompressedDataURL(file, maxDim, quality){
  maxDim = maxDim || 1000; quality = quality || 0.72;
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      let width = img.naturalWidth, height = img.naturalHeight;
      if(width>maxDim || height>maxDim){
        const ratio = Math.min(maxDim/width, maxDim/height);
        width = Math.round(width*ratio); height = Math.round(height*ratio);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('No se pudo procesar la imagen')); };
    img.src = url;
  });
}
// Widget reutilizable de subida de imágenes: muta imagesArr in-place y llama a repaint() al cambiar.
function createImageUploaderField(imagesArr, repaint, labelText){
  const wrap = document.createElement('div'); wrap.className='test-field';
  wrap.innerHTML = '<label>'+(labelText||'Imágenes del enunciado (opcional)')+'</label>';
  const fileInp = document.createElement('input'); fileInp.type='file'; fileInp.accept='image/*'; fileInp.multiple=true;
  fileInp.onchange = async (e)=>{
    const files = Array.from(e.target.files||[]);
    fileInp.disabled = true;
    for(const f of files){
      try{ const durl = await fileToCompressedDataURL(f); imagesArr.push(durl); }
      catch(err){ console.error(err); showToast('No se pudo procesar una de las imágenes.'); }
    }
    fileInp.disabled = false;
    fileInp.value = '';
    repaint();
  };
  wrap.appendChild(fileInp);
  if(imagesArr.length){
    const thumbs = document.createElement('div'); thumbs.className='test-thumbs'; thumbs.style.marginTop='8px';
    imagesArr.forEach((durl,i)=>{
      const t = document.createElement('div'); t.className='thumb';
      const img = document.createElement('img'); img.src = durl;
      t.appendChild(img);
      const del = document.createElement('button'); del.type='button'; del.textContent='✕';
      del.onclick = ()=>{ imagesArr.splice(i,1); repaint(); };
      t.appendChild(del);
      thumbs.appendChild(t);
    });
    wrap.appendChild(thumbs);
  }
  return wrap;
}

/* ===================== IA multi-proveedor (Gemini + OpenRouter + proveedor extra) =====================
   Todo lo que antes hablaba solo con Gemini ahora pasa por llamarIAConFallback(), que va probando
   proveedores EN ORDEN (Gemini → OpenRouter → proveedor extra) y solo pasa al siguiente si el actual
   falla (clave vacía, cuota agotada con error 429, CORS bloqueado, etc.). Así, si a uno se le acaba
   la cuota gratuita del día, la app sigue funcionando sola con el siguiente que tengas configurado.
   Basta con rellenar UNA clave para que la app funcione igual que antes; las demás son opcionales. */
function getGeminiKey(){ try{ return localStorage.getItem('opotest-gemini-key') || ''; }catch(e){ return ''; } }
function setGeminiKey(v){ try{ localStorage.setItem('opotest-gemini-key', v); }catch(e){} }
function getGeminiModel(){ try{ return localStorage.getItem('opotest-gemini-model') || 'gemini-3.6-flash'; }catch(e){ return 'gemini-3.6-flash'; } }
function setGeminiModel(v){ try{ localStorage.setItem('opotest-gemini-model', v); }catch(e){} }
// OpenRouter (openrouter.ai): agrega decenas de modelos de varias empresas bajo una sola clave, y
// varios de ellos (marcados ":free" o el router "openrouter/free") no cuestan nada, con su propia
// cuota gratuita independiente de la de Gemini. Soporta tanto imágenes como PDFs.
function getOpenRouterKey(){ try{ return localStorage.getItem('opotest-openrouter-key') || ''; }catch(e){ return ''; } }
function setOpenRouterKey(v){ try{ localStorage.setItem('opotest-openrouter-key', v); }catch(e){} }
function getOpenRouterModel(){ try{ return localStorage.getItem('opotest-openrouter-model') || 'openrouter/free'; }catch(e){ return 'openrouter/free'; } }
function setOpenRouterModel(v){ try{ localStorage.setItem('opotest-openrouter-model', v); }catch(e){} }
// Proveedor extra opcional, compatible con el formato de OpenAI (Groq, Mistral, Together, el router
// de Hugging Face, etc.). Solo se usa para transcribir FOTOS (no PDFs), porque la mayoría de estos
// servicios no aceptan archivos PDF directamente en el chat, solo imágenes.
function getExtraKey(){ try{ return localStorage.getItem('opotest-extra-key') || ''; }catch(e){ return ''; } }
function setExtraKey(v){ try{ localStorage.setItem('opotest-extra-key', v); }catch(e){} }
function getExtraBaseUrl(){ try{ return localStorage.getItem('opotest-extra-baseurl') || ''; }catch(e){ return ''; } }
function setExtraBaseUrl(v){ try{ localStorage.setItem('opotest-extra-baseurl', v); }catch(e){} }
function getExtraModel(){ try{ return localStorage.getItem('opotest-extra-model') || 'meta-llama/llama-4-scout-17b-16e-instruct'; }catch(e){ return 'meta-llama/llama-4-scout-17b-16e-instruct'; } }
function setExtraModel(v){ try{ localStorage.setItem('opotest-extra-model', v); }catch(e){} }
// Modo de selección: 'auto' (por defecto) prueba en orden Gemini → OpenRouter → extra, saltando al
// siguiente si uno falla. Si el usuario elige uno concreto ('gemini'|'openrouter'|'extra'), se usa
// SOLO ese, sin fallback (útil para forzar un proveedor y comprobar que responde).
function getIAModo(){ try{ return localStorage.getItem('opotest-ia-modo') || 'auto'; }catch(e){ return 'auto'; } }
function setIAModo(v){ try{ localStorage.setItem('opotest-ia-modo', v); }catch(e){} }

// Limpia el texto que devuelve cualquier IA (a veces envuelto en ```json ... ```) antes de JSON.parse().
function limpiarJsonIA(texto){ return (texto||'').trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim(); }

/* ---- "Contenido" en formato neutro, independiente del proveedor: una lista de
   {tipo:'texto', texto} | {tipo:'imagen', mime, b64} | {tipo:'pdf', b64, nombre}
   Cada función llamarXxx() de abajo la traduce al formato concreto de su API y devuelve el texto
   de la respuesta (sin parsear todavía: eso lo hace quien llama a llamarIAConFallback). ---- */
async function llamarGemini(contenido, opts){
  const apiKey = getGeminiKey();
  if(!apiKey) throw new Error('Gemini: no hay clave configurada.');
  const model = getGeminiModel();
  const parts = contenido.map(c=>{
    if(c.tipo==='texto') return {text:c.texto};
    return {inline_data:{ mime_type: c.tipo==='pdf' ? 'application/pdf' : (c.mime||'image/jpeg'), data:c.b64 }};
  });
  const resp = await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+encodeURIComponent(apiKey), {
    method:'POST',
    headers:{ 'content-type':'application/json' },
    body: JSON.stringify({
      contents:[{ parts }],
      generationConfig:{ temperature: opts.temperature, maxOutputTokens: opts.maxTokens }
    })
  });
  if(!resp.ok){
    const errTxt = await resp.text().catch(()=> '');
    throw new Error('Gemini ('+resp.status+'): '+errTxt.slice(0,200));
  }
  const data = await resp.json();
  const cand = (data.candidates||[])[0];
  const textPart = cand && cand.content && (cand.content.parts||[]).find(p=>typeof p.text==='string');
  if(!textPart) throw new Error('Gemini no devolvió texto (posible bloqueo de seguridad o cuota agotada).');
  return textPart.text;
}
async function llamarOpenRouter(contenido, opts){
  const apiKey = getOpenRouterKey();
  if(!apiKey) throw new Error('OpenRouter: no hay clave configurada.');
  const model = getOpenRouterModel() || 'openrouter/free';
  const contentArr = []; const plugins = [];
  contenido.forEach(c=>{
    if(c.tipo==='texto') contentArr.push({type:'text', text:c.texto});
    else if(c.tipo==='imagen') contentArr.push({type:'image_url', image_url:{ url:'data:'+(c.mime||'image/jpeg')+';base64,'+c.b64 }});
    else if(c.tipo==='pdf'){
      contentArr.push({type:'file', file:{ filename:c.nombre||'documento.pdf', file_data:'data:application/pdf;base64,'+c.b64 }});
      // Motor gratuito de extracción de texto (evita el motor OCR de pago, ~2$/1000 páginas).
      if(!plugins.length) plugins.push({id:'file-parser', pdf:{engine:'pdf-text'}});
    }
  });
  const body = { model, messages:[{ role:'user', content:contentArr }], temperature: opts.temperature, max_tokens: opts.maxTokens };
  if(plugins.length) body.plugins = plugins;
  const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+apiKey, 'X-Title':'OpoTest' },
    body: JSON.stringify(body)
  });
  if(!resp.ok){
    const errTxt = await resp.text().catch(()=> '');
    throw new Error('OpenRouter ('+resp.status+'): '+errTxt.slice(0,200));
  }
  const data = await resp.json();
  const msg = data.choices && data.choices[0] && data.choices[0].message;
  const text = msg && (typeof msg.content==='string' ? msg.content : (Array.isArray(msg.content) ? msg.content.map(p=>p.text||'').join('') : ''));
  if(!text) throw new Error('OpenRouter no devolvió texto (modelo gratuito saturado; prueba otro modelo).');
  return text;
}
async function llamarProveedorExtra(contenido, opts){
  const apiKey = getExtraKey(), baseUrl = (getExtraBaseUrl()||'').trim().replace(/\/+$/,''), model = getExtraModel();
  if(!apiKey || !baseUrl || !model) throw new Error('Proveedor extra: falta URL, clave o modelo.');
  const contentArr = [];
  contenido.forEach(c=>{
    if(c.tipo==='texto') contentArr.push({type:'text', text:c.texto});
    else if(c.tipo==='imagen') contentArr.push({type:'image_url', image_url:{ url:'data:'+(c.mime||'image/jpeg')+';base64,'+c.b64 }});
    // Los PDF no se mandan a este proveedor: casi ningún servidor compatible con OpenAI los acepta.
  });
  const resp = await fetch(baseUrl+'/chat/completions', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+apiKey },
    body: JSON.stringify({ model, messages:[{ role:'user', content:contentArr }], temperature: opts.temperature, max_tokens: opts.maxTokens })
  });
  if(!resp.ok){
    const errTxt = await resp.text().catch(()=> '');
    throw new Error(model+' ('+resp.status+'): '+errTxt.slice(0,200));
  }
  const data = await resp.json();
  const msg = data.choices && data.choices[0] && data.choices[0].message;
  const text = msg && (typeof msg.content==='string' ? msg.content : '');
  if(!text) throw new Error(model+' no devolvió texto.');
  return text;
}
// Nombre del último proveedor que respondió con éxito, solo para poder mostrarlo en los avisos.
let ultimoProveedorIA = '';
// contenido: ver formato neutro de arriba. opts:{temperature,maxTokens}. incluirExtra: si se debe
// probar también el proveedor extra (solo tiene sentido para fotos, no para PDFs).
async function llamarIAConFallback(contenido, opts, incluirExtra){
  const intentos = [
    { id:'gemini', nombre:'Google Gemini', activo: !!getGeminiKey(), fn: ()=> llamarGemini(contenido, opts) },
    { id:'openrouter', nombre:'OpenRouter', activo: !!getOpenRouterKey(), fn: ()=> llamarOpenRouter(contenido, opts) }
  ];
  if(incluirExtra) intentos.push({ id:'extra', nombre: getExtraModel() ? ('proveedor extra ('+getExtraModel()+')') : 'proveedor extra', activo: !!(getExtraKey() && getExtraBaseUrl() && getExtraModel()), fn: ()=> llamarProveedorExtra(contenido, opts) });
  const modo = getIAModo();
  let activos = intentos.filter(i=>i.activo);
  if(modo !== 'auto'){
    const forzado = intentos.find(i=>i.id===modo);
    if(!forzado) throw new Error('El modo forzado "'+modo+'" no está disponible aquí (esta pantalla no lo soporta). Cambia el selector "¿Cuál usar?" a Automático.');
    if(!forzado.activo) throw new Error('Has forzado "'+forzado.nombre+'" pero no tiene clave configurada. Cambia a Automático o rellena su clave arriba.');
    activos = [forzado];
  }
  if(!activos.length) throw new Error('No has configurado ninguna clave de IA (Gemini, OpenRouter'+(incluirExtra?' u otro proveedor':'')+'). Configúrala arriba.');
  const errores = [];
  for(const intento of activos){
    try{
      const texto = await intento.fn();
      ultimoProveedorIA = intento.nombre;
      return texto;
    }catch(err){
      console.error('['+intento.nombre+']', err);
      errores.push(intento.nombre+': '+(err.message||'error desconocido'));
    }
  }
  throw new Error('Todas las IA configuradas fallaron → '+errores.join(' | '));
}

/* ===================== REVISAR UNA PREGUNTA CON IA (control de calidad, solo admin) =====================
   Manda una pregunta ya guardada a la IA y le pide que señale posibles fallos (respuesta mal marcada,
   enunciado ambiguo, dos opciones que podrían ser correctas...). Es solo una segunda opinión: el admin
   decide si corrige algo o no, no se cambia nada automáticamente. */
async function revisarPreguntaConIA(q){
  const tipo = qTipo(q);
  let detalle;
  if(tipo==='ortografia'){
    detalle = 'Tipo: Ortografía. Frase: "'+(q.enunciado||'')+'". Palabras: '+(q.palabras||[]).map(p=>'"'+p.texto+'" ('+(p.incorrecta?'marcada como MAL escrita':'marcada como bien escrita')+')').join(', ')+'.';
  } else if(tipo==='gramatica'){
    detalle = 'Tipo: Gramática. Frase: "'+(q.enunciado||'')+'". Marcada como: '+(q.correcta?'CORRECTA':'INCORRECTA')+'.';
  } else {
    detalle = 'Enunciado: "'+(q.enunciado||'')+'"\nOpciones:\n'+(q.opciones||[]).map((o,i)=>(i===q.correcta?'✔ ':'- ')+o).join('\n')+'\n(✔ = la que está marcada como correcta en el banco)';
  }
  const prompt = 'Eres un revisor de calidad de un banco de preguntas de test para una oposición española (Guardia Civil). Te paso UNA pregunta ya guardada en el banco; revísala con sentido crítico y dime SOLO si detectas algún problema real: la respuesta marcada como correcta parece incorrecta, el enunciado es ambiguo o tiene una errata que cambia el sentido, hay dos opciones que podrían ser válidas a la vez, o falta información para poder responder.\n\n'
    + detalle + '\n'
    + (q.explicacion ? ('Explicación guardada: "'+q.explicacion+'"\n') : '')
    + '\nResponde en español, en un máximo de 5 líneas, directo y concreto, sin rodeos. Si no ves ningún problema, empieza la respuesta con "Sin problemas detectados". Si detectas un posible fallo, empieza con "⚠ Posible fallo:" y explica cuál.';
  const contenido = [{tipo:'texto', texto:prompt}];
  const texto = await llamarIAConFallback(contenido, {temperature:0.2, maxTokens:500}, false);
  return texto.trim();
}

/* ===================== ASISTENTE DE DUDAS SOBRE DOCUMENTOS LEGALES =====================
   Dos modos, disponibles para cualquier cuenta aprobada (no solo admin):
   - "guardado": el admin ha subido antes uno o varios PDF (leyes, temario...); la IA los transcribió
     UNA vez a texto plano y ese texto vive en Firestore (users/{ADMIN_UID}/legalDocs/{docId} +
     subcolección chunks/, trozeado para no chocar con el límite de 1 MB por documento de Firestore).
     Cualquier cuenta aprobada puede leerlo y preguntarle dudas sin volver a gastar cuota en
     transcribir el PDF cada vez.
   - "propio": cualquier usuario sube su propio PDF en el momento y pregunta sobre ESE archivo
     puntual; no se guarda en ningún sitio, se manda directo a la IA igual que en "Añadir pregunta".
   Mejor varios documentos pequeños (uno por ley/tema) que uno solo gigante: cada pregunta solo
   necesita mandar el texto del documento elegido, así que documentos más pequeños = menos tokens
   gastados (y menos probable agotar la cuota gratuita del día) por cada pregunta. */
let legalDocsState = {
  uiKeyOpen: false,
  lista: [], cargado: false, cargando: false, error: null,
  chunksCache: {},
  modoFuente: 'guardado', // 'guardado' | 'propio'
  seleccionId: null,
  pregunta: '', respuesta: '', preguntando: false, errorPregunta: null,
  nuevoTitulo: '', nuevoFile: null, subiendo: false, subidaProgreso: null, subidaError: null,
  adhocFile: null, adhocPreguntando: false, adhocRespuesta: '', adhocError: null
};
function legalDocsCollection(){ return db.collection('users').doc(bankOwnerUid()).collection('legalDocs'); }
function legalDocChunksCollection(docId){ return legalDocsCollection().doc(docId).collection('chunks'); }

async function cargarLegalDocsLista(){
  if(!firebaseOk || !db || !currentUid) return;
  legalDocsState.cargando = true; legalDocsState.error = null; renderTests();
  try{
    const snap = await legalDocsCollection().get();
    legalDocsState.lista = snap.docs.map(d=>({id:d.id, ...d.data()})).filter(d=>!d.borrado).sort((a,b)=>(b.actualizado||0)-(a.actualizado||0));
    if(legalDocsState.lista.length && !legalDocsState.lista.some(d=>d.id===legalDocsState.seleccionId)){
      legalDocsState.seleccionId = legalDocsState.lista[0].id;
    }
    legalDocsState.cargado = true;
  }catch(e){
    console.error(e);
    legalDocsState.error = 'No se pudo cargar la lista de documentos guardados.';
  }
  legalDocsState.cargando = false; renderTests();
}
// Trozos bajo el límite de 1 MB por documento de Firestore (con margen de sobra para el resto de
// campos y la codificación UTF-8, que puede ocupar más de 1 byte por carácter).
const LEGALDOC_CHUNK_SIZE = 700000;
function trocearTextoLegal(texto, tam){
  const trozos = [];
  for(let i=0;i<texto.length;i+=tam) trozos.push(texto.slice(i, i+tam));
  return trozos.length ? trozos : [''];
}
async function guardarLegalDocNuevo(titulo, textoCompleto){
  const trozos = trocearTextoLegal(textoCompleto, LEGALDOC_CHUNK_SIZE);
  const ref = legalDocsCollection().doc();
  const ahora = Date.now();
  const subidoPorEmail = (auth && auth.currentUser && auth.currentUser.email) || null;
  await ref.set({
    titulo: (titulo||'').trim() || 'Documento sin título',
    chunks: trozos.length, caracteres: textoCompleto.length,
    creado: ahora, actualizado: ahora, borrado: false,
    subidoPorUid: currentUid, subidoPorEmail
  });
  for(let i=0;i<trozos.length;i++){
    await legalDocChunksCollection(ref.id).doc(String(i)).set({ texto: trozos[i] });
  }
  return ref.id;
}
async function borrarLegalDoc(docId){
  const chunksSnap = await legalDocChunksCollection(docId).get();
  for(const d of chunksSnap.docs){ await d.ref.delete(); }
  await legalDocsCollection().doc(docId).delete();
}
// Junta los trozos de un documento (ordenados numéricamente, no alfabéticamente: "10" iría antes
// que "2" si se ordenara como texto) y los guarda en caché de memoria para no volver a leerlos de
// Firestore mientras dure esta sesión.
async function obtenerTextoLegalDoc(docId){
  if(legalDocsState.chunksCache[docId]) return legalDocsState.chunksCache[docId];
  const snap = await legalDocChunksCollection(docId).get();
  const ordenado = snap.docs.slice().sort((a,b)=> parseInt(a.id,10)-parseInt(b.id,10));
  const texto = ordenado.map(d=>(d.data().texto||'')).join('');
  legalDocsState.chunksCache[docId] = texto;
  return texto;
}
// Transcribe un PDF a texto plano con la IA, troceándolo por rango de páginas si es largo (reutiliza
// el mismo mecanismo de pdf-lib que "Generar con IA" para simulacros largos), para no toparse con el
// límite de tokens de salida de una sola llamada.
async function extraerTextoLegalDePdf(file, onProgreso){
  const nombre = file.name || 'documento.pdf';
  let rangos = [{start:null, end:null}];
  if(pdfLibDisponible()){
    try{
      const totalPaginas = await getPdfPageCount(file);
      const porTrozo = 20;
      if(totalPaginas > porTrozo) rangos = calcularRangosPaginas(totalPaginas, porTrozo);
    }catch(e){ console.error('No se pudo contar las páginas del PDF, se sube entero:', e); }
  }
  let textoTotal = '';
  for(let i=0;i<rangos.length;i++){
    const {start,end} = rangos[i];
    if(onProgreso) onProgreso({actual:i+1, total:rangos.length, paginas: start!=null?(start+'–'+end):null});
    const filePart = (start!=null) ? await extractPdfPageRange(file, start, end) : file;
    const b64 = await fileToBase64(filePart);
    const prompt = 'Transcribe TODO el texto de este documento PDF, literalmente y completo, en español, sin resumir, sin omitir artículos ni apartados, sin añadir comentarios ni encabezados que no estén en el original. Devuelve SOLO el texto transcrito, sin backticks ni explicaciones adicionales.';
    const contenido = [{tipo:'pdf', b64, nombre}, {tipo:'texto', texto:prompt}];
    const texto = await llamarIAConFallback(contenido, {temperature:0, maxTokens:32768}, false);
    textoTotal += (textoTotal ? '\n\n' : '') + texto.trim();
  }
  return textoTotal;
}
async function ejecutarSubidaLegalDoc(){
  if(!legalDocsState.nuevoFile){ showToast('Selecciona primero un PDF.'); return; }
  legalDocsState.subiendo = true; legalDocsState.subidaError = null; legalDocsState.subidaProgreso = null;
  renderTests();
  try{
    const texto = await extraerTextoLegalDePdf(legalDocsState.nuevoFile, (p)=>{ legalDocsState.subidaProgreso = p; renderTests(); });
    if(!texto.trim()) throw new Error('La IA no devolvió texto. Prueba con otro PDF (asegúrate de que tenga texto seleccionable, no una imagen escaneada sin OCR).');
    const tituloFinal = legalDocsState.nuevoTitulo || legalDocsState.nuevoFile.name.replace(/\.pdf$/i,'');
    await guardarLegalDocNuevo(tituloFinal, texto);
    showToast('Documento guardado ✓ ('+Math.round(texto.length/1000)+' mil caracteres)');
    legalDocsState.nuevoFile = null; legalDocsState.nuevoTitulo = '';
    legalDocsState.cargado = false;
    await cargarLegalDocsLista();
  }catch(err){
    console.error(err);
    legalDocsState.subidaError = err.message || 'No se pudo extraer/guardar el documento.';
  }finally{
    legalDocsState.subiendo = false; legalDocsState.subidaProgreso = null;
    renderTests();
  }
}
async function preguntarSobreLegalDoc(){
  if(!legalDocsState.seleccionId){ showToast('Elige primero un documento guardado.'); return; }
  if(!legalDocsState.pregunta.trim()){ showToast('Escribe tu pregunta.'); return; }
  legalDocsState.preguntando = true; legalDocsState.errorPregunta = null; legalDocsState.respuesta = '';
  renderTests();
  try{
    const texto = await obtenerTextoLegalDoc(legalDocsState.seleccionId);
    const doc = legalDocsState.lista.find(d=>d.id===legalDocsState.seleccionId);
    const prompt = 'Eres un asistente que ayuda a estudiar para una oposición española (Guardia Civil). A continuación tienes el texto completo de un documento legal/temario llamado "'+(doc?doc.titulo:'documento')+'". Responde SOLO con información que esté en ese texto; si la respuesta no aparece en el documento, dilo claramente en vez de inventarla. Sé conciso (máximo 6-8 líneas) y cita el artículo o apartado exacto si el documento lo indica.\n\n--- DOCUMENTO ---\n'+texto+'\n--- FIN DEL DOCUMENTO ---\n\nPregunta: '+legalDocsState.pregunta.trim();
    const contenido = [{tipo:'texto', texto:prompt}];
    const respuesta = await llamarIAConFallback(contenido, {temperature:0.2, maxTokens:1200}, false);
    legalDocsState.respuesta = respuesta.trim();
  }catch(err){
    console.error(err);
    legalDocsState.errorPregunta = err.message || 'No se pudo obtener respuesta.';
  }finally{
    legalDocsState.preguntando = false;
    renderTests();
  }
}

function renderTestsLegal(body){

  body.appendChild(info);

  renderIAKeyPanel(body, legalDocsState, {conExtra:false});

  if(!legalDocsState.cargado && !legalDocsState.cargando) cargarLegalDocsLista();

  if(isAdmin){
    const panel = document.createElement('div'); panel.className='test-panel';
    panel.innerHTML = '<h4>Documentos guardados (visibles para todos los usuarios aprobados)</h4>';
    if(legalDocsState.cargando && !legalDocsState.cargado){
      const p = document.createElement('div'); p.className='test-empty'; p.textContent='Cargando…'; panel.appendChild(p);
    } else {
      if(legalDocsState.error){
        const e = document.createElement('div'); e.style.cssText='font-family:var(--font-mono);font-size:12px;color:var(--amber-ink);'; e.textContent = legalDocsState.error;

      }
      if(!legalDocsState.lista.length){
        const p = document.createElement('div'); p.className='test-empty'; p.textContent='Todavía no has guardado ningún documento.'; panel.appendChild(p);
      } else {
        // Resumen: cuántos documentos hay en total y cuántos ha subido cada cuenta (útil ahora que
        // puede haber más de una cuenta con permiso para subir: la tuya y, si la has añadido, la de
        // respaldo en SUPER_ADMIN_UIDS).
        const porSubidor = {};
        legalDocsState.lista.forEach(d=>{
          const clave = d.subidoPorEmail || d.subidoPorUid || 'desconocido';
          porSubidor[clave] = (porSubidor[clave]||0) + 1;
        });
        const resumen = document.createElement('div'); resumen.className='tc-stat'; resumen.style.marginBottom='10px';
        const partes = Object.keys(porSubidor).map(k=>{
          const esTu = (k===currentUid) || (auth && auth.currentUser && k===auth.currentUser.email);
          return (esTu ? 'tú' : k) + ': ' + porSubidor[k];
        });
        resumen.textContent = legalDocsState.lista.length+' documento(s) en total · '+partes.join(' · ');
        panel.appendChild(resumen);

        legalDocsState.lista.forEach(d=>{
          const row = document.createElement('div'); row.className='test-card'; row.style.cssText='display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;';
          const left = document.createElement('div');
          const t = document.createElement('div'); t.textContent = d.titulo; t.style.fontWeight='600';
          const esTuyo = (d.subidoPorUid && d.subidoPorUid===currentUid) || (auth && auth.currentUser && d.subidoPorEmail===auth.currentUser.email);
          const quien = d.subidoPorEmail ? (esTuyo ? 'tú' : d.subidoPorEmail) : 'sin registrar (subido antes de este cambio)';
          const s = document.createElement('div'); s.className='tc-stat'; s.textContent = Math.round((d.caracteres||0)/1000)+' mil caracteres · '+(d.chunks||1)+' trozo(s) · subido por: '+quien;

   Dos formas de compartir una pregunta con el grupo de Telegram, solo para el admin:
   1) Exportar a PNG: genera una imagen de la pregunta (con sus opciones) SIN marcar
      la respuesta correcta, lista para pegar en el grupo. Se monta un DOM oculto que
      reutiliza los mismos estilos .tq-* del resto de la app y se rasteriza con
      html2canvas (se carga bajo demanda, no forma parte del bundle).

      solo en este dispositivo) para publicar directamente una encuesta tipo "quiz" con
      la respuesta correcta ya marcada y la explicación, si la hay. Solo tiene sentido
      para preguntas con opciones cerradas (tipo "multiple", "gramatica", u "ortografia"
      cuando hay exactamente una palabra mal escrita). */

// Construye (fuera de pantalla) una tarjeta de la pregunta, reutilizando las mismas clases
// .tq-* que usa el resto de la app para que se vea igual. Por defecto NO revela la respuesta
// correcta (para publicar la pregunta "en blanco"); con withAnswer=true marca la opción
// correcta en verde (igual que la vista de corrección) y añade la explicación si la hay,
// pensado para generar una segunda imagen de "solución" que se manda después.
function buildQuestionExportNode(q, withAnswer){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;left:-9999px;top:0;width:640px;background:#1b2b24;border:1px solid #34493d;border-radius:6px;padding:22px;font-family:var(--font-body);color:#ece4d3;box-sizing:border-box;';
  const top = document.createElement('div'); top.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;';
  const brand = document.createElement('div'); brand.style.cssText='font-family:var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--amber-ink);font-size:13px;'; brand.textContent='OpoTest';
  const tag = document.createElement('div'); tag.style.cssText='font-family:var(--font-mono);font-size:12px;color:#b9baa8;text-transform:uppercase;letter-spacing:.05em;'; tag.textContent = questionTemaTag(q);
  top.appendChild(brand); top.appendChild(tag);
  wrap.appendChild(top);
  const card = document.createElement('div'); card.className = withAnswer ? 'test-quiz-q corregida' : 'test-quiz-q'; card.style.cssText='margin:0;';
  const tipo = qTipo(q);

  if(tipo==='gramatica'){
    const prompt = document.createElement('div'); prompt.className='tq-enun'; prompt.textContent = '¿Es correcta esta frase?';
    card.appendChild(prompt);

    card.appendChild(frase);

      const badge = document.createElement('div'); badge.className='tq-opt correcta';
      badge.textContent = q.correcta ? 'Frase correcta ✓' : 'Frase incorrecta ✕';
      card.appendChild(badge);

  } else if(tipo==='ortografia' && esOrtoNuevo){
    const prompt = document.createElement('div'); prompt.className='tq-enun'; prompt.textContent = '¿Qué palabra numerada está mal escrita?';
    card.appendChild(prompt);
    const frase = document.createElement('div'); frase.style.marginBottom='8px';
    pintarFraseConPalabras(frase, q.enunciado, q.palabras, {mostrarVerdad: !!withAnswer});
    card.appendChild(frase);
  } else if(tipo==='ortografia'){
    const prompt = document.createElement('div'); prompt.className='tq-enun'; prompt.textContent = '¿Cuál de estas palabras está mal escrita?';
    card.appendChild(prompt);
    const palRow = document.createElement('div'); palRow.className='tq-palabras';
    (q.palabras||[]).forEach((p,i)=>{
      const chip=document.createElement('span');
      chip.className = withAnswer ? ('tq-palabra'+(p.incorrecta?' mal':' bien')) : 'tq-palabra';
      if(!withAnswer){ chip.style.color='#ece4d3'; chip.style.borderColor='#34493d'; }
      chip.textContent=(i+1)+'. '+p.texto+(withAnswer ? (p.incorrecta?' ✕':' ✓') : '');
      palRow.appendChild(chip);
    });
    card.appendChild(palRow);
  } else {
    if(q.enunciado){ const enun = document.createElement('div'); enun.className='tq-enun'; enun.textContent = q.enunciado; card.appendChild(enun); }
  }
  if(q.imagenes && q.imagenes.length){
    const imgWrap = document.createElement('div'); imgWrap.className='tq-images';
    q.imagenes.forEach(durl=>{ const img=document.createElement('img'); img.src=durl; imgWrap.appendChild(img); });
    card.appendChild(imgWrap);
  }
  if(tipo==='multiple' && q.opciones && q.opciones.length){
    const LETRAS='ABCDEFGHIJ';
    q.opciones.forEach((op,oi)=>{
      const esCorrecta = withAnswer && oi===q.correcta;
      const optRow = document.createElement('div'); optRow.className = 'tq-opt'+(esCorrecta?' correcta':''); optRow.style.cssText='cursor:default;';
      const marker = document.createElement('span'); marker.style.cssText='flex-shrink:0;width:20px;color:var(--amber-ink);font-family:var(--font-mono);font-weight:700;'; marker.textContent = LETRAS[oi]+')';
      optRow.appendChild(marker);
      const span = document.createElement('span'); span.textContent = op + (esCorrecta ? ' ✓' : '');
      optRow.appendChild(span);
      card.appendChild(optRow);
    });
  }
  if(withAnswer && q.explicacion){
    const ex = document.createElement('div'); ex.className='tq-explic'; renderRich(q.explicacion, ex);
    card.appendChild(ex);

  wrap.appendChild(card);
  const foot = document.createElement('div'); foot.style.cssText='margin-top:16px;font-family:var(--font-mono);font-size:12px;color:#8a8f7d;text-align:right;';
  foot.textContent = withAnswer ? 'Solución ✅' : '¿Te la sabes? 🧠';
