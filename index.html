}
let html2canvasLoading = null;
function loadHtml2Canvas(){
  if(window.html2canvas) return Promise.resolve();
  if(html2canvasLoading) return html2canvasLoading;
  html2canvasLoading = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload = ()=> resolve();
    s.onerror = ()=>{ html2canvasLoading = null; reject(new Error('No se pudo cargar la librería de exportación (revisa la conexión).')); };
    document.head.appendChild(s);
  });
  return html2canvasLoading;
}
async function exportQuestionPNG(q, withAnswer){
  showToast(withAnswer ? 'Generando imagen de la solución…' : 'Generando imagen…');
  let node = null;
  try{
    await loadHtml2Canvas();
    node = buildQuestionExportNode(q, withAnswer);
    document.body.appendChild(node);
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await window.html2canvas(node, { backgroundColor:'#1b2b24', scale:2, useCORS:true });
    const blob = await new Promise(res=> canvas.toBlob(res, 'image/png'));
    if(!blob) throw new Error('No se pudo generar el PNG.');
    const filename = 'opotest-pregunta-'+(q.id||Date.now())+(withAnswer?'-solucion':'')+'.png';
    const file = new File([blob], filename, { type:'image/png' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      try{ await navigator.share({ files:[file], title: withAnswer ? 'Solución OpoTest' : 'Pregunta OpoTest' }); return; }
      catch(shareErr){ if(shareErr && shareErr.name==='AbortError') return; /* si falla el share, seguimos con la descarga */ }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 4000);
    showToast('Imagen descargada ✓');
  }catch(err){
    console.error(err);
    showToast(err.message || 'No se pudo exportar la imagen.');
  }finally{
    if(node && node.parentNode) node.parentNode.removeChild(node);
  }
}
// Construye el payload de la encuesta "quiz" de Telegram para una pregunta, o devuelve
// {error} si el tipo de pregunta no encaja en el formato de encuesta de opción única.
// Para preguntas de opción múltiple, Telegram no deja que una opción de encuesta pase de 100
// caracteres (las corta con "…" si es más larga). Para no perder texto, en vez de meter la
// opción completa en la encuesta, se manda antes un mensaje con el enunciado y las opciones
// completas (A, B, C…) y la encuesta en sí solo lleva las letras, para votar sobre lo de arriba.
function buildTelegramPollPayload(q){
  const tipo = qTipo(q);
  const LETRAS = 'ABCDEFGHIJ';
  const LIMITE_PREGUNTA = 290, LIMITE_EXPLIC = 195;
  const recorta = (s,n)=> (s && s.length>n) ? s.slice(0,n-1)+'…' : (s||'');
  if(tipo==='multiple'){
    if(!q.enunciado) return { error:'Esta pregunta no tiene texto (es una imagen), así que no se puede convertir en encuesta de Telegram. Usa "Exportar a PNG" en su lugar.' };
    if(!q.opciones || q.opciones.length<2 || q.opciones.length>10) return { error:'Telegram solo admite encuestas de entre 2 y 10 opciones.' };
    const preamble = q.enunciado + '\n\n' + q.opciones.map((o,i)=> LETRAS[i]+') '+o).join('\n');
    const explicPorDefecto = 'Respuesta correcta: '+LETRAS[q.correcta]+') '+q.opciones[q.correcta];
    return {
      preamble,
      question: 'Elige la opción correcta 👆 (pregunta completa arriba)',
      options: q.opciones.map((_,i)=> LETRAS[i]),
      correct_option_id: q.correcta,
      explanation: recorta(stripRich(q.explicacion) || explicPorDefecto, LIMITE_EXPLIC)
    };
  }
  if(tipo==='gramatica'){
    const frase = q.enunciado||'';
    const cabe = ('¿Es correcta esta frase? "'+frase+'"').length <= LIMITE_PREGUNTA;
    const explicPorDefecto = 'Respuesta correcta: la frase está '+(q.correcta ? 'BIEN' : 'MAL')+' escrita gramaticalmente.';
    return {
      preamble: cabe ? null : ('¿Es correcta esta frase?\n\n"'+frase+'"'),
      question: cabe ? '¿Es correcta esta frase? "'+frase+'"' : '¿Es correcta esta frase? 👆 (arriba)',
      options: ['Correcta','Incorrecta'],
      correct_option_id: q.correcta ? 0 : 1,
      explanation: recorta(stripRich(q.explicacion) || explicPorDefecto, LIMITE_EXPLIC)
    };
  }
  if(tipo==='ortografia'){
    const malas = (q.palabras||[]).map((p,i)=>({p,i})).filter(x=>x.p.incorrecta);
    if(malas.length!==1) return { error:'Telegram solo permite marcar una respuesta correcta, y esta pregunta tiene '+(malas.length===0?'ninguna':malas.length)+' palabra(s) marcada(s) como incorrecta(s). Usa "Exportar a PNG" en su lugar.' };
    const frase = q.enunciado ? ('"'+q.enunciado+'"') : '';
    const preguntaLarga = '¿Cuál de estas palabras está mal escrita? '+frase;
    const cabe = preguntaLarga.length <= LIMITE_PREGUNTA;
    const explicPorDefecto = 'Respuesta correcta: la palabra mal escrita es "'+q.palabras[malas[0].i].texto+'".';
    return {
      preamble: cabe ? null : ('¿Cuál de estas palabras está mal escrita?\n\n'+frase),
      question: cabe ? preguntaLarga : '¿Cuál de estas palabras está mal escrita? 👆 (frase arriba)',
      options: q.palabras.map(p=> recorta(p.texto, 100)),
      correct_option_id: malas[0].i,
      explanation: recorta(stripRich(q.explicacion) || explicPorDefecto, LIMITE_EXPLIC)
    };
  }
  return { error:'Este tipo de pregunta no se puede convertir en encuesta de Telegram.' };
}
async function sendTelegramPoll(q){
  const token = getTelegramBotToken(), chatId = getTelegramChatId();
  if(!token || !chatId){ showToast('Configura antes el token del bot y el chat de Telegram.'); return; }
  const payload = buildTelegramPollPayload(q);
  if(payload.error){ showToast(payload.error); return; }
  showToast('Enviando a Telegram…');
  try{
    if(payload.preamble){
      const preRes = await fetch('https://api.telegram.org/bot'+token+'/sendMessage', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ chat_id: chatId, text: payload.preamble })
      });
      const preData = await preRes.json();
      if(!preData.ok) throw new Error(preData.description || 'Telegram rechazó el mensaje con el enunciado.');
    }
    const body = {
      chat_id: chatId,
      question: payload.question,
      options: payload.options,
      type: 'quiz',
      is_anonymous: false,
      correct_option_id: payload.correct_option_id
    };
    if(payload.explanation) body.explanation = payload.explanation;
    const res = await fetch('https://api.telegram.org/bot'+token+'/sendPoll', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.description || 'Telegram rechazó el envío.');
    showToast('Enviado al grupo de Telegram ✓');
  }catch(err){
    console.error(err);
    showToast('No se pudo enviar a Telegram: '+(err.message||'error desconocido'));
  }
}

// Devuelve {texto} con la respuesta correcta en texto plano según el tipo de pregunta, o
// {error} si esta pregunta no tiene una respuesta que se pueda expresar así (p. ej. una
// pregunta de Psicotécnicos que es solo una imagen, o sin respuesta correcta definida).
function buildRespuestaTexto(q){
  const tipo = qTipo(q);
  if(tipo==='multiple'){
    if(!q.opciones || !q.opciones.length || typeof q.correcta!=='number' || !q.opciones[q.correcta]) return { error:'Esta pregunta no tiene una respuesta correcta definida.' };
    const LETRAS = 'ABCDEFGHIJ';
    return { texto: LETRAS[q.correcta]+') '+q.opciones[q.correcta] };
  }
  if(tipo==='gramatica'){
    return { texto: 'La frase está '+(q.correcta ? 'BIEN' : 'MAL')+' escrita gramaticalmente.' };
  }
  if(tipo==='ortografia'){
    const malas = (q.palabras||[]).filter(p=>p.incorrecta);
    if(!malas.length) return { texto:'Las 4 palabras están bien escritas.' };
    return { texto:(malas.length===1?'La palabra mal escrita es: ':'Palabras mal escritas: ')+malas.map(p=>p.texto).join(', ') };
  }
  return { error:'Este tipo de pregunta no tiene un formato de respuesta para enviar a Telegram.' };
}
// Telegram (parse_mode HTML) interpreta &, < y > como marcado; hay que escaparlos en
// cualquier texto dinámico (enunciado, opción, explicación) antes de meterlo en el mensaje.
function escapeTelegramHTML(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// Construye el mensaje final que se mandaría a Telegram: {cuerpoPlano, textoHtml} o {error}.
// cuerpoPlano es para mostrar en la vista previa (sin las etiquetas HTML); textoHtml es lo que
// se manda de verdad a la API, con <tg-spoiler> envolviendo toda la respuesta + explicación.
function buildSpoilerMensaje(q){
  const r = buildRespuestaTexto(q);
  if(r.error) return { error: r.error };
  let cuerpoPlano = '✅ Respuesta correcta: '+r.texto;
  if(q.explicacion) cuerpoPlano += '\n💬 '+stripRich(q.explicacion);
  let cuerpoHtml = '✅ <b>Respuesta correcta:</b> '+escapeTelegramHTML(r.texto);
  if(q.explicacion) cuerpoHtml += '\n💬 '+richToTelegramHTML(q.explicacion);
  return { cuerpoPlano, textoHtml: '<tg-spoiler>'+cuerpoHtml+'</tg-spoiler>' };
}
// Manda de verdad el mensaje ya construido (POST a la API de Telegram). No construye texto ni
// pide confirmación — eso lo hace quien la llama (openSpoilerPreview).
async function postTelegramMessage(textoHtml){

    r.readAsDataURL(file);
  });
}

/* ===================== IA para generar preguntas masivas desde un PDF ===================== */
// Reutiliza las mismas claves que la transcripción por foto (Gemini y OpenRouter; el proveedor
// extra queda fuera porque casi ninguno acepta PDFs). Aquí, en vez de UNA pregunta a partir de una
// imagen, se sube un PDF (temario, examen ya corregido, simulacro…) y se le pide a la IA que
// devuelva VARIAS preguntas a la vez, en el formato que corresponda según la categoría.
function normTxt(s){ return (s||'').toString().trim().toLowerCase(); }
// Similitud simple entre dos enunciados (Jaccard sobre palabras de 3+ letras, sin acentos ni
// puntuación). No es perfecto, pero basta para avisar de duplicados casi literales o muy
// parecidos, que es el caso típico al generar desde exámenes/simulacros repetidos.
function wordSetForCompare(s){
  const sinAcentos = normTxt(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const palabras = sinAcentos.replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>=3);
  return new Set(palabras);
}
function similitudEnunciados(a, b){
  const sa = wordSetForCompare(a), sb = wordSetForCompare(b);
  if(!sa.size || !sb.size) return 0;
  let interseccion = 0;
  sa.forEach(w=>{ if(sb.has(w)) interseccion++; });
  const union = sa.size + sb.size - interseccion;
  return union ? interseccion/union : 0;
}
// Busca la pregunta más parecida ya guardada en el banco (misma categoría, no borrada).
// Devuelve {score, enunciado} del mejor match, o null si nada supera el umbral mínimo.
function buscarPosibleDuplicado(enunciado, categoria, extra){
  let mejor = null;
  const candidatas = (state.testBank.questions||[]).filter(q=>q.categoria===categoria && !q.borrado);
  candidatas.forEach(q=>{
    const score = similitudEnunciados(enunciado, q.enunciado);
    if(score>=0.45 && (!mejor || score>mejor.score)) mejor = {score, enunciado:q.enunciado, origen:'banco'};
  });
  (extra||[]).forEach(otro=>{
    const score = similitudEnunciados(enunciado, otro.enunciado);
    if(score>=0.45 && (!mejor || score>mejor.score)) mejor = {score, enunciado:otro.enunciado, origen:'mismo lote'};
  });
  return mejor;
}
function jaccardSets(sa, sb){
  if(!sa.size || !sb.size) return 0;
  let inter = 0;
  const small = sa.size<sb.size ? sa : sb;
  const big = sa.size<sb.size ? sb : sa;
  small.forEach(w=>{ if(big.has(w)) inter++; });
  const union = sa.size + sb.size - inter;
  return union ? inter/union : 0;
}
// ---- Buscar duplicados sobre TODO el banco (no solo al generar con IA) --------------------
// Mismo umbral y misma comparación (Jaccard por palabras) que buscarPosibleDuplicado, pero
// aplicada a todas las parejas de preguntas de una misma categoría, no solo a una pregunta nueva
// contra el banco. Se recorre por categoría (como ya hacía buscarPosibleDuplicado) para no
// comparar preguntas que nunca podrían considerarse la misma, y se cede el hilo cada cierto
// número de preguntas para no congelar la interfaz con miles de preguntas acumuladas.
function testBankDupIgnoreKey(){ return 'opotest_dupignore_'+currentUid; }
function getDupIgnoreSet(){
  try{ return new Set(JSON.parse(localStorage.getItem(testBankDupIgnoreKey())||'[]')); }
  catch(e){ return new Set(); }
}
function addDupIgnore(id1, id2){
  try{
    const key = id1<id2 ? id1+'|'+id2 : id2+'|'+id1;
    const set = getDupIgnoreSet();
    set.add(key);
    localStorage.setItem(testBankDupIgnoreKey(), JSON.stringify(Array.from(set)));
  }catch(e){}
}
async function buscarDuplicadosEnBanco(onProgress, categoriaFiltro){
  const ignore = getDupIgnoreSet();
  const porCategoria = {};
  (state.testBank.questions||[]).forEach(q=>{
    if(categoriaFiltro && q.categoria!==categoriaFiltro) return;
    (porCategoria[q.categoria] = porCategoria[q.categoria] || []).push(q);
  });
  const categorias = Object.keys(porCategoria);
  const totalAprox = categorias.reduce((s,c)=>s+porCategoria[c].length, 0);
  const resultados = [];
  let procesadas = 0;
  for(const cat of categorias){
    const arr = porCategoria[cat];
    const sets = arr.map(q=>wordSetForCompare(q.enunciado));
    for(let i=0;i<arr.length;i++){
      for(let j=i+1;j<arr.length;j++){
        const key = arr[i].id < arr[j].id ? arr[i].id+'|'+arr[j].id : arr[j].id+'|'+arr[i].id;
        if(!ignore.has(key)){
          const score = jaccardSets(sets[i], sets[j]);
          if(score>=0.45) resultados.push({a:arr[i], b:arr[j], score});
        }
      }
      procesadas++;
      if(procesadas % 150 === 0){
        if(onProgress) onProgress(procesadas, totalAprox);
        await new Promise(r=>setTimeout(r,0));
      }
    }
  }
  resultados.sort((a,b)=>b.score-a.score);
  return resultados;
}

// Intenta encajar el nombre de tema/subtema que sugiere la IA con el temario real ya guardado en
// la app (coincidencia exacta primero, luego por inclusión de texto). Si no hay match claro, null.
function matchTemaByName(categoria, nombre){
  const n = normTxt(nombre);
  if(!n) return null;
  const temas = testCatTemario(categoria);
  let idx = temas.findIndex(t=>normTxt(t.nombre)===n);
  if(idx<0) idx = temas.findIndex(t=>normTxt(t.nombre).includes(n) || n.includes(normTxt(t.nombre)));
  return idx>=0 ? idx+1 : null;
}
function matchSubtemaByName(categoria, temaNum, nombre){
  const n = normTxt(nombre);
  if(!n || !temaNum) return null;
  const subs = testCatSubtemas(categoria, temaNum);
  let idx = subs.findIndex(s=>normTxt(s)===n);
  if(idx<0) idx = subs.findIndex(s=>normTxt(s).includes(n) || n.includes(normTxt(s)));
  return idx>=0 ? idx+1 : null;
}
function buildTemarioPromptContext(categoria){
  const temas = testCatTemario(categoria);

/* ---- Troceado de PDFs largos por rango de páginas (usa pdf-lib, cargado en el <head>) ----
   Objetivo: con simulacros de 80-100 preguntas, mandar el PDF entero en una sola llamada a Gemini
   puede truncarse o fallar. Si el PDF tiene más páginas de las que quepan en un "trozo", se divide
   en varios documentos más pequeños (por rango de páginas) y se hace una llamada encadenada por
   cada uno, acumulando los resultados según van llegando (más lento, pero mucho más fiable). */
function pdfLibDisponible(){ return typeof PDFLib !== 'undefined'; }
async function getPdfPageCount(file){
  const bytes = await file.arrayBuffer();
  const doc = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption:true });
  return doc.getPageCount();
}
// Devuelve un Blob con solo las páginas [startPage, endPage] (1-indexado, ambos incluidos) del PDF
// original. fileToBase64() acepta Blobs igual que Files (usa FileReader), así que este resultado
// se puede pasar directamente a callIAGenerarPreguntas() como si fuera el archivo subido.
async function extractPdfPageRange(file, startPage, endPage){
  const bytes = await file.arrayBuffer();
  const srcDoc = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption:true });
  const outDoc = await PDFLib.PDFDocument.create();
  const indices = []; for(let p=startPage; p<=endPage; p++) indices.push(p-1);
  const pages = await outDoc.copyPages(srcDoc, indices);
  pages.forEach(p=>outDoc.addPage(p));
  const outBytes = await outDoc.save();
  return new Blob([outBytes], {type:'application/pdf'});
}
// Calcula los rangos de página [{start,end}, ...] en trozos de `porTrozo` páginas.
function calcularRangosPaginas(totalPaginas, porTrozo){
  const rangos = [];
  for(let start=1; start<=totalPaginas; start+=porTrozo){
    rangos.push({start, end: Math.min(start+porTrozo-1, totalPaginas)});
  }
  return rangos;
}

async function callIAGenerarPreguntas(file, file2, categoria, cantidad, instrucciones){
  const nombre1 = file.name || 'documento.pdf';
  const b64 = await fileToBase64(file);
  const nombre2 = file2 ? (file2.name || 'respuestas.pdf') : null;
  const b64_2 = file2 ? await fileToBase64(file2) : null;
  const tipo = testTipoForCategoria(categoria);
  const temarioCtx = buildTemarioPromptContext(categoria);
  const schema = jsonSchemaForTipoGen(tipo);
  const prompt = 'Eres un preparador de oposiciones a Guardia Civil. Te adjunto '+(b64_2 ? 'DOS documentos PDF' : 'un documento PDF')+': '
    + (b64_2
        ? 'el DOCUMENTO 1 contiene las preguntas de un examen/simulacro (puede que sin la solución visible), y el DOCUMENTO 2 contiene la plantilla de respuestas o corrección de ese mismo examen (normalmente una lista de nº de pregunta → letra/opción correcta).\n'
        : 'puede ser temario oficial (texto explicativo), un examen ya corregido, o un simulacro de test.\n')
    + 'Categoría de destino en el banco de preguntas: "'+testCatLabel(categoria)+'".\n'
    + (temarioCtx ? (temarioCtx+'\n') : '')
    + (b64_2
        ? ('Tarea: TRANSCRIBE literalmente cada pregunta del DOCUMENTO 1 (enunciado y las 4 opciones, sin resumir ni reformular), y para cada una busca en el DOCUMENTO 2 cuál es la opción correcta, emparejando por el número de pregunta. No te inventes la respuesta correcta: si para alguna pregunta no encuentras su número en el documento de respuestas, pon "correcta":null en vez de adivinar. Se esperan aproximadamente '+cantidad+' preguntas en el documento; transcribe todas las que encuentres (pueden ser más o menos).\n')
        : ('Tarea: genera hasta '+cantidad+' preguntas de test EN ESPAÑOL a partir del contenido real de ese PDF.\n'
           + '- Si el PDF ya contiene preguntas de examen con su solución/corrección, transcríbelas tal cual (respeta la opción marcada como correcta).\n'
           + '- Si el PDF es temario explicativo sin preguntas, redacta tú preguntas nuevas que evalúen ese contenido con precisión, sin salirte de lo que dice el documento.\n'
           + '- No inventes datos ni preguntas que no estén respaldadas por el documento: si no da para '+cantidad+', genera menos.\n'))
    + '- No repitas preguntas entre sí.\n'
    + (instrucciones ? ('Instrucciones adicionales del usuario: '+instrucciones+'\n') : '')
    + 'Devuelve SOLO un array JSON válido (sin texto adicional, sin backticks, sin comentarios), donde cada elemento tiene esta forma exacta:\n'
    + schema + '\n'
    + 'Reglas: "tema_sugerido" es el nombre EXACTO de uno de los temas listados arriba si la pregunta encaja claramente, o null si no. "subtema_sugerido" igual, con nombre exacto de subtema, o null.';
  const contenido = [];
  if(b64_2) contenido.push({tipo:'texto', texto:'DOCUMENTO 1 (preguntas):'});
  contenido.push({tipo:'pdf', b64, nombre:nombre1});
  if(b64_2){ contenido.push({tipo:'texto', texto:'DOCUMENTO 2 (respuestas / corrección):'}); contenido.push({tipo:'pdf', b64:b64_2, nombre:nombre2}); }
  contenido.push({tipo:'texto', texto:prompt});
  const maxTokens = Math.min(32768, Math.max(4096, cantidad*220));
  // Solo Gemini y OpenRouter saben leer PDFs; el proveedor extra (incluirExtra=false) se salta aquí.
  const texto = await llamarIAConFallback(contenido, {temperature:0.15, maxTokens}, false);
  const clean = limpiarJsonIA(texto);
  let parsed;
  try{ parsed = JSON.parse(clean); }catch(e){ throw new Error('No se pudo interpretar la respuesta de '+ultimoProveedorIA+' como JSON. Prueba de nuevo o con un PDF más corto.'); }
  if(!Array.isArray(parsed)) throw new Error(ultimoProveedorIA+' no devolvió una lista de preguntas.');
  return parsed;
}
function buildCandidatosFromParsed(parsed, categoria, origenArchivo){
  const tipo = testTipoForCategoria(categoria);
  const nuevos = [];
  parsed.forEach((p,i)=>{
    const temaNum = p.tema_sugerido ? matchTemaByName(categoria, p.tema_sugerido) : null;
    const subtemaNum = (temaNum && p.subtema_sugerido) ? matchSubtemaByName(categoria, temaNum, p.subtema_sugerido) : null;
    const c = { _uid:'gen_'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,6), incluir:true, categoria, tipo, tema:temaNum, subtema:subtemaNum, explicacion:(p.explicacion||'').trim(), origenArchivo: origenArchivo || null };
    if(tipo==='ortografia'){
      c.enunciado = (p.enunciado||'').trim();
      c.palabras = Array.isArray(p.palabras) ? p.palabras.slice(0,4).map(w=>({texto:(w&&w.texto||'').toString().trim(), incorrecta:!!(w&&w.incorrecta)})) : [];
    } else if(tipo==='gramatica'){
      c.enunciado = (p.enunciado||'').trim();
      c.correcta = !!p.correcta;
    } else {
      c.enunciado = (p.enunciado||'').trim();
      c.opciones = Array.isArray(p.opciones) ? p.opciones.map(o=>String(o).trim()).filter(o=>o.length) : [];
      // null = la IA no encontró la respuesta correcta (p. ej. no la localizó en el documento de
      // corrección); se deja sin marcar a propósito, mejor que adivinar, y hay que revisarla a mano.
      c.correcta = (typeof p.correcta==='number') ? p.correcta : null;
    }
    if(c.enunciado){
      // Comprueba contra el banco YA guardado y contra las preguntas que llevamos procesadas de
      // este mismo lote (dos preguntas repetidas dentro del propio PDF, algo que también pasa).
      const dup = buscarPosibleDuplicado(c.enunciado, categoria, testsGenState.candidatos.concat(nuevos));
      c.posibleDuplicado = dup;
      // Si el parecido es muy alto, se desmarca por defecto para que el guardado rápido no la
      // cuele sin que el admin la vea; si es solo "sospechoso", se deja marcada pero avisada.
      if(dup && dup.score>=0.7) c.incluir = false;
      nuevos.push(c);
    }
  });
  return nuevos;
}
function buildQuestionFromCandidato(c){
  const q = {
    id: 'q_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    categoria: c.categoria,
    tema: c.tema || null,
    subtema: c.subtema || null,
    tipo: c.tipo,
    origen: 'ia_pdf',
    origenArchivo: c.origenArchivo || null,
    explicacion: (c.explicacion||'').trim(),
    creado: Date.now(),
    actualizado: Date.now(),
    borrado: false,
    stats: {veces:0, aciertos:0}
  };
  if(c.tipo==='ortografia'){
    q.enunciado = c.enunciado;
    q.palabras = c.palabras;
  } else if(c.tipo==='gramatica'){
    q.enunciado = c.enunciado;
    q.correcta = !!c.correcta;
  } else {
    q.enunciado = c.enunciado;
    q.opciones = c.opciones;
    q.correcta = c.correcta;
    q.imagenes = [];
  }
  return q;
}

function renderTests(){
  const host = document.getElementById('testsHost');
  if(!host) return;
  guardarTestEnCurso();
  document.body.classList.toggle('modo-conc', modoConcentracion && !!testsQuiz && !testsQuiz.corregido && testsActiveSubtab==='practicar');
  host.innerHTML = '';
  // Los usuarios no-admin solo pueden practicar (y ver su propio progreso): no ven el banco de
  // preguntas (verlo, editarlo o borrarlo) ni la opción de añadir preguntas nuevas.
  if(!isAdmin && testsActiveSubtab!=='progreso' && testsActiveSubtab!=='legal') testsActiveSubtab = 'practicar';
  // "Generar con IA" vive ahora dentro de "Añadir pregunta" (como uno de los 3 métodos), en vez
  // de ser una pestaña aparte; si alguien llega con el estado antiguo, lo redirige sin más.
  if(testsActiveSubtab==='generarIA') testsActiveSubtab = 'anadir';
  const TAB_ICONS = { practicar:'📝', banco:'📚', anadir:'➕', temario:'📖', legal:'⚖️', progreso:'📊' };
  const tabs = isAdmin
    ? [['practicar','Practicar'],['banco','Banco de preguntas'],['anadir','Añadir pregunta'],['temario','Temario'],['legal','Asistente legal'],['progreso','Progreso']]
    : [['practicar','Practicar'],['legal','Asistente legal'],['progreso','Progreso']];
  // Franja de resumen: da un primer vistazo tipo "panel de control" antes de las pestañas, con
  // los números que más importan (tamaño del banco y precisión global de quien practica).
  const questions = state.testBank.questions || [];
  const practicadas = questions.filter(q=>q.stats && q.stats.veces>0);
  const totalIntentos = questions.reduce((s,q)=> s+(q.stats && q.stats.veces||0), 0);
  const totalAciertos = questions.reduce((s,q)=> s+(q.stats && q.stats.aciertos||0), 0);
  const precisionGlobal = totalIntentos ? Math.round((totalAciertos/totalIntentos)*100) : null;
  const racha = calcularRachaActual();
  const strip = document.createElement('div'); strip.className='stat-strip';
  const chips = isAdmin
    ? [[String(questions.length),'Preguntas en el banco'],[String(practicadas.length),'Practicadas alguna vez'],[precisionGlobal!==null?precisionGlobal+'%':'—','Acierto global'],[(racha?'🔥 ':'')+racha,'Días seguidos']]
    : [[String(practicadas.length),'Preguntas practicadas'],[precisionGlobal!==null?precisionGlobal+'%':'—','Tu acierto global'],[(racha?'🔥 ':'')+racha,'Días seguidos']];
  chips.forEach(([num,lbl])=>{
    const chip = document.createElement('div'); chip.className='stat-chip';
    chip.innerHTML = '<div class="stat-num">'+num+'</div><div class="stat-lbl">'+lbl+'</div>';
    strip.appendChild(chip);
  });
  host.appendChild(strip);
  const nav = document.createElement('div'); nav.className='test-subnav';
  tabs.forEach(([key,label])=>{
    const b = document.createElement('button'); b.type='button';
    b.innerHTML = '<span class="tab-ic">'+(TAB_ICONS[key]||'')+'</span><span>'+label+'</span>';
    if(testsActiveSubtab===key) b.classList.add('active');
    b.onclick = ()=>{ const cambiaAPracticar = key==='practicar' && testsActiveSubtab!=='practicar'; testsActiveSubtab = key; if(key!=='practicar'){ clearQuizTimer(); testsQuiz=null; } else if(cambiaAPracticar && !testsQuiz){ resetTestsWizard(); } renderTests(); };
    nav.appendChild(b);
  });
  host.appendChild(nav);
  const body = document.createElement('div');
  host.appendChild(body);
  if(testsActiveSubtab==='practicar') renderTestsPracticar(body);
  else if(testsActiveSubtab==='banco') renderTestsBanco(body);
  else if(testsActiveSubtab==='temario') renderTestsTemario(body);
  else if(testsActiveSubtab==='legal') renderTestsLegal(body);
  else if(testsActiveSubtab==='progreso') renderTestsProgreso(body);
  else renderTestsAnadir(body);
}

/* ===================== VARIAS FOTOS → VARIAS PREGUNTAS =====================
   Hasta MAX_FOTOS_LOTE fotos por tanda; cada foto es UNA pregunta distinta (con su retroalimentación
   visible). Se manda una llamada a la IA por foto, así cada foto da exactamente una pregunta y, si una
   falla, las demás siguen. Las preguntas transcritas van a la misma lista de revisión que "Desde PDF":
   nada se guarda en el banco hasta que las revisas y pulsas guardar. */
const MAX_FOTOS_LOTE = 5;
let testsFotosLote = { modo:'varias', files:[], categoria:'conocimientos', procesando:false, progreso:null, errores:[], uiKeyOpen:false };
async function callIATranscribirFotoLote(file, categoria){
  let b64, mime = 'image/jpeg';
  try{
    // Se reduce la foto (lado máx. 1600 px) para que suba rápido sin perder legibilidad del texto.
    b64 = (await fileToCompressedDataURL(file, 1600, 0.85)).split(',')[1];
  }catch(e){
    b64 = await fileToBase64(file); mime = file.type || 'image/jpeg';
  }
  const temarioCtx = buildTemarioPromptContext(categoria);
  const schema = '{"enunciado":"texto literal de la pregunta","opciones":["opción A","opción B","opción C","opción D"],"correcta":0,"explicacion":"retroalimentación que aparece en la imagen, o cadena vacía si no hay","tema_sugerido":null,"subtema_sugerido":null}';
  const prompt = 'Esta imagen es una captura o foto de UNA pregunta de un test de oposición ya respondido (puede estar acertada, fallada o en blanco), normalmente con la retroalimentación o corrección visible.\n'
    + 'Categoría de destino en el banco de preguntas: "'+testCatLabel(categoria)+'".\n'
    + (temarioCtx ? (temarioCtx+'\n') : '')
    + 'Tarea: transcribe LITERALMENTE el enunciado y todas las opciones que aparezcan (sin resumir ni reformular). Si en la imagen hay retroalimentación o explicación, cópiala en "explicacion" lo más completa posible: puedes quitar elementos de la interfaz (botones, números de página…), pero no la resumas hasta perder contenido. Si hay más de una pregunta en la imagen, transcribe solo la principal.\n'
    + 'Devuelve SOLO un objeto JSON válido (sin texto adicional, sin backticks, sin comentarios) con esta forma exacta:\n'+schema+'\n'
    + 'Reglas: "correcta" es el índice (empezando en 0) de la opción correcta; dedúcelo de la retroalimentación o de las marcas de corrección aunque el usuario la haya fallado o dejado en blanco; si no puedes saberlo pon null (NO te lo inventes). '
    + '"tema_sugerido" es el nombre EXACTO de uno de los temas listados arriba si la pregunta encaja claramente, o null. "subtema_sugerido" igual, con nombre exacto de subtema, o null.';
  const contenido = [{ tipo:'imagen', mime, b64 }, { tipo:'texto', texto:prompt }];
  const texto = await llamarIAConFallback(contenido, { temperature:0.1, maxTokens:2500 }, true);
  let parsed;
  try{ parsed = JSON.parse(limpiarJsonIA(texto)); }
  catch(e){ throw new Error('No se pudo interpretar la respuesta de '+ultimoProveedorIA+' para esta foto.'); }
  if(Array.isArray(parsed)) parsed = parsed[0];
  if(!parsed || typeof parsed!=='object') throw new Error('La IA no devolvió una pregunta para esta foto.');
  return parsed;
}
async function ejecutarTranscripcionLote(){
  const st = testsFotosLote;
  if(st.procesando) return;
  if(!st.files.length){ showToast('Selecciona al menos una foto.'); return; }
  st.procesando = true; st.errores = []; st.progreso = null; renderTests();
  const archivos = st.files.slice();
  const fallidas = [];
  let ok = 0, dups = 0;
  for(let i=0;i<archivos.length;i++){
    st.progreso = { actual:i+1, total:archivos.length }; renderTests();
    try{
      const parsed = await callIATranscribirFotoLote(archivos[i], st.categoria);
      const nuevos = buildCandidatosFromParsed([parsed], st.categoria, '📷 Foto '+(i+1)+(archivos[i].name ? ' · '+archivos[i].name : ''));
      if(!nuevos.length) throw new Error('No se pudo leer ningún enunciado en esta foto.');
      testsGenState.candidatos = testsGenState.candidatos.concat(nuevos);
      persistGenDraft();
      ok++; dups += nuevos.filter(c=>c.posibleDuplicado).length;
    }catch(err){
      console.error(err);
      fallidas.push(archivos[i]);
      st.errores.push({ n:i+1, nombre: archivos[i].name || ('foto '+(i+1)), error: (err && err.message) || 'error desconocido' });
    }
  }
  st.files = fallidas; // las que fallaron se quedan para reintentarlas con un solo clic
  st.procesando = false; st.progreso = null;
  renderTests();
  if(ok) document.getElementById('genResultsAnchor')?.scrollIntoView({behavior:'smooth'});
  showToast(ok
    ? (ok+' pregunta'+(ok===1?'':'s')+' transcrita'+(ok===1?'':'s')+' con '+(ultimoProveedorIA||'IA')+(dups?(', '+dups+' parece'+(dups===1?'':'n')+' duplicada'+(dups===1?'':'s')):'')+(fallidas.length?(' · '+fallidas.length+' foto(s) fallaron'):'')+'. Revísalas abajo antes de guardar ✓')
    : 'No se pudo transcribir ninguna foto. Mira el detalle debajo del botón.');
}

/* ---- Sub-vista: Generar con IA (desde PDF: temario, exámenes, simulacros...) ---- */
/* ---- Contador de segundos transcurridos mientras genera (solo actualiza el <span>, sin volver a
   pintar toda la vista cada segundo para no perder el foco de otros campos). ---- */
let genTimerHandle = null;
function startGenTimer(){
  stopGenTimer();
  testsGenState.tiempoInicio = Date.now();
  genTimerHandle = setInterval(()=>{
    const span = document.getElementById('genElapsedSpan');
    if(span){ span.textContent = ' ('+Math.floor((Date.now()-testsGenState.tiempoInicio)/1000)+'s)'; }
  }, 1000);
}
function stopGenTimer(){ if(genTimerHandle){ clearInterval(genTimerHandle); genTimerHandle=null; } }

/* ---- Lanza (o relanza, con "Reintentar") la generación con la config actual de testsGenState.
   Si el PDF principal es largo y el troceado está activado, lo divide en varias llamadas por rango
   de páginas y va acumulando candidatos (y guardando el borrador) trozo a trozo, así que si un
   trozo falla a mitad de camino no se pierde lo que ya se generó de los trozos anteriores. ---- */
async function ejecutarGeneracionIA(){
  if(!testsGenState.file){ showToast('Selecciona primero un PDF.'); return; }
  testsGenState.generando = true;
  testsGenState.ultimoError = null;
  testsGenState.progreso = null;
  renderTests();
  startGenTimer();
  const nombreArchivo = testsGenState.file.name;
  let totalGeneradas = 0, totalDups = 0;
  try{
    // rango {start:null,end:null} = mandar el documento entero, sin trocear.
    let rangos = [{start:null, end:null}];
    if(testsGenState.trocear && pdfLibDisponible()){
      try{
        const totalPaginas = await getPdfPageCount(testsGenState.file);
        if(totalPaginas > testsGenState.paginasPorTrozo) rangos = calcularRangosPaginas(totalPaginas, testsGenState.paginasPorTrozo);
      }catch(e){ console.error('No se pudo contar las páginas del PDF, se sube entero:', e); }
    }
    const numTrozos = rangos.length;
    const cantidadPorTrozo = Math.max(1, Math.ceil(testsGenState.cantidad / numTrozos));
    for(let i=0;i<numTrozos;i++){
      const {start,end} = rangos[i];
      testsGenState.progreso = numTrozos>1 ? {actual:i+1, total:numTrozos, paginas: start!=null?(start+'–'+end):null} : null;
      renderTests();
      const filePart = (start!=null) ? await extractPdfPageRange(testsGenState.file, start, end) : testsGenState.file;
      const parsed = await callIAGenerarPreguntas(filePart, testsGenState.file2, testsGenState.categoria, cantidadPorTrozo, testsGenState.instrucciones.trim());
      const nuevos = buildCandidatosFromParsed(parsed, testsGenState.categoria, nombreArchivo);
      if(nuevos.length){
        testsGenState.candidatos = testsGenState.candidatos.concat(nuevos);
        totalGeneradas += nuevos.length;
        totalDups += nuevos.filter(c=>c.posibleDuplicado).length;
        persistGenDraft();
        renderTests();
      }
    }
    if(!totalGeneradas){
      showToast('La IA no devolvió ninguna pregunta válida. Prueba con otro PDF o revisa la clave API.');
    } else {
      showToast(totalGeneradas+' pregunta(s) generada(s) con '+(ultimoProveedorIA||'IA')+(totalDups?(', '+totalDups+' parecen duplicadas'):'')+(numTrozos>1?(' (en '+numTrozos+' trozos)'):'')+', revísalas abajo antes de guardar ✓');
    }
  }catch(err){
    console.error(err);
    const base = err.message || 'No se pudo generar preguntas desde el PDF.';
    testsGenState.ultimoError = base + (totalGeneradas ? (' Se guardaron '+totalGeneradas+' pregunta(s) de los trozos anteriores (abajo, en la lista de revisión); puedes reintentar para completar el resto o guardarlas ya.') : '');
    showToast(base);
  }finally{
    testsGenState.generando = false;
    testsGenState.progreso = null;
    stopGenTimer();
    renderTests();
    document.getElementById('genResultsAnchor')?.scrollIntoView({behavior:'smooth'});
  }
}

      subtemasArr.forEach((nombre,i)=>{ const o=document.createElement('option'); o.value=i+1; o.textContent=nombre; if(c.subtema===i+1) o.selected=true; subSel.appendChild(o); });

      const r = document.createElement('div'); r.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:6px;';

    }
    paintOpts();
    optsWrap.appendChild(optsList);
    const addOptBtn = document.createElement('button'); addOptBtn.type='button'; addOptBtn.className='tick-add'; addOptBtn.textContent='+ Añadir opción';

  const btnRow = document.createElement('div'); btnRow.style.cssText='display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;';
  const saveBtn = document.createElement('button'); saveBtn.type='button'; saveBtn.className='btn small';
  saveBtn.textContent = 'Guardar esta pregunta en el banco';

    renderTests();
  };
  btnRow.appendChild(saveBtn);

  discardBtn.textContent = 'Descartar';
  discardBtn.onclick = ()=>{
    testsGenState.candidatos = testsGenState.candidatos.filter(x=>x._uid!==c._uid);

    document.body.removeChild(overlay);

  };
  btnRow.appendChild(discardBtn);
  const closeBtn = document.createElement('button'); closeBtn.type='button'; closeBtn.className='btn small ghost';
  closeBtn.textContent = 'Cerrar sin guardar cambios';
  closeBtn.onclick = ()=>{ persistGenDraft(); document.body.removeChild(overlay); };
  btnRow.appendChild(closeBtn);
  box.appendChild(btnRow);

  document.body.appendChild(overlay);

function buildStatBarRow(label, aciertos, intentos, subtext){
  const pct = intentos ? Math.round((aciertos/intentos)*100) : 0;

  head.innerHTML = `<span>${label}</span><span style="font-family:var(--font-mono);white-space:nowrap;">${pct}% (${aciertos}/${intentos})</span>`;
  row.appendChild(head);
  const barBg = document.createElement('div'); barBg.style.cssText='background:var(--line);border-radius:3px;height:8px;overflow:hidden;';
  const barFill = document.createElement('div');

  barFill.style.cssText = 'height:100%;width:'+pct+'%;background:'+color+';';
  barBg.appendChild(barFill);

// Estado de un tema según tus resultados: vacío (sin preguntas), sin ver, flojo, en camino o dominado.
// "Dominio" = de las preguntas que has practicado, cuántas tienes bien ahora (último intento acertado).
function estadoTemaMapa(preguntas){
  const total = preguntas.length;
  if(!total) return { clave:'vacio', total:0, practicadas:0, dominio:0, cobertura:0 };
  const practicadas = preguntas.filter(q=>!esNueva(q)).length;
  if(!practicadas) return { clave:'sinver', total, practicadas:0, dominio:0, cobertura:0 };
  const fallos = preguntas.filter(esFallada).length;
  const dominio = (practicadas - fallos) / practicadas;
  const cobertura = practicadas / total;
  let clave = 'camino';
  if(dominio < 0.6) clave = 'flojo';
  else if(dominio >= 0.85 && cobertura >= 0.7) clave = 'dominado';
  return { clave, total, practicadas, dominio, cobertura };
}

  wrap.appendChild(resumen);

  [['dominado','Dominado'],['camino','En camino'],['flojo','Flojo'],['sinver','Sin ver']].forEach(([k,l])=>{
    const sp = document.createElement('span'); const i = document.createElement('i'); i.className = k;
    sp.appendChild(i); sp.appendChild(document.createTextNode(l)); ley.appendChild(sp);

  wrap.appendChild(ley);

      sub.textContent = e.clave==='vacio' ? 'Sin preguntas' : (e.clave==='sinver' ? e.total+' preguntas · sin ver' : Math.round(e.dominio*100)+'% bien · '+e.practicadas+'/'+e.total+' vistas');

  return wrap;
}
// Quita emojis y símbolos que la fuente estándar del PDF (Helvetica/WinAnsi) no puede
// codificar, y normaliza comillas/guiones "raros" a su equivalente ASCII más cercano.
function pdfSafe(s){
  return String(s==null?'':s)
    .replace(/\u2026/g, '...')
    .replace(/[\u2018\u2019]/g, "'")
    .replace(/[\u201C\u201D]/g, '"')
    .replace(/[\u2013\u2014]/g, '-')
    .replace(/[^\x00-\xFF]/g, '');
}
// Recorta un texto con "…" si no cabe en el ancho disponible, para que las tablas del
// informe no se descuadren con nombres de tema largos.
function pdfTruncar(texto, font, size, maxWidth){
  let t = texto;
  if(font.widthOfTextAtSize(t, size) <= maxWidth) return t;
  while(t.length>1 && font.widthOfTextAtSize(t+'...', size) > maxWidth) t = t.slice(0,-1);
  return t+'...';
}
// Genera y descarga un informe en PDF con el resumen de progreso: pensado para llevarlo
// impreso o en PDF a un preparador o academia. Usa pdf-lib (ya cargado para trocear PDFs).
async function exportarProgresoPDF(){
  if(!pdfLibDisponible()){ showToast('No se pudo generar el PDF: la librería no está disponible sin conexión.'); return; }
  showToast('Generando el PDF…');
  try{
    const { PDFDocument, StandardFonts, rgb } = PDFLib;
    const doc = await PDFDocument.create();
    const fontR = await doc.embedFont(StandardFonts.Helvetica);
    const fontB = await doc.embedFont(StandardFonts.HelveticaBold);
    const pageW = 595.28, pageH = 841.89, margin = 50; // A4 en puntos
    const contentW = pageW - margin*2;
    let page = doc.addPage([pageW, pageH]);
    let y = pageH - margin;
    const cAmber = rgb(0.72, 0.53, 0.16), cText = rgb(0.13,0.13,0.13), cMuted = rgb(0.45,0.45,0.45), cLine = rgb(0.82,0.82,0.82);

    function ensureSpace(h){
      if(y - h < margin){ page = doc.addPage([pageW, pageH]); y = pageH - margin; }
    }
    function heading(texto){
      ensureSpace(26);
      page.drawText(pdfSafe(texto), { x:margin, y, size:17, font:fontB, color:cAmber });
      y -= 24;
    }
    function subheading(texto){
      ensureSpace(28);
      y -= 6;
      page.drawText(pdfSafe(texto), { x:margin, y, size:12, font:fontB, color:cText });
      y -= 16;
    }
    function parrafo(texto, opts={}){
      const size = opts.size || 10, color = opts.color || cMuted;
      const palabras = pdfSafe(texto).split(' ');
      let linea = '';
      const lineas = [];
      palabras.forEach(w=>{
        const prueba = linea ? linea+' '+w : w;
        if(fontR.widthOfTextAtSize(prueba, size) > contentW && linea){ lineas.push(linea); linea = w; }
        else linea = prueba;
      });
      if(linea) lineas.push(linea);
      lineas.forEach(l=>{
        ensureSpace(size+5);
        page.drawText(l, { x:margin, y, size, font:fontR, color });
        y -= size+5;
      });
    }
    const ANCHOS_TABLA = [contentW-220, 110, 110];
    function filaTabla(cols, opts={}){
      ensureSpace(16);
      let x = margin;
      const size = opts.size || 10, font = opts.bold ? fontB : fontR, color = opts.color || cText;
      cols.forEach((c, i)=>{
        const w = ANCHOS_TABLA[i] - 8;
        const texto = i===0 ? pdfTruncar(pdfSafe(c), font, size, w) : pdfSafe(c);
        page.drawText(texto, { x, y, size, font, color });
        x += ANCHOS_TABLA[i];
      });
      y -= size + 7;
    }
    function linea(){
      ensureSpace(10);
      page.drawLine({ start:{x:margin,y}, end:{x:pageW-margin,y}, thickness:0.6, color:cLine });
      y -= 12;
    }

    const questions = state.testBank.questions || [];

    // ---- Cabecera ----
    heading('OpoTest - Informe de progreso');
    const email = (auth.currentUser && auth.currentUser.email) || 'cuenta sin email';
    parrafo(email + '  ·  generado el ' + new Date().toLocaleString('es-ES'));
    linea();

    // ---- Resumen general ----
    const totalPreguntas = questions.length;
    const practicadas = questions.filter(q=>q.stats && q.stats.veces>0);
    const totalIntentos = questions.reduce((s,q)=> s+(q.stats && q.stats.veces||0), 0);
    const totalAciertos = questions.reduce((s,q)=> s+(q.stats && q.stats.aciertos||0), 0);
    const precisionGlobal = totalIntentos ? Math.round((totalAciertos/totalIntentos)*100) : null;
    const racha = calcularRachaActual();
    subheading('Resumen general');
    parrafo(totalPreguntas+' preguntas en el banco, '+practicadas.length+' practicadas alguna vez, '+totalIntentos+' intentos en total'
      + (precisionGlobal!==null ? ', '+precisionGlobal+'% de acierto global.' : '.'), {color:cText});
    if(racha>0) parrafo('Racha actual: '+racha+' dia'+(racha===1?'':'s')+' seguido'+(racha===1?'':'s')+' practicando.', {color:cText});
    if(progreso && progreso.examenFecha) parrafo('Fecha de examen marcada: '+progreso.examenFecha+'.', {color:cText});

    // ---- Mapa del temario ----
    let dominados = 0, conPreguntas = 0;
    TEST_CATEGORIAS.filter(c=>testCatTemas(c.key)>0).forEach(c=>{
      testCatTemario(c.key).forEach((t,i)=>{
        const e = estadoTemaMapa(questions.filter(q=>q.categoria===c.key && Number(q.tema)===i+1));
        if(e.total) conPreguntas++;
        if(e.clave==='dominado') dominados++;
      });
    });
    subheading('Mapa del temario');
    parrafo(conPreguntas ? (dominados+' de '+conPreguntas+' temas dominados.') : 'Aun no hay preguntas clasificadas por tema.', {color:cText});

    // ---- Acierto por categoria ----
    const porCategoria = {};
    questions.forEach(q=>{
      const st = q.stats||{};
      if(!st.veces) return;
      const c = porCategoria[q.categoria] = porCategoria[q.categoria] || {intentos:0, aciertos:0, preguntas:0};
      c.intentos += st.veces; c.aciertos += st.aciertos||0; c.preguntas++;
    });
    const catRows = TEST_CATEGORIAS.filter(c=>porCategoria[c.key]);
    subheading('Acierto por categoria');
    if(!catRows.length) parrafo('Todavia no hay categorias con intentos registrados.');
    else{
      filaTabla(['Categoria','Acierto','Intentos'], {bold:true, color:cMuted});
      catRows.forEach(c=>{
        const d = porCategoria[c.key];
        const pct = d.intentos ? Math.round((d.aciertos/d.intentos)*100) : 0;
        filaTabla([c.label, pct+'%', String(d.intentos)]);
      });
    }

    // ---- Temas donde mas falla ----
    const UMBRAL_INTENTOS = 3;
    const porTemaPre = {};
    questions.forEach(q=>{
      const st = q.stats||{};
      if(!st.veces || !q.tema) return;
      const key = q.categoria+'|'+q.tema;
      const t = porTemaPre[key] = porTemaPre[key] || {categoria:q.categoria, tema:q.tema, intentos:0, aciertos:0};
      t.intentos += st.veces; t.aciertos += st.aciertos||0;
    });
    const temasArr = Object.values(porTemaPre).filter(t=>t.intentos>=UMBRAL_INTENTOS);
    temasArr.sort((a,b)=> (a.aciertos/a.intentos) - (b.aciertos/b.intentos));
    subheading('Temas donde mas falla (min. '+UMBRAL_INTENTOS+' intentos)');
    if(!temasArr.length) parrafo('Todavia no hay temas con suficientes intentos para compararlos.');
    else{
      filaTabla(['Tema','Acierto','Intentos'], {bold:true, color:cMuted});
      temasArr.slice(0,12).forEach(t=>{
        const temaObj = testCatTemaObj(t.categoria, t.tema);
        const nombre = testCatLabel(t.categoria)+' - '+(temaObj ? temaObj.nombre : 'Tema '+t.tema);
        const pct = Math.round((t.aciertos/t.intentos)*100);
        filaTabla([nombre, pct+'%', String(t.intentos)]);
      });
    }

    // ---- Ultimos tests realizados ----
    subheading('Ultimos tests realizados');
    const historial = (progreso && Array.isArray(progreso.historial)) ? progreso.historial.slice(-15).reverse() : [];
    if(!historial.length) parrafo('Todavia no hay tests guardados en el historial.');
    else{
      filaTabla(['Fecha','Aciertos','%'], {bold:true, color:cMuted});
      historial.forEach(h=>{
        const pct = h.n ? Math.round((h.ac/h.n)*100) : 0;
        filaTabla([new Date(h.t).toLocaleString('es-ES'), h.ac+'/'+h.n, pct+'%']);
      });
    }

    // ---- Comparativa entre dispositivos ----
    const historialCompleto = (progreso && Array.isArray(progreso.historial)) ? progreso.historial : [];
    const simulacrosCompleto = (progreso && Array.isArray(progreso.simulacros)) ? progreso.simulacros : [];
    const porDvPdf = {};
    const getDvPdf = (dv)=> porDvPdf[dv] = porDvPdf[dv] || { tests:0, intentos:0, aciertos:0, simulacros:0, notaSuma:0 };
    historialCompleto.forEach(h=>{ if(!h.dv) return; const d = getDvPdf(h.dv); d.tests++; d.intentos += h.n; d.aciertos += h.ac; });
    simulacrosCompleto.forEach(s=>{ if(!s.dv) return; const d = getDvPdf(s.dv); d.simulacros++; if(s.max) d.notaSuma += s.nota/s.max; });
    const dvKeysPdf = Object.keys(porDvPdf).sort((a,b)=> (porDvPdf[b].tests+porDvPdf[b].simulacros) - (porDvPdf[a].tests+porDvPdf[a].simulacros));
    subheading('Comparativa entre dispositivos');
    if(!dvKeysPdf.length) parrafo('Todavia no hay tests con el dispositivo identificado.');
    else{
      filaTabla(['Dispositivo','Acierto','Tests'], {bold:true, color:cMuted});
      dvKeysPdf.forEach(dv=>{
        const d = porDvPdf[dv];
        const pct = d.intentos ? Math.round((d.aciertos/d.intentos)*100) : null;
        let etiqueta = dv;
        if(d.simulacros){ const notaMedia = Math.round((d.notaSuma/d.simulacros)*100); etiqueta += ' ('+d.simulacros+' sim., '+notaMedia+'% nota media)'; }
        filaTabla([etiqueta, pct!==null?pct+'%':'-', String(d.tests)]);
      });
    }

    const bytes = await doc.save();
    const blob = new Blob([bytes], { type:'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'opotest-progreso-'+fmtFechaKey(new Date())+'.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 15000);
    showToast('PDF generado ✓');
  }catch(e){
    console.error(e);
    showToast('No se pudo generar el PDF.');
  }
}
// Comparativa entre los dispositivos desde los que has practicado (móvil, ordenador...),
// a partir de la etiqueta "dv" que se guarda en cada test/simulacro nuevo. Los tests
// hechos antes de esta mejora no llevan esa etiqueta y no se pueden repartir por aparato.
function buildComparativaDispositivos(){
  const historial = (progreso && Array.isArray(progreso.historial)) ? progreso.historial : [];
  const simulacros = (progreso && Array.isArray(progreso.simulacros)) ? progreso.simulacros : [];
  const porDv = {};
  const getDv = (dv)=> porDv[dv] = porDv[dv] || { tests:0, intentos:0, aciertos:0, simulacros:0, notaSuma:0 };
  historial.forEach(h=>{
    if(!h.dv) return;
    const d = getDv(h.dv);
    d.tests++; d.intentos += h.n; d.aciertos += h.ac;
  });
  simulacros.forEach(s=>{
    if(!s.dv) return;
    const d = getDv(s.dv);
    d.simulacros++; if(s.max) d.notaSuma += s.nota/s.max;
  });
  const dvKeys = Object.keys(porDv);

  const wrap = document.createElement('div'); wrap.style.marginTop = '20px';
  const title = document.createElement('h5');
  title.style.cssText = 'margin:0 0 8px;font-family:var(--font-display);color:var(--amber-ink);text-transform:uppercase;font-size:13px;letter-spacing:.04em;';
  title.textContent = 'Comparativa entre tus dispositivos';
  wrap.appendChild(title);

  const nameRow = document.createElement('div'); nameRow.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;';
  const nameLabel = document.createElement('span'); nameLabel.style.cssText = 'font-size:12px;color:var(--cream-dim);'; nameLabel.textContent = 'Nombre de este dispositivo:';
  const nameInput = document.createElement('input'); nameInput.type = 'text'; nameInput.value = nombreDispositivo(); nameInput.maxLength = 30;
  nameInput.style.cssText = 'background:var(--bg-panel-2);color:var(--cream);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:var(--font-mono);font-size:12px;max-width:160px;';
  nameInput.onchange = ()=>{
    const anterior = nombreDispositivo();
    const nuevo = nameInput.value.trim() || nombreDispositivoPorDefecto();
    cambiarNombreDispositivo(nuevo);
    if(anterior && anterior !== nuevo){
      const haySolapados = (progreso.historial||[]).some(h=>h.dv===anterior) || (progreso.simulacros||[]).some(s=>s.dv===anterior);
      if(haySolapados && confirm('También tienes tests guardados con el nombre antiguo ("'+anterior+'"). ¿Quieres pasarlos a "'+nuevo+'" para que se cuenten juntos en la comparativa?')){
        (progreso.historial||[]).forEach(h=>{ if(h.dv===anterior) h.dv = nuevo; });
        (progreso.simulacros||[]).forEach(s=>{ if(s.dv===anterior) s.dv = nuevo; });
        programarGuardadoProgreso(true);
      }
    }
    showToast('Nombre del dispositivo guardado ✓');
    renderTests();
  };
  nameRow.appendChild(nameLabel); nameRow.appendChild(nameInput);
  wrap.appendChild(nameRow);

  if(!dvKeys.length){
    const empty = document.createElement('div'); empty.className = 'test-empty';
    empty.textContent = 'Todavía no hay tests con el dispositivo identificado: en cuanto termines alguno desde aquí, aparecerá en esta comparativa.';
    wrap.appendChild(empty);
    return wrap;
  }
  dvKeys.sort((a,b)=> (porDv[b].tests+porDv[b].simulacros) - (porDv[a].tests+porDv[a].simulacros));
  const esEste = nombreDispositivo();
  dvKeys.forEach(dv=>{
    const d = porDv[dv];
    const pct = d.intentos ? Math.round((d.aciertos/d.intentos)*100) : null;
    const notaMedia = d.simulacros ? Math.round((d.notaSuma/d.simulacros)*100) : null;
    let sub = d.tests+' test'+(d.tests===1?'':'s')+(pct!==null ? ' · '+pct+'% de acierto' : '');
    if(d.simulacros) sub += ' · '+d.simulacros+' simulacro'+(d.simulacros===1?'':'s')+(notaMedia!==null ? ' ('+notaMedia+'% de nota media)' : '');
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg-panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:6px;';
    const nameSpan = document.createElement('span'); nameSpan.style.cssText = 'font-family:var(--font-mono);font-size:12px;color:var(--cream);';
    nameSpan.textContent = dv + (dv===esEste ? ' (este)' : '');
    const subSpan = document.createElement('span'); subSpan.style.cssText = 'font-family:var(--font-mono);font-size:12px;color:var(--cream-dim);';
    subSpan.textContent = sub;
    row.appendChild(nameSpan); row.appendChild(subSpan);
    wrap.appendChild(row);
  });
  const nota = document.createElement('div'); nota.style.cssText = 'font-size:11px;color:var(--muted);margin-top:6px;';
  nota.textContent = 'Solo cuenta lo que hagas de aquí en adelante: los tests guardados antes de esta mejora no llevan el dispositivo apuntado.';
  wrap.appendChild(nota);
  return wrap;
}

    const d = porCategoria[c.key];
    if(!d) return;
    panel.appendChild(buildStatBarRow(c.label, d.aciertos, d.intentos, d.preguntas+' pregunta(s) practicada(s)'));
  });

  // Ranking completo "dónde más fallo" (temasArr y UMBRAL_INTENTOS ya se calcularon arriba,
  // antes de pintar nada, para poder mostrar ya el resumen de "puntos débiles").
  const rankTitle = document.createElement('h5');
  rankTitle.style.cssText = 'margin:20px 0 8px;font-family:var(--font-display);color:var(--amber-ink);text-transform:uppercase;font-size:13px;letter-spacing:.04em;';
  rankTitle.textContent = 'Temas donde más fallas (mín. '+UMBRAL_INTENTOS+' intentos)';
  panel.appendChild(rankTitle);
  if(!temasArr.length){
    const nota = document.createElement('div'); nota.className='test-empty';
    nota.textContent = 'Todavía no hay ningún tema con al menos '+UMBRAL_INTENTOS+' intentos para poder compararlos.';
    panel.appendChild(nota);
  } else {
    temasArr.slice(0,10).forEach(t=>{
      const temaObj = testCatTemaObj(t.categoria, t.tema);
      const nombre = testCatLabel(t.categoria)+' · '+(temaObj ? temaObj.nombre : 'Tema '+t.tema);
      panel.appendChild(buildStatBarRow(nombre, t.aciertos, t.intentos, t.preguntas+' pregunta(s) de este tema practicadas'));
    });
  }

  panel.appendChild(buildComparativaDispositivos());

  body.appendChild(panel);
}

  trashBtn.textContent = testsBancoFiltro.papelera ? '← Volver al banco' : `🗑 Papelera (${trash.length})`;
  trashBtn.onclick = ()=>{ testsBancoFiltro.papelera = !testsBancoFiltro.papelera; renderTests(); };
  btnGroup.appendChild(trashBtn);
  headWrap.appendChild(btnGroup);
  panel.appendChild(headWrap);
  if(!testsBancoFiltro.papelera) renderSaludBanco(panel);
  if(!testsBancoFiltro.papelera) renderTelegramConfigPanel(panel);
  const row = document.createElement('div'); row.className='test-row';
  const catField = document.createElement('div'); catField.className='test-field';
  catField.innerHTML = '<label>Categoría</label>';
  const catSel = document.createElement('select');
  const optAll = document.createElement('option'); optAll.value=''; optAll.textContent='Todas'; catSel.appendChild(optAll);
  TEST_CATEGORIAS.forEach(c=>{ const o=document.createElement('option'); o.value=c.key; o.textContent=c.label; if(testsBancoFiltro.categoria===c.key) o.selected=true; catSel.appendChild(o); });
  catSel.onchange = ()=>{ testsBancoFiltro.categoria = catSel.value; testsBancoFiltro.tema=''; testsBancoFiltro.subtema=''; renderTests(); };
  catField.appendChild(catSel);
  row.appendChild(catField);
  const temaMaxBanco = testCatTemas(testsBancoFiltro.categoria);
  if(temaMaxBanco>0){
    const temaField = document.createElement('div'); temaField.className='test-field';
    temaField.innerHTML = '<label>Tema</label>';
    const temaSel = document.createElement('select');
    const optAllTema = document.createElement('option'); optAllTema.value=''; optAllTema.textContent='Todos'; temaSel.appendChild(optAllTema);
    for(let i=1;i<=temaMaxBanco;i++){ const t = testCatTemaObj(testsBancoFiltro.categoria,i); const o=document.createElement('option'); o.value=i; o.textContent=t.nombre; if(String(testsBancoFiltro.tema)===String(i)) o.selected=true; temaSel.appendChild(o); }
    temaSel.onchange = ()=>{ testsBancoFiltro.tema = temaSel.value; testsBancoFiltro.subtema=''; renderTests(); };
    temaField.appendChild(temaSel);
    row.appendChild(temaField);
    const subtemasBanco = testsBancoFiltro.tema ? testCatSubtemas(testsBancoFiltro.categoria, Number(testsBancoFiltro.tema)) : [];
    if(subtemasBanco.length){
      const subField = document.createElement('div'); subField.className='test-field';
      subField.innerHTML = '<label>Subtema</label>';
      const subSel = document.createElement('select');
      const optAllSub = document.createElement('option'); optAllSub.value=''; optAllSub.textContent='Todos'; subSel.appendChild(optAllSub);
      subtemasBanco.forEach((nombre,i)=>{ const o=document.createElement('option'); o.value=i+1; o.textContent=nombre; if(String(testsBancoFiltro.subtema)===String(i+1)) o.selected=true; subSel.appendChild(o); });
      subSel.onchange = ()=>{ testsBancoFiltro.subtema = subSel.value; renderTests(); };
      subField.appendChild(subSel);

    }
  }
  const searchField = document.createElement('div'); searchField.className='test-field'; searchField.style.flex='2';
  searchField.innerHTML = '<label>Buscar</label>';
  const searchInp = document.createElement('input'); searchInp.type='text'; searchInp.value = testsBancoFiltro.q; searchInp.placeholder='Buscar en el enunciado o el PDF de origen…';
  searchInp.oninput = ()=>{ testsBancoFiltro.q = searchInp.value; bancoVisibleCount = TESTBANCO_PAGE_SIZE; paintList(); };
  searchField.appendChild(searchInp);
  row.appendChild(searchField);
  panel.appendChild(row);
  if(testsBancoFiltro.problema){
    const fc = document.createElement('div'); fc.className = 'salud-filtro';
    fc.appendChild(document.createTextNode('Filtrando: '+(PROBLEMAS_BANCO[testsBancoFiltro.problema]||'')+' '));

    x.onclick = ()=>{ testsBancoFiltro.problema = ''; renderTests(); };
    fc.appendChild(x); panel.appendChild(fc);
  }
  const list = document.createElement('div'); list.className='test-list';
  panel.appendChild(list);
  body.appendChild(panel);

  function matchesFiltro(q){
    if(testsBancoFiltro.categoria && q.categoria!==testsBancoFiltro.categoria) return false;
    if(testsBancoFiltro.tema && q.tema!==Number(testsBancoFiltro.tema)) return false;
    if(testsBancoFiltro.subtema && q.subtema!==Number(testsBancoFiltro.subtema)) return false;
    if(testsBancoFiltro.problema && !problemaPregunta(q).includes(testsBancoFiltro.problema)) return false;
    if(testsBancoFiltro.q){
      const needle = testsBancoFiltro.q.toLowerCase();
      const enOrigen = q.origenArchivo && q.origenArchivo.toLowerCase().includes(needle);
      if(!q.enunciado.toLowerCase().includes(needle) && !enOrigen) return false;
    }
    return true;
  }
  function paintList(){
    list.innerHTML = '';
    if(testsBancoFiltro.papelera){
      const filtered = getTestBankTrash().filter(t=>t.q && matchesFiltro(t.q));

        const head = document.createElement('div'); head.className='tc-head';
        const imgTag = (q.imagenes && q.imagenes.length) ? ' 🖼' : '';
        const headTxt = document.createElement('span');
        headTxt.textContent = (q.enunciado||'(sin enunciado)').slice(0,140) + imgTag;
        head.appendChild(headTxt);
        const headTag = document.createElement('span'); headTag.className = 'tc-tag';
        headTag.style.cssText = 'background:color-mix(in srgb, '+testCatColor(q.categoria)+' 18%, transparent);color:'+testCatColor(q.categoria)+';border:1px solid '+testCatColor(q.categoria)+';border-radius:10px;padding:2px 8px;';
        headTag.textContent = questionTemaTag(q);
        head.appendChild(headTag);
        card.appendChild(head);
        const stat = document.createElement('div'); stat.className='tc-stat';
        stat.textContent = 'Eliminada el '+new Date(t.deletedAt).toLocaleString();
        card.appendChild(stat);
        const actions = document.createElement('div'); actions.className='tc-actions';
        const restoreBtn = document.createElement('button'); restoreBtn.type='button'; restoreBtn.textContent='Restaurar';
        restoreBtn.onclick = (e)=>{ e.stopPropagation(); restoreTestBankTrashItem(q.id); };
        actions.appendChild(restoreBtn);
        card.appendChild(actions);
        list.appendChild(card);
      });
      pintarMostrarMas(filtered.length);
      return;
    }
    const filtered = questions.filter(matchesFiltro).sort((a,b)=>b.creado-a.creado);
    if(!filtered.length){ list.innerHTML = '<div class="test-empty">No hay preguntas guardadas con este filtro todavía.</div>'; return; }
    const visibles = filtered.slice(0, bancoVisibleCount);
    visibles.forEach(q=>{
      const card = document.createElement('div'); card.className='test-card'; card.style.cursor='pointer';
      card.style.borderLeft = '3px solid '+testCatColor(q.categoria);
      card.title = 'Pulsa para ver la pregunta completa';
      card.onclick = ()=> openTestPreviewModal(q);
      const head = document.createElement('div'); head.className='tc-head';
      const imgTag = (q.imagenes && q.imagenes.length) ? ' 🖼' : '';
      const headTxt = document.createElement('span');
      headTxt.textContent = (q.enunciado||'(sin enunciado)').slice(0,140) + imgTag;
      head.appendChild(headTxt);
      const headTag = document.createElement('span'); headTag.className = 'tc-tag';
      headTag.style.cssText = 'background:color-mix(in srgb, '+testCatColor(q.categoria)+' 18%, transparent);color:'+testCatColor(q.categoria)+';border:1px solid '+testCatColor(q.categoria)+';border-radius:10px;padding:2px 8px;';
      headTag.textContent = questionTemaTag(q);
      head.appendChild(headTag);
      card.appendChild(head);
      const stat = document.createElement('div'); stat.className='tc-stat';
      let statTxt = q.stats.veces ? `Practicada ${q.stats.veces} vez(es) · ${q.stats.aciertos} acierto(s)` : 'Sin practicar todavía';
      if(q.origenArchivo) statTxt += ' · 📄 '+q.origenArchivo;
      stat.textContent = statTxt;
      card.appendChild(stat);
      const actions = document.createElement('div'); actions.className='tc-actions';
      const editBtn = document.createElement('button'); editBtn.type='button'; editBtn.textContent='Editar';
      editBtn.onclick = (e)=>{ e.stopPropagation(); openTestEditModal(q); };
      actions.appendChild(editBtn);
      const delBtn = document.createElement('button'); delBtn.type='button'; delBtn.textContent='Eliminar';
      delBtn.onclick = (e)=>{
        e.stopPropagation();
        if(!confirm('¿Eliminar esta pregunta del banco? Podrás recuperarla desde la Papelera durante '+TESTBANK_TRASH_DIAS+' días.')) return;
        const idx = state.testBank.questions.findIndex(x=>x.id===q.id);
        if(idx>=0){
          addToTestBankTrash(q);
          state.testBank.questions.splice(idx,1);
          deleteTestQuestionRemote(q.id);
          renderTests();
        }
      };
      actions.appendChild(delBtn);
      card.appendChild(actions);
      list.appendChild(card);
    });
    pintarMostrarMas(filtered.length);
  }
  // Botón "mostrar N más" al final de la lista, en vez de pintar de golpe las 3.000-4.000
  // tarjetas que puede llegar a tener el banco: solo se construyen en el DOM las que se han
  // pedido ver, lo que evita que el filtro/búsqueda se note lento con el banco completo cargado.
  function pintarMostrarMas(totalFiltrado){
    if(totalFiltrado <= bancoVisibleCount) return;
    const restantes = totalFiltrado - bancoVisibleCount;
    const moreBtn = document.createElement('button'); moreBtn.type='button'; moreBtn.className='btn ghost small';
    moreBtn.style.cssText = 'display:block;margin:10px auto 0;';
    moreBtn.textContent = 'Mostrar '+Math.min(TESTBANCO_PAGE_SIZE, restantes)+' más (quedan '+restantes+')';
    moreBtn.onclick = ()=>{ bancoVisibleCount += TESTBANCO_PAGE_SIZE; paintList(); };
    list.appendChild(moreBtn);
  }
  paintList();
}

        revisarResultado.textContent = texto;

      }finally{
        revisarBtn.disabled = false; revisarBtn.textContent = '🤖 Revisar con IA';

    box.appendChild(revisarResultado);

  btnRow.appendChild(closeBtn);

  document.body.appendChild(overlay);

function openTestEditModal(q){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:999;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;';

  box.appendChild(titleEl);

  let editCategoria = q.categoria, editTema = q.tema || null, editSubtema = q.subtema || null;
  // Estado local editable, tolerante con preguntas creadas antes de que existieran estos campos.
  let localOpts = (q.opciones||['','']).slice();
  let localCorrecta = q.correcta || 0;
  let localImagenes = (q.imagenes||[]).slice();
  // Si la pregunta es del formato antiguo (4 palabras sueltas sin frase, o la frase ya no
  // coincide), se empieza con la selección vacía: hay que volver a marcar las 4 palabras
  // haciendo clic sobre la frase (se avisa con un texto en el propio editor).
  const ortoEraFormatoNuevo = ortoEsFormatoNuevo(q.enunciado, q.palabras);
  let localOrto = {
    enunciado: q.enunciado || '',
    seleccion: ortoEraFormatoNuevo ? (q.palabras||[]).map(p=>({idx:p.idx, texto:p.texto, incorrecta:!!p.incorrecta})) : []
  };
  let localGramaticaCorrecta = (typeof q.correcta==='boolean') ? q.correcta : true;
  let localEnunciado = q.enunciado || '';
  let localExplicacion = q.explicacion || '';

  const row = document.createElement('div'); row.className='test-row';
  const catField = document.createElement('div'); catField.className='test-field';
  catField.innerHTML = '<label>Categoría</label>';
  const catSel = document.createElement('select');
  TEST_CATEGORIAS.forEach(c=>{ const o=document.createElement('option'); o.value=c.key; o.textContent=c.label; if(c.key===q.categoria) o.selected=true; catSel.appendChild(o); });

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
// Comprueba si una pregunta cae dentro de la selección de temas/subtemas hecha en "Practicar".
// pick.parciales vacío = sin filtro (toda la categoría). Un tema puede estar como 'ALL' (todo el
// tema, incluidas preguntas sin subtema asignado) o como Set de números de subtema concretos.
function questionMatchesPick(q, pick){
  if(pick.estado==='fallos' && !esFallada(q)) return false;
  if(pick.estado==='nuevas' && !esNueva(q)) return false;
  if(pick.estado==='repaso' && !tocaRepasar(q)) return false;
  if(pick.estado==='rebeldes' && !esRebelde(q)) return false;
  if(pick.estado==='marcadas' && !esMarcada(q)) return false;
  if(!pick.categoria) return true; // "Todas" las categorías: no se aplica ningún filtro de tema
  if(q.categoria !== pick.categoria) return false;
  if(!pick.parciales.size) return true; // "Todos" los temas de la categoría
  const sel = pick.parciales.get(q.tema);
  if(!sel) return false;
  if(sel === 'ALL') return true;
  return q.subtema != null && sel.has(q.subtema);
}
function renderTemaPicker(host, pick, onChange){
  host.innerHTML = '';
  const max = testCatTemas(pick.categoria);
  if(!pick.categoria){ host.innerHTML = '<div class="tema-picker-empty">Elige una categoría para poder filtrar por tema.</div>'; return; }
  if(!max){ host.innerHTML = '<div class="tema-picker-empty">Esta categoría no se divide en temas: se usarán todas sus preguntas.</div>'; return; }
  const wrap = document.createElement('div'); wrap.className='tema-picker';
  const allRow = document.createElement('label'); allRow.className='tema-picker-all';
  const allCheck = document.createElement('input'); allCheck.type='checkbox'; allCheck.className='t-check';
  allCheck.checked = pick.parciales.size===0;
  allCheck.onchange = ()=>{ pick.parciales.clear(); onChange(); };
  allRow.appendChild(allCheck);
  allRow.appendChild(document.createTextNode('Todos los temas'));
  wrap.appendChild(allRow);
  for(let i=1;i<=max;i++){
    const t = testCatTemaObj(pick.categoria, i);
    const subs = t.subtemas || [];
    const node = document.createElement('div'); node.className='tema-node';
    const head = document.createElement('div'); head.className='tema-node-head';
    const check = document.createElement('input'); check.type='checkbox'; check.className='t-check';
    const sel = pick.parciales.get(i);
    check.checked = sel==='ALL';
    check.onclick = (e)=> e.stopPropagation();
    check.onchange = ()=>{
      if(check.checked) pick.parciales.set(i,'ALL'); else pick.parciales.delete(i);
      onChange();
    };
    head.appendChild(check);
    const label = document.createElement('span'); label.className='tn-label'; label.textContent = t.nombre;
    head.appendChild(label);
    if(subs.length){
      const chev = document.createElement('span'); chev.className='tn-chev'; chev.textContent='▾';
      head.appendChild(chev);
      head.onclick = ()=> node.classList.toggle('open');
    }
    node.appendChild(head);
    if(subs.length){
      const bodyEl = document.createElement('div'); bodyEl.className='tema-node-body';
      subs.forEach((nombre,si)=>{
        const subNum = si+1;
        const subRow = document.createElement('label'); subRow.className='subtema-row';
        const subCheck = document.createElement('input'); subCheck.type='checkbox'; subCheck.className='t-check';
        const curSel = pick.parciales.get(i);
        subCheck.checked = curSel==='ALL' || (curSel instanceof Set && curSel.has(subNum));
        subCheck.onchange = ()=>{
          let cur = pick.parciales.get(i);
          if(cur==='ALL') cur = new Set(subs.map((_,x)=>x+1));
          if(!(cur instanceof Set)) cur = new Set();
          if(subCheck.checked) cur.add(subNum); else cur.delete(subNum);
          if(!cur.size) pick.parciales.delete(i);
          else if(cur.size===subs.length) pick.parciales.set(i,'ALL');
          else pick.parciales.set(i,cur);
          onChange();
        };
        subRow.appendChild(subCheck);
        subRow.appendChild(document.createTextNode(nombre));
        if(subtemaSuperado(pick.categoria, i, subNum)){
          const ok = document.createElement('span');
          ok.textContent = ' ✅';
          ok.title = 'Superado (mejor intento: '+mejorAciertosSubtema(pick.categoria,i,subNum)+'/'+UMBRAL_SUPERADO[pick.categoria]+' o más)';
          ok.style.color = 'var(--green)';
          subRow.appendChild(ok);
        }
        bodyEl.appendChild(subRow);
      });
      node.appendChild(bodyEl);
      if(subs.length && subs.every((_,si)=>subtemaSuperado(pick.categoria, i, si+1))){
        const okAll = document.createElement('span');
        okAll.textContent = ' ✅';
        okAll.title = 'Lección superada: los '+subs.length+' test están en verde';
        okAll.style.color = 'var(--green)';
        label.appendChild(okAll);
      }
    }
    wrap.appendChild(node);
  }
  host.appendChild(wrap);
}
let testsWizardPaso = 0; // 0=portada · 1=alcance · 2=temas · 3=orden · 4=numero · 5=modo · 6=tiempo · 7=resumen
function resetTestsWizard(){ testsWizardPaso = 0; }
function renderTestsPracticar(body){
  if(testsQuiz){ renderTestsQuizUI(body); return; }
  const questions = state.testBank.questions;
  const wrap = document.createElement('div'); wrap.className='wizard-wrap';
  if(testsWizardPaso>0 && testsWizardPaso!==20){
    const dots = document.createElement('div'); dots.className='wizard-dots';
    for(let i=1;i<=6;i++){ const d=document.createElement('i'); if(i<=testsWizardPaso) d.classList.add('on'); dots.appendChild(d); }
    wrap.appendChild(dots);
    const back = document.createElement('button'); back.type='button'; back.className='wizard-back'; back.innerHTML='← Atrás';
    back.onclick = wizardIrAtras;
    wrap.appendChild(back);
  }
  if(testsWizardPaso===0) renderWizardPortada(wrap, questions);
  else if(testsWizardPaso===1) renderWizardAlcance(wrap);
  else if(testsWizardPaso===2) renderWizardTemas(wrap, questions);
  else if(testsWizardPaso===3) renderWizardOrden(wrap);
  else if(testsWizardPaso===4) renderWizardNumero(wrap, questions);
  else if(testsWizardPaso===5) renderWizardModo(wrap);
  else if(testsWizardPaso===6) renderWizardTiempo(wrap);
  else if(testsWizardPaso===20) renderSimulacro(wrap, questions);
  else renderWizardResumen(wrap, questions);
  body.appendChild(wrap);
}
function wizardIrAtras(){
  if(testsWizardPaso===20){ testsWizardPaso=0; }
  else if(testsWizardPaso===2){ testsWizardPaso=1; }
  else if(testsWizardPaso===6){ testsWizardPaso=5; }
  else if(testsWizardPaso===3 && !testsPickState.categoria){ testsWizardPaso=1; } // Global / mis fallos / nuevas vienen directos del paso 1
  else if(testsWizardPaso===7){ testsWizardPaso = testsWizardCfg.modo==='instantaneo' ? 6 : 5; }
  else testsWizardPaso = Math.max(0, testsWizardPaso-1);
  renderTests();
}
function renderWizardPortada(wrap, questions){

// Recordatorio inteligente: busca, entre los temas que ya has practicado alguna vez,
// el que lleva más tiempo sin tocarse (según la fecha del último intento guardado en
// cada pregunta). Los temas que nunca has tocado no entran aquí: esos ya se ven
// destacados como "sin ver" en el mapa del temario.
// Notificaciones del recordatorio inteligente. Ojo: solo avisan si tienes la app abierta
// (en esta pestaña o en segundo plano en el móvil); como OpoTest no tiene servidor propio,
// no puede mandar un aviso "de verdad" con la app totalmente cerrada (eso necesitaría
// Firebase Cloud Messaging + una función programada, que es infraestructura aparte).
function notificacionesActivas(){
  try{ return localStorage.getItem('opotest-notif')==='1' && 'Notification' in window && Notification.permission==='granted'; }
  catch(e){ return false; }
}
async function activarNotificacionesRecordatorio(){
  if(!('Notification' in window)){ showToast('Este navegador no admite notificaciones.'); return; }
  try{
    const permiso = await Notification.requestPermission();
    if(permiso==='granted'){
      try{ localStorage.setItem('opotest-notif','1'); }catch(e){}
      showToast('Notificaciones activadas ✓');
    } else {
      showToast('No se han concedido permisos de notificación.');
    }
  }catch(e){ showToast('No se pudieron activar las notificaciones.'); }
  renderTests();
}
// Como mucho un aviso al día, para no ser pesados.
async function avisarRecordatorioNotificacion(texto){
  if(!notificacionesActivas()) return;
  const hoy = fmtFechaKey(new Date());
  try{ if(localStorage.getItem('opotest-notif-ultima')===hoy) return; localStorage.setItem('opotest-notif-ultima', hoy); }catch(e){}
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      const reg = await navigator.serviceWorker.ready;
      reg.showNotification('OpoTest', { body:texto, icon:'./icon-192.png', badge:'./icon-192.png', tag:'opotest-recordatorio' });
    } else if('Notification' in window){
      new Notification('OpoTest', { body:texto, icon:'./icon-192.png' });
    }
  }catch(e){}
}
function temaMasOlvidado(questions){
  const porTema = {};
  questions.forEach(q=>{
    if(!q.tema || !q.categoria) return;
    const st = q.stats;
    if(!st || !st.veces || !st.fecha) return;
    const key = q.categoria+'|'+q.tema;
    const t = porTema[key] = porTema[key] || { catKey:q.categoria, num:Number(q.tema), ultimaFecha:0 };
    if(st.fecha > t.ultimaFecha) t.ultimaFecha = st.fecha;
  });
  const arr = Object.values(porTema);
  if(!arr.length) return null;
  arr.sort((a,b)=> a.ultimaFecha - b.ultimaFecha);
  const peor = arr[0];
  return Object.assign({}, peor, { dias: Math.floor((Date.now()-peor.ultimaFecha)/86400000) });
}

// Segundos restantes a partir de los cuales se avisa en un simulacro cronometrado.
const SIM_AVISO_SEGUNDOS = 5*60;
let avisoAudioCtx = null;
// Dos pitidos cortos (Web Audio, sin archivos externos: funciona también sin conexión).
function reproducirAvisoSonoro(){
  try{
    if(!avisoAudioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      avisoAudioCtx = new AC();
    }
    if(avisoAudioCtx.state === 'suspended') avisoAudioCtx.resume();
    const t0 = avisoAudioCtx.currentTime;
    [0, 0.35].forEach(offset=>{
      const osc = avisoAudioCtx.createOscillator();
      const gain = avisoAudioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, t0+offset);
      gain.gain.exponentialRampToValueAtTime(0.28, t0+offset+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+offset+0.28);
      osc.connect(gain); gain.connect(avisoAudioCtx.destination);
      osc.start(t0+offset);
      osc.stop(t0+offset+0.3);
    });
  }catch(e){}
}
// Aviso de "quedan 5 minutos" en un simulacro: sonido + vibración (si el dispositivo la
// admite) + toast en pantalla, para notarlo aunque no estés mirando el temporizador.
function avisarUltimosMinutosSimulacro(){
  reproducirAvisoSonoro();
  try{ if(typeof navigator.vibrate === 'function') navigator.vibrate([250,120,250,120,250]); }catch(e){}

function ortografiaFallosCount(it){

function testItemFullyAnswered(it){

  // como respuesta explícita ("bien escrita"), así que siempre está "completo".

// Acierto de un ítem del test en curso (ortografía: sin ningún fallo de palabra).

// Guarda el resultado de UNA pregunta: estadísticas de la pregunta, último resultado (para "mis

function registrarResultadoPregunta(it, acierto, contarObjetivo, vibrarAlResponder){

  st.fecha = Date.now();
  st.nivel = acierto ? (st.nivel||0)+1 : 0;
  st.rachaFallos = acierto ? 0 : (st.rachaFallos||0)+1; // fallos SEGUIDOS: base de las "preguntas rebeldes"
  if(vibrarAlResponder) vibrar(acierto);

    corregido:false, simulacro: cfg.simulacro || null,
    instantaneo: !!cfg.instantaneo,
