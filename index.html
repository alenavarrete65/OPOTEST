// Al corregir: calcula el resumen del test (comparación con el anterior, preguntas recuperadas,
// objetivo del día) y lo añade al historial.
function registrarResultadoDelTest(){
  const items = testsQuiz.items, total = items.length;
  const aciertos = items.filter(itemAcierto).length;
  const previo = progreso.historial.length ? progreso.historial[progreso.historial.length-1] : null;
  const hoy = fmtFechaKey(new Date());
  testsQuiz.resultado = {
    total, aciertos,
    pct: total ? Math.round(aciertos/total*100) : 0,
    previoPct: (previo && previo.n) ? Math.round(previo.ac/previo.n*100) : null,
    recuperadas: items.filter(it=>it.prevFallada && itemAcierto(it)).length,
    siguenFallando: items.filter(it=>it.prevFallada && !itemAcierto(it)).length,
    hoyN: practicadasHoy(), meta: objetivoDiario(),
    recienCumplido: !testsQuiz.diaCumplidoAntes && progreso.dias.includes(hoy)
  };
  if(testsQuiz.simulacro){
    // Un simulacro no entra en el historial de tests normales (falsearía la gráfica de evolución): tiene su propia lista.
    const r = calcularNotaSimulacro(items, testsQuiz.simulacro.tipo);
    r.prev = progreso.simulacros.filter(x=>x.tipo===r.tipo).slice(-1)[0] || null;
    testsQuiz.resultadoSim = r;
    progreso.simulacros.push({ id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), t:Date.now(), tipo:r.tipo, nota:r.nota, max:r.max, apto:r.apto, dv:nombreDispositivo() });
    progreso.simulacros = progreso.simulacros.slice(-30);
  } else {
    progreso.historial.push({ id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), t:Date.now(), n:total, ac:aciertos, dv:nombreDispositivo() });
    progreso.historial = progreso.historial.slice(-40);
  }
  // Si el test cubre un único tema+subtema (p.ej. un "Test" de una lección de "Inglés con Pilar"),
  // guarda el mejor intento (más aciertos) para poder marcarlo en verde en el selector de temas.
  if(!testsQuiz.simulacro && total){
    const qs = items.map(it=>it.q);
    const cat = qs[0].categoria, tema = qs[0].tema, subtema = qs[0].subtema;
    if(cat && tema!=null && subtema!=null && qs.every(q=>q.categoria===cat && q.tema===tema && q.subtema===subtema)){
      const clave = claveSuperado(cat, tema, subtema);
      const anterior = progreso.superados[clave];
      if(!anterior || aciertos > anterior.ac){
        progreso.superados[clave] = { ac: aciertos, n: total, t: Date.now() };
      }
    }
  }
  programarGuardadoProgreso(true);
}

  const st = q.stats;

document.addEventListener('keydown', ev=>{

  const t = ev.target;
  if(t && ((t.tagName==='INPUT' && t.type!=='radio') || t.tagName==='TEXTAREA' || t.tagName==='SELECT' || t.isContentEditable)) return;
  const k = (ev.key||'').toLowerCase();
  let idx = -1;
  if(k.length===1 && '1234'.includes(k)) idx = Number(k)-1; else if(k.length===1 && 'abcd'.includes(k)) idx = 'abcd'.indexOf(k);
  if(idx<0) return;
  const cards = document.querySelectorAll('.test-quiz-q');

  for(let i=0;i<testsQuiz.items.length;i++){
    const it = testsQuiz.items[i];
    if(qTipo(it.q)!=='multiple' || it.respuesta!==null || it.revelado || !cards[i]) continue;

    if(cards[i].getBoundingClientRect().bottom > 90){ elegida = i; break; } // la más alta que aún se ve
  }

});

/* ===================== MODO AUDIO: lee las preguntas en voz alta (Web Speech API) =====================
   Pensado para repasar sin mirar la pantalla. Hay dos formas de usarlo:
   - El botón 🔊 de cada pregunta la lee solo a ella, suelta.
   - El botón 🔊 de la barra de herramientas activa el "modo audio": lee todas las preguntas
     del test, una tras otra, con una pequeña pausa entre cada una, hasta el final o hasta
     que lo detengas. Va encadenando utterances por su evento "onend", no con temporizadores
     fijos, así que respeta la velocidad real de la voz del dispositivo. */
let audioModoActivo = false;
let audioModoIdxActual = 0;
// Velocidad de lectura del modo audio: se guarda en este dispositivo. Se cicla entre unos
// valores fijos con el botón de la barra de herramientas (no todas las voces del sistema
// admiten cualquier velocidad, así que nos quedamos en un rango razonable).
const VELOCIDADES_AUDIO = [0.75, 1, 1.25, 1.5, 1.75, 2];
function velocidadAudio(){
  try{
    const v = Number(localStorage.getItem('opotest-audio-rate'));
    if(VELOCIDADES_AUDIO.includes(v)) return v;
  }catch(e){}
  return 1;
}
function ciclarVelocidadAudio(){
  const idx = VELOCIDADES_AUDIO.indexOf(velocidadAudio());
  const next = VELOCIDADES_AUDIO[(idx+1) % VELOCIDADES_AUDIO.length];
  try{ localStorage.setItem('opotest-audio-rate', String(next)); }catch(e){}
  showToast('Velocidad de lectura: '+next+'x');
  renderTests();
}
// Texto a leer para una pregunta: enunciado y, si es de opción múltiple, sus opciones.
function textoParaLeerAudio(it){
  const q = it.q, tipo = qTipo(q);
  const LETRAS_AUDIO = 'ABCDEFGHIJ';
  let t = q.enunciado || '';
  if(tipo==='multiple' && Array.isArray(q.opciones) && q.opciones.length){
    t += '. ' + q.opciones.map((o,i)=> 'Opción '+LETRAS_AUDIO[i]+': '+o).join('. ');
  } else if(tipo==='gramatica'){
    t += '. ¿Está bien escrita esta frase?';
  }
  return t.trim();
}
function detenerModoAudio(){
  audioModoActivo = false;
  try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}
}
function leerSiguientePreguntaAudio(){
  if(!audioModoActivo || !testsQuiz) return;
  while(audioModoIdxActual < testsQuiz.items.length){
    const it = testsQuiz.items[audioModoIdxActual];
    audioModoIdxActual++;
    const texto = textoParaLeerAudio(it);
    // Las de ortografía con formato de palabras sueltas no se narran bien en voz alta: se saltan.
    if(!texto || (qTipo(it.q)==='ortografia' && !ortoEsFormatoNuevo(it.q.enunciado, it.q.palabras))) continue;
    try{
      const u = new SpeechSynthesisUtterance(texto);
      u.lang = 'es-ES';
      u.rate = velocidadAudio();
      u.onend = ()=>{ if(audioModoActivo) setTimeout(leerSiguientePreguntaAudio, 900); };
      u.onerror = ()=>{ if(audioModoActivo) setTimeout(leerSiguientePreguntaAudio, 300); };
      speechSynthesis.speak(u);
    }catch(e){}
    return;
  }
  audioModoActivo = false;
  showToast('Modo audio: fin del test.');
}
function toggleModoAudio(){
  if(!('speechSynthesis' in window)){ showToast('Este navegador no admite lectura en voz alta.'); return; }
  if(audioModoActivo){ detenerModoAudio(); renderTests(); return; }
  audioModoActivo = true;
  audioModoIdxActual = 0;
  leerSiguientePreguntaAudio();
  renderTests();
}

function botonAudio(it){

function buildGraficaEvolucion(){

  }

  if(pcts.length>=6){
    const ult = pcts.slice(-5), prev = pcts.slice(-10,-5);
    const d = Math.round(media(ult) - media(prev.length ? prev : pcts.slice(0,-5)));

  } else nota.textContent = 'Media de tus '+pcts.length+' tests: '+Math.round(media(pcts))+'% · último: '+pcts[pcts.length-1]+'%';
  wrap.appendChild(nota);
  const NS = 'http://www.w3.org/2000/svg';
  const W = 300, H = 120, PL = 24, PR = 8, PT = 8, PB = 14;
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 0 '+W+' '+H); svg.setAttribute('class', 'evo-svg'); svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Gráfica con el porcentaje de acierto de tus últimos tests');
  const X = i=> PL + (pcts.length===1 ? 0 : i*(W-PL-PR)/(pcts.length-1));
  const Y = v=> PT + (100-v)*(H-PT-PB)/100;
  [0,50,75,100].forEach(v=>{
    const ln = document.createElementNS(NS, 'line');
    ln.setAttribute('x1', String(PL)); ln.setAttribute('x2', String(W-PR)); ln.setAttribute('y1', String(Y(v))); ln.setAttribute('y2', String(Y(v)));
    ln.setAttribute('class', 'evo-grid'+(v===50||v===75?' dash':''));
    svg.appendChild(ln);
    const tx = document.createElementNS(NS, 'text'); tx.setAttribute('x', '2'); tx.setAttribute('y', String(Y(v)+3)); tx.setAttribute('class', 'evo-lbl'); tx.textContent = v+'%';
    svg.appendChild(tx);
  });
  const poly = document.createElementNS(NS, 'polyline');
  poly.setAttribute('points', pcts.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' '));
  poly.setAttribute('class', 'evo-line'); poly.setAttribute('fill', 'none');
  svg.appendChild(poly);
  pcts.forEach((v,i)=>{
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', X(i).toFixed(1)); c.setAttribute('cy', Y(v).toFixed(1)); c.setAttribute('r', i===pcts.length-1 ? '4' : '2.8'); c.setAttribute('class', 'evo-dot'+(v>=75?' ok':(v<50?' mal':'')));
    const tt = document.createElementNS(NS, 'title');

    c.appendChild(tt);
    svg.appendChild(c);
  });
  wrap.appendChild(svg);
  return wrap;
}

function problemaPregunta(q){
  const p = [], tipo = qTipo(q);
  if(testCatTemas(q.categoria)>0 && !q.tema) p.push('sinTema');
  if(!(q.explicacion||'').trim()) p.push('sinExplic');
  if(tipo==='multiple'){
    const ops = (q.opciones||[]).filter(o=>String(o).trim());
    if(ops.length<2) p.push('pocasOpciones');
    if(typeof q.correcta!=='number' || q.correcta<0 || q.correcta>=(q.opciones||[]).length) p.push('sinCorrecta');
  } else if(tipo==='gramatica' && typeof q.correcta!=='boolean') p.push('sinCorrecta');
  return p;
}

function calcularSaludBanco(questions){
  const vivas = questions.filter(q=>!q.borrado);
  const conteo = { sinTema:0, sinExplic:0, sinCorrecta:0, pocasOpciones:0 };
  vivas.forEach(q=>problemaPregunta(q).forEach(k=>{ conteo[k]++; }));
  const porCat = TEST_CATEGORIAS.map(c=>{
    const qs = vivas.filter(q=>q.categoria===c.key);
    return { key:c.key, label:c.label, total:qs.length, sinTema:qs.filter(q=>!q.tema).length,
      temas: testCatTemario(c.key).map((t,i)=>({ num:i+1, nombre:t.nombre||('Tema '+(i+1)), n:qs.filter(q=>Number(q.tema)===i+1).length,

  });
  return { total:vivas.length, conteo, porCat };
}

/* ===================== SIMULACRO DE EXAMEN =====================
   Estructura tomada del cuestionario oficial (Cabos y Guardias, 2026, tipo A): Ortografía (5 frases, 20 palabras),
   Gramática (20 frases), Conocimientos generales (100) y Lengua inglesa (20), en ese orden. Aparte, el psicotécnico:
   80 preguntas. Las preguntas de reserva no se incluyen. Puntuación: acierto +1, blanco 0, fallo −0,33; ortografía y
   gramática, cada una por separado, aptas con 5 fallos o menos; psicotécnico sobre 30: (aciertos − 0,33·fallos) × 0,375.
   El reparto de teoría por temas es el del examen oficial (editable) o uno propio en %. */
const REPARTO_OFICIAL_CONOC = { '1':12,'2':1,'3':3,'4.1':5,'4.2':1,'4.3':1,'5.1':2,'5.2':2,'6':5,'7':4,'8':5,'9':9,'10.1':2,'10.2':2,'11':2,'12.1':2,'12.2':1,'13.1':3,'13.2':1,'14.1':2,'14.2':2,'15':9,'16.1':2,'16.2':1,'16.3':0,'17':4,'18':2,'19.1':1,'19.2':2,'20':1,'21':2,'22.1':2,'22.2':2,'23.1':2,'23.2':3 };
const SIM_TITULOS = { ortografia:'PRUEBA DE ORTOGRAFÍA', gramatica:'PRUEBA DE GRAMÁTICA', conocimientos:'PRUEBA DE CONOCIMIENTOS GENERALES', ingles:'PRUEBA DE LENGUA INGLESA', psico:'PRUEBA PSICOTÉCNICA' };
const SIM_DEFECTO = { orto:5, gram:20, ingles:20, minCon:140, psico:80, minPsico:55, modo:'oficial', total:100 };
let simCfg = null;
function getSimCfg(){
  if(simCfg) return simCfg;
  let c = {};
  try{ c = JSON.parse(localStorage.getItem('opotest-sim-cfg')||'{}') || {}; }catch(e){}
  simCfg = Object.assign({}, SIM_DEFECTO, c);
  simCfg.pct = (c.pct && typeof c.pct==='object') ? c.pct : {};
  return simCfg;
}
function saveSimCfg(){ try{ localStorage.setItem('opotest-sim-cfg', JSON.stringify(getSimCfg())); }catch(e){} }
// "4.1 Constitución…" → "4.1"; "15 Fuerzas…" → "15": así el reparto oficial sigue valiendo aunque reordenes el temario.
function codigoTema(nombre){ const m = /^\s*(\d+(?:\.\d+)?)/.exec(nombre||''); return m ? m[1] : ''; }
function temasConocimientos(){ return testCatTemario('conocimientos').map((t,i)=>({ num:i+1, nombre:t.nombre||('Tema '+(i+1)), codigo:codigoTema(t.nombre) })); }
// Convierte porcentajes en nº de preguntas enteros que suman exactamente `total` (mayor resto).
function repartirPorcentajes(pcts, total){
  const suma = pcts.reduce((a,b)=>a+(b>0?b:0), 0);
  if(!(suma>0) || !(total>0)) return pcts.map(()=>0);
  const exactos = pcts.map(p=>(p>0?p:0)/suma*total);
  const base = exactos.map(Math.floor);
  let resto = total - base.reduce((a,b)=>a+b, 0);
  exactos.map((e,i)=>({ i, f:e-base[i] })).sort((a,b)=>b.f-a.f).forEach(o=>{ if(resto>0){ base[o.i]++; resto--; } });
  return base;
}
function pctDesdeOficial(){
  const o = {}; temasConocimientos().forEach(t=>{ o[t.codigo] = REPARTO_OFICIAL_CONOC[t.codigo]||0; }); return o;
}
// Refuerzo de puntos débiles: parte del reparto oficial y multiplica el peso de cada tema según cómo lo llevas
// (flojo ×3, sin ver ×2, en camino ×1,8, dominado ×1). Los temas sin preguntas quedan a 0.
function pctSugeridosDebiles(questions){
  const boost = { flojo:2, sinver:1, camino:0.8, dominado:0 };
  const temas = temasConocimientos();
  const pesos = temas.map(t=>{
    const e = estadoTemaMapa(questions.filter(q=>q.categoria==='conocimientos' && Number(q.tema)===t.num));
    if(e.clave==='vacio') return 0;
    return (REPARTO_OFICIAL_CONOC[t.codigo]||0)*(1+boost[e.clave]);
  });
  const suma = pesos.reduce((a,b)=>a+b, 0);
  if(!(suma>0)) return pctDesdeOficial();
  const out = {}; temas.forEach((t,i)=>{ out[t.codigo] = Math.round(pesos[i]/suma*1000)/10; });
  return out;
}
function calcularReparto(cfg){
  const temas = temasConocimientos();
  const oficial = temas.map(t=>REPARTO_OFICIAL_CONOC[t.codigo]||0);
  let cuentas = oficial.slice();
  if(cfg.modo==='pct'){
    cuentas = repartirPorcentajes(temas.map(t=>Number(cfg.pct[t.codigo])||0), cfg.total);
    if(cuentas.every(n=>n===0)) cuentas = oficial.slice();
  }
  return temas.map((t,i)=>Object.assign({}, t, { oficial:oficial[i], n:cuentas[i] }));
}
function armarSimulacroConocimientos(cfg, questions){
  const avisos = [];
  const usados = new Set(), conoc = []; let faltan = 0;
  calcularReparto(cfg).forEach(t=>{
    if(!t.n) return;
    const tomadas = shuffleArr(questions.filter(q=>q.categoria==='conocimientos' && Number(q.tema)===t.num)).slice(0, t.n);
    tomadas.forEach(q=>{ conoc.push(q); usados.add(q.id); });
    if(tomadas.length<t.n){ faltan += t.n-tomadas.length; avisos.push('Tema '+(t.codigo||t.num)+': pide '+t.n+' y solo hay '+tomadas.length+'.'); }
  });
  if(faltan>0){
    const extra = shuffleArr(questions.filter(q=>q.categoria==='conocimientos' && !usados.has(q.id))).slice(0, faltan);
    extra.forEach(q=>conoc.push(q));
    avisos.push(extra.length<faltan ? 'Faltan '+(faltan-extra.length)+' preguntas de teoría en tu banco para completar el examen.' : 'He completado '+faltan+' pregunta(s) con otros temas.');
  }
  conoc.sort((a,b)=>(Number(a.tema)||999)-(Number(b.tema)||999)); // como el examen real: en orden de temario
  const de = (cat, n)=>{
    const pool = shuffleArr(questions.filter(q=>q.categoria===cat));
    if(pool.length<n) avisos.push(testCatLabel(cat)+': el examen lleva '+n+' y en tu banco solo hay '+pool.length+'.');
    return pool.slice(0, n);
  };
  return { chosen:[].concat(de('ortografia',cfg.orto), de('gramatica',cfg.gram), conoc, de('ingles',cfg.ingles)), avisos };
}
function armarSimulacroPsico(cfg, questions){
  const pool = shuffleArr(questions.filter(q=>q.categoria==='psico'));
  const avisos = pool.length<cfg.psico ? ['Psicotécnicos: el examen lleva '+cfg.psico+' y en tu banco solo hay '+pool.length+'.'] : [];
  return { chosen:pool.slice(0, cfg.psico), avisos };
}
// Nota de un simulacro según las reglas del examen (por sección y total).
function calcularNotaSimulacro(items, tipo){
  const porCat = {};
  items.forEach(it=>{ (porCat[it.q.categoria] = porCat[it.q.categoria] || []).push(it); });
  const secciones = [];
  ['ortografia','gramatica','conocimientos','ingles','psico'].forEach(cat=>{
    const its = porCat[cat]; if(!its) return;
    if(cat==='ortografia' || cat==='gramatica'){
      let fallos = 0, total = 0;
      its.forEach(it=>{
        if(cat==='ortografia'){ fallos += ortografiaFallosCount(it); total += (it.q.palabras||[]).length; }
        else { total += 1; if(it.respuesta!==it.q.correcta) fallos += 1; }
      });
      secciones.push({ cat, total, fallos, aciertos:total-fallos, blancos:0, puntos:null, max:null, apto: fallos<=5 });
    } else {
      let aciertos = 0, fallos = 0, blancos = 0;
      its.forEach(it=>{ if(it.respuesta===null) blancos++; else if(it.respuesta===it.q.correcta) aciertos++; else fallos++; });
      const bruto = aciertos - fallos*0.33;
      const puntos = cat==='psico' ? Math.max(0, bruto)*0.375 : bruto;
      secciones.push({ cat, total:its.length, aciertos, fallos, blancos, puntos, max: cat==='psico' ? its.length*0.375 : its.length, apto:null });
    }
  });
  let nota, max, apto = null;
  if(tipo==='psico'){
    const p = secciones.find(x=>x.cat==='psico') || { puntos:0, max:0 };
    nota = p.puntos; max = p.max;
  } else {
    const c = secciones.find(x=>x.cat==='conocimientos'), i = secciones.find(x=>x.cat==='ingles');
    nota = (c?c.puntos:0) + (i?i.puntos:0); max = (c?c.max:0) + (i?i.max:0);
    const aptos = secciones.filter(x=>x.apto!==null).map(x=>x.apto);
    apto = aptos.length ? aptos.every(Boolean) : null;
  }
  return { tipo: tipo==='psico' ? 'psico' : 'con', secciones, nota, max, apto };
}

function corregirQuizActual(){
  if(!testsQuiz || testsQuiz.corregido) return;
  const pendientes = testsQuiz.items.some(it=>!testItemFullyAnswered(it));
  if(pendientes){ showToast('En ortografía y gramática hay que responder todo: no se admite dejarlo en blanco.'); return; }
  clearQuizTimer();
  testsQuiz.corregido = true;
  borrarTestEnCurso();
  testsQuiz.items.forEach(it=>{
    // Las preguntas ya reveladas en modo instantáneo ya sumaron sus estadísticas al responder.
    if(it.revelado) return;
    const tipo = qTipo(it.q);
    // Una pregunta de opción múltiple en blanco cuenta como intento fallado, pero no suma al objetivo diario.
    const enBlanco = tipo==='multiple' && it.respuesta===null;
    registrarResultadoPregunta(it, itemAcierto(it), !enBlanco);
  });
  registrarResultadoDelTest();
  renderTests();
}
// Agrupa los resultados por categoría y aplica la fórmula de puntuación de cada una
// (teoría/inglés: +1/-0,33/0; psicotécnicos: fórmula sobre 30; ortografía/gramática: apto/no apto).
function buildScoreBanner(){
  const wrap = document.createElement('div');
  const byCat = new Map();
  testsQuiz.items.forEach(it=>{
    const cat = it.q.categoria;
    if(!byCat.has(cat)) byCat.set(cat, []);
    byCat.get(cat).push(it);
  });
  TEST_CATEGORIAS.forEach(c=>{
    if(!byCat.has(c.key)) return;
    const items = byCat.get(c.key);
    const banner = document.createElement('div'); banner.className='test-score-banner';
    if(c.key==='ortografia' || c.key==='gramatica'){
      let fallos = 0, totalJuicios = 0;
      items.forEach(it=>{
        if(c.key==='ortografia'){ fallos += ortografiaFallosCount(it); totalJuicios += it.q.palabras.length; }
        else { totalJuicios += 1; if(it.respuesta!==it.q.correcta) fallos += 1; }
      });
      const apto = fallos<=5;
      banner.innerHTML = `<div class="num" style="color:${apto?'var(--green)':'var(--red-text)'};">${apto?'APTO':'NO APTO'}</div>
        <div style="font-family:var(--font-mono);font-size:12px;color:var(--cream-dim);">${c.label}: ${fallos} fallo(s) de ${totalJuicios} valorados (máx. 5 permitidos, 6+ es no apto)</div>`;
    } else if(c.key==='psico'){
      let aciertos=0, fallos=0, blancos=0;
      items.forEach(it=>{ if(it.respuesta===null) blancos++; else if(it.respuesta===it.q.correcta) aciertos++; else fallos++; });
      const puntos = Math.max(0, (aciertos - fallos*0.33) * 0.375);
      banner.innerHTML = `<div class="num">${puntos.toFixed(2)} pt</div>
        <div style="font-family:var(--font-mono);font-size:12px;color:var(--cream-dim);">${c.label}: ${aciertos} acierto(s) · ${fallos} fallo(s) · ${blancos} en blanco (fórmula sobre 30 sobre 80 preg.)</div>`;
    } else {
      let aciertos=0, fallos=0, blancos=0;
      items.forEach(it=>{ if(it.respuesta===null) blancos++; else if(it.respuesta===it.q.correcta) aciertos++; else fallos++; });
      const puntos = aciertos*1 - fallos*0.33;
      banner.innerHTML = `<div class="num">${puntos.toFixed(2)} pt</div>
        <div style="font-family:var(--font-mono);font-size:12px;color:var(--cream-dim);">${c.label}: ${aciertos} acierto(s) · ${fallos} fallo(s) · ${blancos} en blanco (de ${items.length})</div>`;
    }
    wrap.appendChild(banner);
  });
  return wrap;
}

/* ===================== TAMAÑO DE TUS DATOS (medidor de espacio) ===================== */
// Aquí cada pregunta vive en su PROPIO documento de Firestore (límite: 1 MiB por documento), así
// que el banco entero no choca con ese techo aunque tenga miles de preguntas. Lo que sí puede
// llenarse, y por eso se mide:
//  1) el almacenamiento local del dispositivo (localStorage, ~5 MB según el navegador): guarda una
//     copia completa del banco, con las imágenes en base64, para poder abrir la app sin conexión;
//  2) una pregunta concreta con muchas imágenes (su documento tampoco puede pasar de 1 MiB);
//  3) el documento de progreso personal (users/{uid}/progreso/resumen, también 1 MiB).
// Las cifras de Firestore son una estimación (el JSON en UTF-8): en la práctica se le suman unos
// cientos de bytes de nombres de campo, así que se avisa con margen (60 % y 85 %).
const TAM_DOC_LIMITE   = 1024*1024;  // 1 MiB por documento de Firestore
const TAM_LOCAL_LIMITE = 5000000;    // ~5 MB de localStorage (en caracteres; varía según navegador)
const TAM_AVISO = 0.60, TAM_PELIGRO = 0.85;
var tamTimer = null; // var (no let) para que los "hooks" puedan llamarla sin importar el orden de carga

function tamBytes(v){
  try{ const s = JSON.stringify(v); return s===undefined ? 0 : new Blob([s]).size; }catch(e){ return 0; }
}
// Caracteres que ocupa TODO el localStorage de este dominio (claves + valores).
function tamUsoLocal(){
  let n = 0;
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      n += k.length + (localStorage.getItem(k)||'').length;
    }
  }catch(e){}
  return n;
}
function tamFmt(bytes){
  if(bytes >= 1048576) return (bytes/1048576).toLocaleString('es-ES',{maximumFractionDigits:1})+' MB';
  return (bytes/1024).toLocaleString('es-ES',{maximumFractionDigits: bytes<10240 ? 1 : 0})+' KB';
}
function tamPct(r){ return (r*100).toLocaleString('es-ES',{maximumFractionDigits:1})+' %'; }
function tamNivel(r){ return r>=TAM_PELIGRO ? 'peligro' : (r>=TAM_AVISO ? 'aviso' : 'ok'); }
function tamEl(tag, cls, txt){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt!==undefined) e.textContent = txt;
  return e;
}
function tamMedir(){
  const qs = (state.testBank && Array.isArray(state.testBank.questions)) ? state.testBank.questions : [];
  let total = 0, conImg = 0, pesoImg = 0;
  const filas = qs.map(q=>{
    const b = tamBytes(q);
    const nImg = (q.imagenes && q.imagenes.length) || 0;
    total += b;
    if(nImg){ conImg++; pesoImg += b; }
    return { q, b, nImg };
  });
  filas.sort((x,y)=>y.b-x.b);
  return { n: qs.length, total, conImg, pesoImg, top: filas.slice(0,5), local: tamUsoLocal(), progreso: tamBytes(progreso) };
}
function tamEtiquetaPregunta(q){
  const t = String(q.enunciado||'').replace(/\s+/g,' ').trim();
  if(!t) return '(pregunta sin texto: solo imagen)';
  return t.length>70 ? t.slice(0,70)+'…' : t;
}
function tamFilaBarra(f){
  const ratio = f.usado / f.limite;
  const nivel = f.forzar || tamNivel(ratio);
  const fila = tamEl('div','tam-fila');
  const cab = tamEl('div','tam-fila-cab');
  cab.appendChild(tamEl('span','tam-fila-titulo', f.titulo));
  cab.appendChild(tamEl('span','tam-fila-valor', tamFmt(f.usado)+' de '+f.limiteTxt+' · '+tamPct(ratio)));
  fila.appendChild(cab);
  const bar = tamEl('div','tam-bar tam-'+nivel);
  bar.setAttribute('role','progressbar');
  bar.setAttribute('aria-label', f.titulo);
  bar.setAttribute('aria-valuemin','0');
  bar.setAttribute('aria-valuemax','100');
  bar.setAttribute('aria-valuenow', String(Math.min(100, Math.round(ratio*100))));
  const fill = document.createElement('i');
  fill.style.width = Math.min(100, ratio>0 ? Math.max(ratio*100, 1.5) : 0)+'%';
  bar.appendChild(fill);
  fila.appendChild(bar);
  if(f.nota) fila.appendChild(tamEl('div','tam-nota', f.nota));
  return { fila, ratio, nivel };
}
async function limpiarCacheApp(){
  const pendientes = (typeof getTestBankPending==='function') ? getTestBankPending().length : 0;
  let aviso = 'Esto borra la copia local del banco y del temario en este dispositivo, y la caché de '
    + 'archivos de la app (se vuelven a descargar solos la próxima vez que tengas conexión). No toca '
    + 'tu progreso, un test que tengas a medias, un borrador de preguntas por IA sin guardar, ni tus '
    + 'claves de IA/Telegram.';
  if(pendientes > 0){
    aviso += '\n\n⚠ OJO: tienes '+pendientes+' cambio(s) del banco sin sincronizar todavía. Espera a '
      + 'tener conexión y a que se suban antes de vaciar la caché, o podrías perderlos.';
  }
  aviso += '\n\n¿Continuar?';
  if(!confirm(aviso)) return;
  try{ localStorage.removeItem(testBankCacheKey()); }catch(e){ console.error(e); }
  try{ localStorage.removeItem(temarioCacheKey()); }catch(e){ console.error(e); }
  try{
    if('caches' in window){
      const claves = await caches.keys();
      await Promise.all(claves.map(k=>caches.delete(k)));
    }
  }catch(e){ console.error(e); }
  try{
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
  }catch(e){ console.error(e); }
  showToast('Caché vaciada. Recargando…');
  setTimeout(()=> location.reload(), 700);
}

/* ===================== COPIA DE SEGURIDAD (JSON) ===================== */
// Recuerda cuándo se hizo la última copia manual, para poder avisar si ha pasado ya una
// semana. OpoTest no tiene servidor propio para mandar backups automáticos por email o
// subirlos solo a Drive: eso necesitaría infraestructura aparte (una función programada +
// un servicio de envío). Este aviso es el sustituto práctico: un recordatorio semanal
// para exportar la copia tú mismo, con un solo clic.
function fechaUltimoBackup(){
  try{ const v = Number(localStorage.getItem('opotest-backup-ultima')); return isFinite(v) && v>0 ? v : null; }catch(e){ return null; }
}
function marcarBackupHecho(){
  try{ localStorage.setItem('opotest-backup-ultima', String(Date.now())); }catch(e){}
}
function renderBackupBox(){
  const host = document.getElementById('backupBox');
  if(!host) return;
  // Tanto exportar como importar son acciones reservadas al admin: importar sustituye
  // el banco de preguntas (gestión), y exportar descarga el banco completo, no solo lo
  // que un usuario en modo lectura ve practicar. Los usuarios no-admin no ven este bloque.
  if(!isAdmin){ host.innerHTML=''; return; }
  const ultima = fechaUltimoBackup();
  const diasDesde = ultima ? Math.floor((Date.now()-ultima)/86400000) : null;
  const tocaAvisar = diasDesde===null || diasDesde>=7;
  const avisoTxt = ultima
    ? (tocaAvisar ? 'Han pasado '+diasDesde+' día'+(diasDesde===1?'':'s')+' desde tu última copia. Se recomienda una semanal.' : 'Última copia hace '+diasDesde+' día'+(diasDesde===1?'':'s')+'.')
    : 'Todavía no tienes ninguna copia exportada desde este dispositivo.';
  host.innerHTML = `
    <div style="font-family:var(--font-mono);font-size:12px;color:var(--amber-ink);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;">Copia de seguridad</div>
    <div style="font-size:12px;color:var(--cream-dim);margin-bottom:6px;">Independiente de Firebase: te sirve si algún día pierdes el acceso, se borra el proyecto, o quieres un respaldo local de tu banco de preguntas.</div>
    <div style="font-size:12px;margin-bottom:10px;color:${tocaAvisar?'var(--amber-ink)':'var(--cream-dim)'};">${tocaAvisar?'⏰ ':''}${avisoTxt}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn ghost small" id="exportBackupBtn">Exportar copia (JSON)</button>
      <label class="btn ghost small" style="cursor:pointer;">Importar copia (JSON)<input type="file" accept="application/json" id="importBackupInput" style="display:none;"></label>
      <label class="btn ghost small" style="cursor:pointer;">Añadir preguntas (JSON)<input type="file" accept="application/json" id="addQuestionsInput" style="display:none;"></label>
    </div>
    <div style="font-size:11px;color:var(--cream-dim);margin-top:6px;">"Añadir preguntas" NO borra nada: solo añade preguntas nuevas (o actualiza, por id, las que ya existieran con ese mismo id) al banco actual. Es la opción segura para meter de golpe un bloque nuevo de preguntas sin tocar el resto.</div>
  `;
  document.getElementById('exportBackupBtn').onclick = ()=> exportBackup(false);
  const importInput = document.getElementById('importBackupInput');
  if(importInput) importInput.onchange = importBackup;
  const addInput = document.getElementById('addQuestionsInput');
  if(addInput) addInput.onchange = addQuestionsFromFile;
}
// auto=true: se usa como red de seguridad justo antes de "Importar copia" (que sustituye TODO
// el banco), así que no descarga con el mismo nombre que una exportación manual (para no
// confundirlas) ni lanza su propio toast (el de importBackup ya informa de las dos cosas).
function exportBackup(auto){
  const payload = {app:'opotest', version:1, exportedAt:new Date().toISOString(), questions: state.testBank.questions};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = new Date().toISOString().slice(0,10);
  const marcaHora = new Date().toISOString().replace(/[:.]/g,'-');
  a.href = url;
  a.download = auto ? ('opotest-backup-antes-de-importar-'+marcaHora+'.json') : ('opotest-backup-'+today+'.json');
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  if(!auto) { marcarBackupHecho(); showToast('Copia exportada ✓'); }
}
function importBackup(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const data = JSON.parse(reader.result);
      const qs = Array.isArray(data.questions) ? data.questions : [];
      if(!qs.length){ showToast('El archivo no contiene preguntas.'); return; }
      if(!confirm('Esto SUSTITUIRÁ todas las preguntas guardadas por las del archivo. Antes de nada se descargará automáticamente una copia de seguridad del banco actual, por si acaso. ¿Continuar?')) return;
      // Red de seguridad: si el archivo importado es el equivocado (o uno viejo), el banco
      // actual queda descargado en el propio dispositivo antes de sustituirlo por nada.
      exportBackup(true);
      const newIds = new Set(qs.map(q=>q.id));
      const toRemove = (state.testBank.questions||[]).filter(q=>!newIds.has(q.id));
      state.testBank.questions = qs;
      cacheTestBankLocally();
      for(const q of toRemove){ await deleteTestQuestionRemote(q.id); }
      for(const q of qs){ await saveTestQuestionRemote(q); }
      setTestBankLastSync(Date.now());
      showToast('Copia importada ✓ (se descargó antes una copia de seguridad del banco anterior)');
      renderTests();
    }catch(err){
      console.error(err);
      showToast('No se pudo leer el archivo.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}
// A diferencia de "Importar copia" (que SUSTITUYE todo el banco), esto solo AÑADE: las preguntas
// cuyo id ya existe en el banco se actualizan (así una reimportación tras corregir algo no duplica
// nada), y el resto de preguntas existentes no se tocan. Pensado para meter de golpe un bloque
// nuevo (p.ej. un archivo exportado desde el script que genera "Inglés con Pilar") sin arriesgarse
// a borrar el resto del banco por accidente.
function addQuestionsFromFile(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const data = JSON.parse(reader.result);
      const qs = Array.isArray(data) ? data : (Array.isArray(data.questions) ? data.questions : []);
      if(!qs.length){ showToast('El archivo no contiene preguntas.'); return; }
      const malformadas = qs.filter(q=>!q || !q.id || !q.categoria || !Array.isArray(q.opciones) || q.opciones.length!==4 || !(q.correcta>=0 && q.correcta<=3));
      if(malformadas.length){ showToast('El archivo tiene '+malformadas.length+' pregunta(s) con formato inválido; no se ha importado nada.'); return; }
      const existentes = new Set((state.testBank.questions||[]).map(q=>q.id));
      const nuevas = qs.filter(q=>!existentes.has(q.id)).length;
      const actualizadas = qs.length - nuevas;
      if(!confirm('Se van a añadir '+nuevas+' pregunta(s) nueva(s)'+(actualizadas?' y actualizar '+actualizadas+' ya existente(s) (mismo id)':'')+' al banco actual. No se borra ni se toca ninguna otra pregunta. ¿Continuar?')) return;
      const porId = new Map((state.testBank.questions||[]).map(q=>[q.id,q]));
      qs.forEach(q=>porId.set(q.id, q));
      state.testBank.questions = Array.from(porId.values());
      cacheTestBankLocally();
      for(const q of qs){ await saveTestQuestionRemote(q); }
      setTestBankLastSync(Date.now());
      showToast('Preguntas añadidas ✓ ('+nuevas+' nuevas'+(actualizadas?', '+actualizadas+' actualizadas':'')+')');
      renderTests();
    }catch(err){
      console.error(err);
      showToast('No se pudo leer el archivo.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ===================== PERFILES Y APROBACIÓN (Firestore: users/{uid}) ===================== */
// Cada cuenta tiene un documento en users/{uid} con {email, aprobado, creado}. Las cuentas
// nuevas empiezan siempre con aprobado:false (no pueden auto-aprobarse, lo impone
// firestore.rules). Solo la cuenta admin puede cambiar ese campo.
async function ensureUserProfile(user){
  const ref = db.collection('users').doc(user.uid);
  try{
    const snap = await ref.get();
    if(snap.exists){
      const d = snap.data();
      isApproved = !!d.aprobado;
      userRole = d.rol === 'admin' ? 'admin' : 'lectura';
      isAdmin = isApproved && userRole === 'admin';
      return;
    }
    await ref.set({ email: user.email || '', aprobado: false, rol: 'lectura', creado: Date.now() });
    isApproved = false; userRole = 'lectura'; isAdmin = false;
  }catch(e){
    console.error(e);
    isApproved = false; userRole = 'lectura'; isAdmin = false;
  }
}

        try{
          await db.collection('users').doc(r.uid).set(patch, {merge:true});
          showToast(msg);
          renderAdminUsersBox();
        }catch(e){ console.error(e); showToast('No se pudo actualizar la cuenta.'); }
      };
      if(!r.aprobado){
        const btnLectura = document.createElement('button');
        btnLectura.type='button'; btnLectura.className='btn ghost small'; btnLectura.textContent='Aprobar (lectura)';
        btnLectura.onclick = ()=> setProfile({aprobado:true, rol:'lectura'}, 'Cuenta aprobada (lectura) ✓');
        btnRow.appendChild(btnLectura);
        const btnAdmin = document.createElement('button');
        btnAdmin.type='button'; btnAdmin.className='btn ghost small'; btnAdmin.textContent='Aprobar (admin)';
        btnAdmin.onclick = ()=> setProfile({aprobado:true, rol:'admin'}, 'Cuenta aprobada (admin) ✓');
        btnRow.appendChild(btnAdmin);
      } else {
        const btnToggleRole = document.createElement('button');
        btnToggleRole.type='button'; btnToggleRole.className='btn ghost small';
        btnToggleRole.textContent = rol === 'admin' ? 'Bajar a lectura' : 'Subir a admin';
        btnToggleRole.onclick = ()=> setProfile({rol: rol==='admin' ? 'lectura' : 'admin'}, 'Rol actualizado ✓');
        btnRow.appendChild(btnToggleRole);
        const btnRevoke = document.createElement('button');
        btnRevoke.type='button'; btnRevoke.className='btn ghost small'; btnRevoke.textContent='Revocar acceso';
        btnRevoke.onclick = ()=> setProfile({aprobado:false}, 'Acceso revocado');
        btnRow.appendChild(btnRevoke);
      }
      row.appendChild(btnRow);
      listEl.appendChild(row);

      // La actividad (tests guardados / racha) se pide aparte y no bloquea el resto del
      // panel: si la cuenta nunca ha guardado progreso, o las reglas de Firestore de este
      // proyecto todavía no se han actualizado con el permiso de lectura para la cuenta
      // dueña, simplemente se muestra "sin datos" en vez de romper el panel.
      db.collection('users').doc(r.uid).collection('progreso').doc('resumen').get()
        .then(pSnap=>{
          if(!pSnap.exists){ statsLine.textContent = 'Alta: ' + fmtFechaCorta(r.creado) + ' · sin actividad guardada todavía'; return; }
          const p = pSnap.data() || {};
          const nTests = Array.isArray(p.historial) ? p.historial.length : 0;
          const racha = calcularRachaDeDias(Array.isArray(p.dias) ? p.dias : []);
          statsLine.textContent = 'Alta: ' + fmtFechaCorta(r.creado) + ' · ' + nTests + ' test' + (nTests===1?'':'s') + ' guardado' + (nTests===1?'':'s')
            + (racha>0 ? ' · 🔥 ' + racha + ' día' + (racha===1?'':'s') + ' seguido' + (racha===1?'':'s') : '');
        })
        .catch(()=>{ statsLine.textContent = 'Alta: ' + fmtFechaCorta(r.creado) + ' · actividad no disponible'; });
    });
  }catch(e){
    console.error(e);
    summaryEl.textContent = '';
    listEl.textContent = 'No se pudo cargar la lista de cuentas.';
  }
}

let authMode = 'login'; // 'login' | 'register'
const authScreenEl = document.getElementById('authScreen');
const appMainEl = document.getElementById('appMain');
const logoutBtnEl = document.getElementById('logoutBtn');
const localCacheWarnIndicatorEl = document.getElementById('localCacheWarnIndicator');
if(localCacheWarnIndicatorEl){
  localCacheWarnIndicatorEl.onclick = ()=>{
    exportBackup(false);
    showToast('Copia de seguridad descargada. Para liberar espacio, revisa si hay preguntas con muchas imágenes o usa "Buscar duplicados" para limpiar el banco.');

}
const userEmailLabelEl = document.getElementById('userEmailLabel');
const authTitleEl = document.getElementById('authTitle');
const authEmailEl = document.getElementById('authEmail');
const authPasswordEl = document.getElementById('authPassword');
const authErrorEl = document.getElementById('authError');
const authSubmitBtnEl = document.getElementById('authSubmitBtn');
const authToggleModeBtnEl = document.getElementById('authToggleModeBtn');
const authForgotBtnEl = document.getElementById('authForgotBtn');

function showAuthError(msg){
  authErrorEl.textContent = msg;
  authErrorEl.style.display = msg ? 'block' : 'none';
}
function traduceErrorAuth(code){
  const map = {
    'auth/invalid-email':'Correo electrónico no válido.',
    'auth/user-not-found':'No existe ninguna cuenta con ese correo.',
    'auth/wrong-password':'Contraseña incorrecta.',
    'auth/invalid-credential':'Correo o contraseña incorrectos.',
    'auth/email-already-in-use':'Ya existe una cuenta con ese correo.',
    'auth/weak-password':'La contraseña debe tener al menos 6 caracteres.',
    'auth/too-many-requests':'Demasiados intentos. Prueba de nuevo en unos minutos.'
  };
  return map[code] || 'No se pudo completar la operación. Inténtalo de nuevo.';
}
authToggleModeBtnEl.onclick = ()=>{
  authMode = authMode==='login' ? 'register' : 'login';
  authTitleEl.textContent = authMode==='login' ? 'Iniciar sesión' : 'Crear cuenta';
  authSubmitBtnEl.textContent = authMode==='login' ? 'Entrar' : 'Crear cuenta';
  authToggleModeBtnEl.textContent = authMode==='login' ? 'Crear cuenta nueva' : 'Ya tengo cuenta';
  showAuthError('');
};
authSubmitBtnEl.onclick = async ()=>{
  const email = authEmailEl.value.trim();
  const password = authPasswordEl.value;
  if(!email || !password){ showAuthError('Rellena correo y contraseña.'); return; }
  if(!firebaseOk){ showAuthError('Falta configurar Firebase (ver FIREBASE_CONFIG en el código).'); return; }
  authSubmitBtnEl.disabled = true;
  showAuthError('');
  try{
    if(authMode==='login') await auth.signInWithEmailAndPassword(email, password);
    else await auth.createUserWithEmailAndPassword(email, password);
  }catch(e){
    console.error(e);
    showAuthError(traduceErrorAuth(e.code));
  }finally{
    authSubmitBtnEl.disabled = false;
  }
};
authForgotBtnEl.onclick = async ()=>{
  const email = authEmailEl.value.trim();
  if(!email){ showAuthError('Escribe tu correo arriba y vuelve a pulsar.'); return; }
  try{
    await auth.sendPasswordResetEmail(email);
    showToast('Te hemos enviado un correo para restablecer la contraseña.');
  }catch(e){
    console.error(e);
    showAuthError(traduceErrorAuth(e.code));
  }
};
logoutBtnEl.onclick = ()=>{ auth.signOut(); };

if(firebaseOk){
  auth.onAuthStateChanged(async (user)=>{
    if(user){
      currentUid = user.uid;
      isSuperAdmin = SUPER_ADMIN_UIDS.includes(currentUid);
      authScreenEl.style.display = 'none';
      appMainEl.style.display = 'block';
      logoutBtnEl.style.display = 'inline-block';
      userEmailLabelEl.textContent = user.email || '';
      if(isSuperAdmin){
        isAdmin = true; isApproved = true; userRole = 'admin';
        await bootApprovedApp();
      } else {
        await ensureUserProfile(user);
        if(isApproved){
          await bootApprovedApp();
        } else {
          document.getElementById('approvedApp').style.display = 'none';
          document.getElementById('pendingBox').style.display = 'block';
          renderPendingBox();
        }
      }
    } else {
      if(progresoTimer){ clearTimeout(progresoTimer); progresoTimer = null; }
      progreso = progresoVacio();
      currentUid = null;
      isAdmin = false;
      isSuperAdmin = false;
      isApproved = false;
      userRole = 'lectura';
      authScreenEl.style.display = 'block';
      appMainEl.style.display = 'none';
      logoutBtnEl.style.display = 'none';
      userEmailLabelEl.textContent = '';
    }
  });
} else {
  showAuthError('Falta configurar Firebase: edita FIREBASE_CONFIG en index.html con los datos de tu proyecto (ver README.md).');
}

/* ===================== ACCESIBILIDAD: navegación, etiquetas, aciertos/fallos y diálogos ===================== */
(function initA11y(){
  let uid = 0;
  const CONTROLS = ['INPUT','SELECT','TEXTAREA'];

  function markOptions(){
    // Correcta / incorrecta: además del color, símbolo y texto (para daltonismo y lectores de pantalla).
    document.querySelectorAll('.tq-opt, .tq-word-btn, .tq-orto-chip').forEach(el=>{
      const st = el.classList.contains('correcta') ? 'ok' : (el.classList.contains('incorrecta-elegida') ? 'bad' : '');
      const cur = el.getAttribute('data-a11y-mark') || '';
      const has = !!el.querySelector(':scope > .tq-mark');
      if(st === cur && (st === '' || has)) return;
      el.querySelectorAll(':scope > .tq-mark, :scope > .tq-mark-sr').forEach(x=>x.remove());
      el.removeAttribute('data-a11y-mark');
      if(!st) return;
      if(/[✓✕]/.test(el.textContent)) return; // ya lleva su propio símbolo (p. ej. la imagen que se comparte)
      const vis = document.createElement('span');
      vis.className = 'tq-mark tq-mark-' + st;
      if(el.classList.contains('tq-opt')){
        vis.textContent = st === 'ok' ? '✓ Correcta' : '✕ Tu respuesta';
        el.appendChild(vis);
      } else {
        vis.textContent = st === 'ok' ? '✓' : '✕';
        vis.setAttribute('aria-hidden','true');
        const sr = document.createElement('span');
        sr.className = 'sr-only tq-mark-sr';
        sr.textContent = st === 'ok' ? ' (correcta)' : ' (tu respuesta, incorrecta)';
        el.appendChild(vis); el.appendChild(sr);
      }
      el.setAttribute('data-a11y-mark', st);
    });
  }

  function sync(){
    // Secciones de Tests: navegación con la actual marcada.
    document.querySelectorAll('.test-subnav').forEach(nav=>{
      if(!nav.hasAttribute('role')){ nav.setAttribute('role','navigation'); nav.setAttribute('aria-label','Secciones de tests'); }
      nav.querySelectorAll('button').forEach(b=>{
        if(b.classList.contains('active')) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
      });
    });
    // Los títulos de panel son <h3>/<h4> sin <h2> encima: los anunciamos como nivel 2 sin tocar el estilo.
    document.querySelectorAll('h3:not([aria-level]), h4:not([aria-level])').forEach(h=>h.setAttribute('aria-level','2'));
    // Etiquetas sueltas: si justo después hay un campo, las vinculamos.
    document.querySelectorAll('label:not([for])').forEach(l=>{
      if(l.querySelector('input, select, textarea')) return;
      const c = l.nextElementSibling;
      if(c && CONTROLS.indexOf(c.tagName) >= 0){ if(!c.id) c.id = 'fld-' + (++uid); l.setAttribute('for', c.id); }
    });
    markOptions();
  }
  let queued = false;
  function queue(){ if(queued) return; queued = true; requestAnimationFrame(()=>{ queued = false; sync(); }); }
  new MutationObserver(queue).observe(document.body, {subtree:true, childList:true, attributes:true, attributeFilter:['class']});
  sync();

  /* ---- Diálogos creados por código (capa a pantalla completa colgada del <body>) ----
     Los reconocemos al aparecer: role="dialog", foco dentro, Tab atrapado, Esc para cerrar y foco de vuelta. */
  const stack = [];
  const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]):not([type="hidden"]),select:not([disabled]),textarea:not([disabled]),summary,[tabindex]:not([tabindex="-1"])';
  function isOverlay(n){
    return n.nodeType === 1 && n.tagName === 'DIV' && n.parentNode === document.body && !n.hasAttribute('data-a11y-dialog') &&
      /position:\s*fixed/.test(n.style.cssText) && parseInt(n.style.zIndex, 10) >= 900;
  }
  function focusables(root){ return Array.from(root.querySelectorAll(FOCUSABLE)).filter(el=>el.getClientRects().length>0); }
  function onAdd(n){
    const opener = document.activeElement; // lo que tenía el foco antes de abrir el diálogo
    n.setAttribute('data-a11y-dialog','1');
    n.setAttribute('role','dialog'); n.setAttribute('aria-modal','true');
    const h = n.querySelector('h1, h2, h3, h4');
    n.setAttribute('aria-label', (h && h.textContent.trim()) || 'Diálogo');
    const box = n.firstElementChild;
    if(box){ if(!box.hasAttribute('tabindex')) box.setAttribute('tabindex','-1'); try{ box.focus({preventScroll:true}); }catch(e){} }
    stack.push({node:n, opener:opener});
  }
  function onRemove(n){
    const i = stack.findIndex(d=>d.node === n);
    if(i < 0) return;
    const d = stack.splice(i,1)[0];
    const o = d.opener;
    if(i === stack.length && o && o !== document.body && document.contains(o) && typeof o.focus === 'function'){ try{ o.focus({preventScroll:true}); }catch(e){} }
  }
  new MutationObserver(recs=>{
    recs.forEach(r=>{
      r.addedNodes.forEach(n=>{ if(isOverlay(n)) onAdd(n); });
      r.removedNodes.forEach(n=>{ if(n.nodeType === 1 && n.hasAttribute('data-a11y-dialog')) onRemove(n); });
    });
  }).observe(document.body, {childList:true});

  document.addEventListener('keydown', e=>{
    if(!stack.length || e.isComposing) return;
    const top = stack[stack.length-1].node;
    if(e.key === 'Escape'){
      if(e.target && e.target.tagName === 'SELECT') return; // deja que Esc cierre solo el desplegable
      e.preventDefault(); e.stopPropagation();
      // Cerramos por el mismo camino que el usuario: su botón «Cerrar/Cancelar», o el clic en el fondo.
      const btn = Array.from(top.querySelectorAll('button')).find(b=>/^(cerrar|cancelar|volver|✕|×)$/i.test(b.textContent.trim()));
      if(btn) btn.click(); else top.click();
      return;
    }
    if(e.key === 'Tab'){
      const box = top.firstElementChild;
      const list = focusables(top);
      if(!list.length){ e.preventDefault(); if(box) box.focus(); return; }
      const first = list[0], last = list[list.length-1], active = document.activeElement;
      if(!top.contains(active)){ e.preventDefault(); first.focus(); }
      else if(e.shiftKey && (active === first || active === box)){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && active === last){ e.preventDefault(); first.focus(); }
    }
  }, true);
})();
</script>
